<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dictionary of Payment Systems — Graph</title>
    <style>
      :root {
        --bg: #edede9;
        --panel: #f5f5f1;
        --ink: #1c1c1a;
        --muted: #6d6d68;
        --line: #d4d4cf;
        --mono:
          ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
        --sans:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial,
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font: 15px/1.55 var(--sans);
        overflow: hidden;
      }
      a {
        color: inherit;
      }
      button {
        font: inherit;
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }

      #app {
        display: flex;
        height: 100dvh;
      }
      #stage {
        position: relative;
        flex: 1;
        min-width: 0;
        overflow: hidden;
      }
      #graph {
        position: absolute;
        inset: 0;
      }

      .round {
        display: grid;
        place-items: center;
        width: 38px;
        height: 38px;
        padding: 0;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 50%;
        cursor: pointer;
      }
      .round:hover {
        border-color: var(--ink);
      }
      .round svg {
        width: 16px;
        height: 16px;
      }

      #top-left {
        position: absolute;
        top: 18px;
        left: 18px;
        z-index: 3;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      #brand {
        font: 12px var(--mono);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
      }
      #info-btn {
        position: absolute;
        top: 18px;
        right: 18px;
        z-index: 3;
        font-family: var(--mono);
        font-size: 13px;
      }
      #hint {
        position: absolute;
        bottom: 16px;
        left: 18px;
        z-index: 2;
        margin: 0;
        font: 12px var(--mono);
        color: var(--muted);
        pointer-events: none;
      }

      .popover {
        position: absolute;
        top: 66px;
        z-index: 4;
        width: min(360px, calc(100% - 36px));
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: 0 10px 30px rgb(0 0 0 / 0.1);
      }
      #search {
        left: 18px;
        overflow: hidden;
      }
      #search input {
        width: 100%;
        padding: 12px 14px;
        background: transparent;
        border: 0;
        border-bottom: 1px solid var(--line);
        font: 15px var(--sans);
        color: var(--ink);
        outline: none;
      }
      #results {
        max-height: min(55vh, 420px);
        margin: 0;
        padding: 4px;
        overflow-y: auto;
        list-style: none;
      }
      #results li {
        padding: 7px 10px;
        border-radius: 7px;
        cursor: pointer;
      }
      #results li[aria-selected="true"] {
        background: var(--ink);
        color: var(--panel);
      }
      #results small {
        display: block;
        overflow: hidden;
        font-size: 12px;
        opacity: 0.7;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #results .none {
        color: var(--muted);
        cursor: default;
      }
      #info {
        right: 18px;
        padding: 16px 18px;
        font-size: 14px;
      }
      #info h2 {
        margin: 0 0 6px;
        font: 12px var(--mono);
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      #info p {
        margin: 0 0 8px;
      }
      #info p:last-child {
        margin-bottom: 0;
      }
      kbd {
        padding: 0 5px;
        border: 1px solid var(--line);
        border-radius: 4px;
        font: 12px var(--mono);
      }

      #panel {
        position: relative;
        flex: 0 0 var(--panel-width, min(560px, 42vw));
        height: 100%;
        overflow-y: auto;
        background: var(--panel);
        border-left: 1px solid var(--line);
      }
      #resizer {
        position: relative;
        z-index: 5;
        flex: 0 0 11px;
        margin: 0 -6px 0 -5px;
        cursor: col-resize;
        touch-action: none;
      }
      #resizer::after {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        left: 4px;
        width: 3px;
        background: transparent;
        transition: background 0.12s;
      }
      #resizer:hover::after,
      #resizer:focus-visible::after,
      .resizing #resizer::after {
        background: var(--ink);
      }
      #resizer:focus-visible {
        outline: none;
      }
      .resizing {
        cursor: col-resize;
        user-select: none;
      }
      #close {
        position: sticky;
        top: 16px;
        z-index: 2;
        float: right;
        margin: 16px 16px 0 0;
        font-size: 18px;
        line-height: 1;
      }
      #panel-body {
        padding: 30px 30px 44px;
      }
      .eyebrow,
      .label {
        font: 11px var(--mono);
        letter-spacing: 0.13em;
        text-transform: uppercase;
        color: var(--muted);
      }
      #panel h1 {
        margin: 6px 48px 12px 0;
        font-size: 26px;
        font-weight: 500;
        line-height: 1.15;
        letter-spacing: -0.01em;
        overflow-wrap: anywhere;
        outline: none;
      }
      .lede {
        margin: 0;
        font-size: 16px;
      }
      .block {
        margin-top: 24px;
        padding-top: 18px;
        border-top: 1px solid var(--line);
      }
      .label {
        display: block;
        margin-bottom: 12px;
      }
      .bubbles {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .bubble {
        max-width: 88%;
        padding: 10px 14px;
        font-size: 14px;
        border-radius: 10px;
      }
      .bubble:nth-child(odd) {
        align-self: flex-start;
        background: #fbfbf8;
        border: 1px solid var(--line);
      }
      .bubble:nth-child(even) {
        align-self: flex-end;
        background: var(--ink);
        color: #f5f5f1;
      }
      .bubble code {
        background: rgb(127 127 127 / 0.22);
      }
      .avoid {
        margin: 0;
        font-size: 14px;
        color: #3b3b38;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }
      .chip {
        padding: 3px 11px;
        font-size: 13px;
        text-decoration: none;
        background: transparent;
        border: 1px solid #a9a9a3;
        border-radius: 999px;
      }
      .chip:hover {
        background: var(--ink);
        border-color: var(--ink);
        color: var(--panel);
      }
      details summary {
        cursor: pointer;
        list-style-position: inside;
      }
      details .label {
        display: inline;
        margin: 0;
      }
      .entry {
        margin-top: 12px;
        font-size: 14px;
      }
      .entry p,
      .entry ul,
      .entry ol,
      .entry blockquote,
      .entry pre,
      .entry .table {
        margin: 0 0 12px;
      }
      .entry ul,
      .entry ol {
        padding-left: 20px;
      }
      .entry h4 {
        margin: 16px 0 6px;
        font-size: 14px;
      }
      .entry blockquote {
        padding-left: 12px;
        border-left: 2px solid var(--line);
      }
      .entry .table {
        overflow-x: auto;
      }
      .entry table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      .entry th,
      .entry td {
        padding: 6px 8px 6px 0;
        text-align: left;
        vertical-align: top;
        border-bottom: 1px solid var(--line);
      }
      .entry pre {
        padding: 10px;
        overflow-x: auto;
        background: #e7e7e2;
        border-radius: 6px;
      }
      code {
        padding: 1px 4px;
        font: 0.9em var(--mono);
        background: #e7e7e2;
        border-radius: 4px;
      }
      pre code {
        padding: 0;
        background: none;
      }

      @media (max-width: 720px) {
        #app {
          flex-direction: column;
        }
        #panel {
          flex: 0 0 58dvh;
          width: 100%;
          height: 58dvh;
          border-top: 1px solid var(--line);
          border-left: 0;
        }
        #panel-body {
          padding: 22px 20px 36px;
        }
        #hint,
        #resizer,
        .has-selection #brand {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <main id="stage">
        <div
          id="graph"
          role="img"
          aria-label="Force-directed graph of entries and the links between them. Use search to reach one by keyboard."
        ></div>
        <div id="top-left">
          <button
            id="search-btn"
            class="round"
            aria-label="Search entries"
            title="Search (/)"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              aria-hidden="true"
            >
              <circle cx="11" cy="11" r="7" />
              <path d="m20 20-3.8-3.8" />
            </svg>
          </button>
          <span id="brand">Dictionary of Payment Systems</span>
        </div>
        <button
          id="info-btn"
          class="round"
          aria-label="About this graph"
          aria-expanded="false"
          title="About"
        >
          i
        </button>
        <div id="search" class="popover" hidden>
          <input
            id="search-input"
            type="search"
            placeholder="Search entries"
            aria-label="Search entries"
            role="combobox"
            aria-expanded="true"
            aria-controls="results"
            autocomplete="off"
            spellcheck="false"
          />
          <ul id="results" role="listbox" aria-label="Matching entries"></ul>
        </div>
        <div id="info" class="popover" hidden>
          <h2>Reading the graph</h2>
          <p id="info-counts"></p>
          <p>
            Larger, darker circles are linked to by more entries. Dots on a line
            move in the direction of the link.
          </p>
          <p>
            Click a circle to read it. Drag to rearrange, scroll to zoom.
            <kbd>/</kbd> searches, <kbd>Esc</kbd> closes.
          </p>
        </div>
        <p id="hint">Click a circle, or press / to search</p>
      </main>
      <div
        id="resizer"
        role="separator"
        aria-orientation="vertical"
        aria-label="Resize details panel"
        aria-controls="panel"
        tabindex="0"
        title="Drag to resize, double-click to reset"
        hidden
      ></div>
      <aside id="panel" aria-label="Term details" hidden>
        <button id="close" class="round" aria-label="Close details">×</button>
        <div id="panel-body"></div>
      </aside>
    </div>

    <script id="graph-data" type="application/json">
      {"title":"Dictionary of Payment Systems","noun":"entry","nouns":"entries","labels":{"quotes":"Heard in the wild","note":"Note","outgoing":"Connects to","incoming":"Linked from","body":"Full entry"},"sections":["Participants","Card Transaction Lifecycle","Card Data and Messages","Security and Compliance","Fraud and Disputes","Fees and Currency","Bank Rails","Payment Methods","Payments Engineering"],"terms":[{"name":"Cardholder","section":0,"description":"The person a payment card is issued to, who pays with it and can challenge charges through the card issuer.","body":"\u003cp>A cardholder is the person a payment card is issued to. In the \u003ca href=\"#Four-party%20model\" data-term=\"Four-party model\">four-party model\u003c/a>, the cardholder pays a \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchant\u003c/a>, and their \u003ca href=\"#Issuer\" data-term=\"Issuer\">issuer\u003c/a> decides whether to approve the payment and then bills them or debits their account.\u003c/p>\u003cp>The cardholder is not always the party that owns the account or the person who placed the order. Those differences explain many payment support cases.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Role\u003c/th>\u003cth>Who it is\u003c/th>\u003cth>Example\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Cardholder\u003c/td>\u003ctd>Person issued the card\u003c/td>\u003ctd>Employee with a company card\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Account holder\u003c/td>\u003ctd>Party responsible for the account\u003c/td>\u003ctd>The company paying the card bill\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Merchant's customer\u003c/td>\u003ctd>Person who placed the order\u003c/td>\u003ctd>A teenager using a parent's card\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The last row causes a common failure. A parent sees an unfamiliar line on a statement, does not connect it with a purchase made by someone in the household, and reports it to the bank. The merchant then receives a \u003ca href=\"#Chargeback\" data-term=\"Chargeback\">chargeback\u003c/a> for an order that was delivered correctly. This is one route to \u003ca href=\"#Friendly%20fraud\" data-term=\"Friendly fraud\">friendly fraud\u003c/a>, and a clear \u003ca href=\"#Statement%20descriptor\" data-term=\"Statement descriptor\">statement descriptor\u003c/a> makes it less likely.\u003c/p>\u003cp>Cardholder protection depends on region and product. In the EU, \u003ca href=\"#PSD2\" data-term=\"PSD2\">PSD2\u003c/a> gives payers \u003ca href=\"#Refund\" data-term=\"Refund\">refund\u003c/a> rights for unauthorised transactions and limits their liability. In the US, Regulation Z covers credit cards and Regulation E covers debit cards, with different limits. Network dispute rights sit alongside these laws, and the cardholder uses them by contacting the issuer rather than the \u003ca href=\"#Card%20network\" data-term=\"Card network\">card network\u003c/a>.\u003c/p>\u003cp>Merchants should keep only the cardholder data they need. The card number, or \u003ca href=\"#PAN\" data-term=\"PAN\">PAN\u003c/a>, and the \u003ca href=\"#CVV\" data-term=\"CVV\">CVV\u003c/a> are covered by \u003ca href=\"#PCI%20DSS\" data-term=\"PCI DSS\">PCI DSS\u003c/a>, so most systems hold a \u003ca href=\"#Tokenization\" data-term=\"Tokenization\">token\u003c/a> in their place.\u003c/p>","avoid":"","usage":["This customer says they never bought from us, but the order shipped to their home address.","Someone else in the household may have used the card. Send the cardholder the order details before the dispute goes further."],"out":[5,1,2,60,57,35,48,20,4,24,26,37,39]},{"name":"Merchant","section":0,"description":"A business or person that accepts card payments for goods or services, directly or through a facilitator.","body":"\u003cp>A merchant is a business or person that accepts a card as payment for goods or services. Visa's rules separate a merchant with its own agreement with an \u003ca href=\"#Acquirer\" data-term=\"Acquirer\">acquirer\u003c/a> from a sponsored merchant that contracts through a \u003ca href=\"#Payment%20facilitator\" data-term=\"Payment facilitator\">payment facilitator\u003c/a>. Mastercard uses similar categories, and treats the facilitator as acting for the acquirer.\u003c/p>\u003cp>A business selling online is not automatically the merchant on the card transaction. The contract decides that.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Setup\u003c/th>\u003cth>Contract is with\u003c/th>\u003cth>Seller shown on the transaction\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Direct merchant\u003c/td>\u003ctd>Acquirer\u003c/td>\u003ctd>The business\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Sponsored merchant\u003c/td>\u003ctd>Payment facilitator\u003c/td>\u003ctd>The business\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Retailer on a marketplace\u003c/td>\u003ctd>Marketplace\u003c/td>\u003ctd>Usually the marketplace\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Product sold through a \u003ca href=\"#Merchant%20of%20record\" data-term=\"Merchant of record\">merchant of record\u003c/a>\u003c/td>\u003ctd>Reseller acting as merchant of record\u003c/td>\u003ctd>The reseller\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The merchant agrees to follow \u003ca href=\"#Card%20network\" data-term=\"Card network\">card network\u003c/a> rules through its contract. In practice this means describing the business accurately, showing a recognisable \u003ca href=\"#Statement%20descriptor\" data-term=\"Statement descriptor\">statement descriptor\u003c/a>, protecting card data under \u003ca href=\"#PCI%20DSS\" data-term=\"PCI DSS\">PCI DSS\u003c/a>, issuing a \u003ca href=\"#Refund\" data-term=\"Refund\">refund\u003c/a> when owed, and answering each \u003ca href=\"#Chargeback\" data-term=\"Chargeback\">chargeback\u003c/a>. For most online payments the merchant also carries the loss from fraud unless a \u003ca href=\"#Liability%20shift\" data-term=\"Liability shift\">liability shift\u003c/a> applies.\u003c/p>\u003cp>Each merchant is identified by a merchant ID assigned by its acquirer and classified with a \u003ca href=\"#Merchant%20category%20code\" data-term=\"Merchant category code\">merchant category code\u003c/a>. This classification is a frequent source of trouble. A business approved to sell software that starts selling supplements or gift cards no longer matches what it declared. The acquirer may notice through monitoring, then pause its \u003ca href=\"#Payout\" data-term=\"Payout\">payout\u003c/a> or close the \u003ca href=\"#Merchant%20account\" data-term=\"Merchant account\">merchant account\u003c/a> while it reviews the activity.\u003c/p>\u003cp>To avoid that, tell the acquirer or \u003ca href=\"#Payment%20service%20provider\" data-term=\"Payment service provider\">payment service provider\u003c/a> before adding a product line, changing ownership, or selling in a new country.\u003c/p>","avoid":"","usage":["Why did our payouts stop after we launched the gift card range?","We were onboarded as a software merchant. Risk flagged the new product, so we need to update our business profile with the acquirer."],"out":[3,9,10,4,35,37,20,60,47,32,23,11,6]},{"name":"Issuer","section":0,"description":"The bank or licensed institution that provides a card, approves or declines its payments and handles cardholder disputes.","body":"\u003cp>An issuer is the bank or licensed financial institution that provides a payment card to a \u003ca href=\"#Cardholder\" data-term=\"Cardholder\">cardholder\u003c/a> and holds the account behind it. When a card is used, the issuer makes the final decision on the \u003ca href=\"#Card%20authorization\" data-term=\"Card authorization\">card authorization\u003c/a>.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Stage\u003c/th>\u003cth>What the issuer does\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Card issue\u003c/td>\u003ctd>Checks the customer, opens the account, sets limits, provides the card\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Authorization\u003c/td>\u003ctd>Checks funds, card status and fraud risk, then approves or declines\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Clearing\" data-term=\"Clearing\">Clearing\u003c/a>\u003c/td>\u003ctd>Receives the final transaction record and posts it to the account\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Settlement\" data-term=\"Settlement\">Settlement\u003c/a>\u003c/td>\u003ctd>Pays the amount owed through the \u003ca href=\"#Card%20network\" data-term=\"Card network\">card network\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Dispute\u003c/td>\u003ctd>Takes the cardholder's claim and may raise a \u003ca href=\"#Chargeback\" data-term=\"Chargeback\">chargeback\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The issuer is often confused with the network. A customer may say &quot;Visa declined my card&quot;, but Visa and Mastercard do not usually make the credit or balance decision. The issuer does, and a \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchant\u003c/a> or \u003ca href=\"#Payment%20service%20provider\" data-term=\"Payment service provider\">payment service provider\u003c/a> cannot override it. When a payment fails at checkout with a generic \u003ca href=\"#Decline%20code\" data-term=\"Decline code\">decline code\u003c/a>, the person who can explain it is usually the issuer's support team. The merchant often sees only the code.\u003c/p>\u003cp>The issuer is also a different party from the \u003ca href=\"#Acquirer\" data-term=\"Acquirer\">acquirer\u003c/a>, which works for the merchant. One bank can play both roles in different transactions.\u003c/p>\u003cp>Consumer fintech cards add a layer. The app's brand may appear on the card while a licensed bank or e-money institution is the actual issuer, often with a program manager running the product. A \u003ca href=\"#Sponsor%20bank\" data-term=\"Sponsor bank\">sponsor bank\u003c/a> arrangement of this kind is common in the US.\u003c/p>\u003cp>In the EU, \u003ca href=\"#PSD2\" data-term=\"PSD2\">PSD2\u003c/a> treats issuing payment instruments as a regulated payment service, and the issuer is responsible for applying \u003ca href=\"#Strong%20customer%20authentication\" data-term=\"Strong customer authentication\">strong customer authentication\u003c/a> unless an exemption applies.\u003c/p>","avoid":"","usage":["The customer says their card works everywhere except on our site.","Our logs show a do-not-honor from the issuer. We can't see why, so they need to call the number on the back of the card."],"out":[0,13,21,22,4,60,1,6,29,3,12,48,45]},{"name":"Acquirer","section":0,"description":"The licensed institution that signs merchants, submits their card transactions and answers to the network for them.","body":"\u003cp>An acquirer is the bank or licensed institution that contracts with a \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchant\u003c/a> to accept card payments, enters those transactions into the \u003ca href=\"#Card%20network\" data-term=\"Card network\">card network\u003c/a>, and arranges for the merchant to be paid. Visa's rules define it as a member that signs a merchant or \u003ca href=\"#Payment%20facilitator\" data-term=\"Payment facilitator\">payment facilitator\u003c/a> and enters transactions into interchange, the exchange of transactions between members. In the EU, \u003ca href=\"#PSD2\" data-term=\"PSD2\">PSD2\u003c/a> treats acquiring as a regulated payment service.\u003c/p>\u003cp>The acquirer is the merchant-side counterpart of the \u003ca href=\"#Issuer\" data-term=\"Issuer\">issuer\u003c/a>.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Party\u003c/th>\u003cth>Works for\u003c/th>\u003cth>Main job\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Issuer\u003c/td>\u003ctd>\u003ca href=\"#Cardholder\" data-term=\"Cardholder\">Cardholder\u003c/a>\u003c/td>\u003ctd>Approves payments and bills the card account\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Acquirer\u003c/td>\u003ctd>Merchant\u003c/td>\u003ctd>Sponsors the merchant on the network and funds it\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Payment%20processor\" data-term=\"Payment processor\">Payment processor\u003c/a>\u003c/td>\u003ctd>Either party\u003c/td>\u003ctd>Runs the transaction systems, often for an acquirer\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Payment%20gateway\" data-term=\"Payment gateway\">Payment gateway\u003c/a>\u003c/td>\u003ctd>Merchant\u003c/td>\u003ctd>Connects the checkout to the processing systems\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The acquirer carries financial responsibility to the network for the merchants it signs. If a merchant closes while \u003ca href=\"#Chargeback\" data-term=\"Chargeback\">chargebacks\u003c/a> are still arriving, and cannot repay them, the acquirer can be left covering the loss. Mastercard's rules also make an acquirer responsible for the acts and omissions of its payment facilitators and their sponsored merchants.\u003c/p>\u003cp>An acquirer therefore reviews a business before onboarding, using \u003ca href=\"#KYB\" data-term=\"KYB\">KYB\u003c/a> checks, and keeps monitoring it afterwards. A sudden jump in sales, a rising \u003ca href=\"#Chargeback%20ratio\" data-term=\"Chargeback ratio\">chargeback ratio\u003c/a>, or a move into a higher-risk product can lead it to delay a \u003ca href=\"#Payout\" data-term=\"Payout\">payout\u003c/a>, impose a \u003ca href=\"#Rolling%20reserve\" data-term=\"Rolling reserve\">rolling reserve\u003c/a>, or end the relationship.\u003c/p>\u003cp>Many businesses never deal with an acquirer directly. A \u003ca href=\"#Payment%20service%20provider\" data-term=\"Payment service provider\">payment service provider\u003c/a> may hold the acquiring relationship, or partner with one or more acquirers, and present a single contract. If support asks &quot;who is your acquirer?&quot;, check the provider's terms or \u003ca href=\"#Settlement\" data-term=\"Settlement\">settlement\u003c/a> reports rather than assuming the provider is the acquirer.\u003c/p>","avoid":"","usage":["Why are they holding back part of our payouts all of a sudden?","Our volume tripled in a month. The acquirer is on the hook if those orders turn into chargebacks, so it added a reserve."],"out":[1,4,9,48,2,0,8,7,60,50,65,23,72,6,22]},{"name":"Card network","section":0,"description":"The organisation that runs a card brand's rules and message rails between issuers and acquirers, such as Visa or Mastercard.","body":"\u003cp>A card network, also called a card scheme, is the organisation that operates a card brand. It connects \u003ca href=\"#Issuer\" data-term=\"Issuer\">issuers\u003c/a> and \u003ca href=\"#Acquirer\" data-term=\"Acquirer\">acquirers\u003c/a>, carries their messages, calculates what they owe each other, and publishes the rules they must follow. Visa and Mastercard operate globally. Others include American Express, Discover, JCB and UnionPay, along with domestic schemes such as Cartes Bancaires in France and girocard in Germany.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Function\u003c/th>\u003cth>What the network does\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Routing\u003c/td>\u003ctd>Passes each \u003ca href=\"#Card%20authorization\" data-term=\"Card authorization\">card authorization\u003c/a> from acquirer to issuer and back\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Clearing\" data-term=\"Clearing\">Clearing\u003c/a>\u003c/td>\u003ctd>Exchanges final transaction records between members\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Settlement\" data-term=\"Settlement\">Settlement\u003c/a>\u003c/td>\u003ctd>Calculates net positions so members can pay each other\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Rules\u003c/td>\u003ctd>Sets acceptance, data, dispute and monitoring requirements\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Fees\u003c/td>\u003ctd>Charges \u003ca href=\"#Scheme%20fee\" data-term=\"Scheme fee\">scheme fees\u003c/a> and administers \u003ca href=\"#Interchange%20fee\" data-term=\"Interchange fee\">interchange\u003c/a> where applicable\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>In the \u003ca href=\"#Four-party%20model\" data-term=\"Four-party model\">four-party model\u003c/a>, the network does not hold the \u003ca href=\"#Cardholder\" data-term=\"Cardholder\">cardholder's\u003c/a> account or lend money. This is why &quot;Visa declined the payment&quot; is usually inaccurate: the issuer declined it, and the network delivered the answer. The network can still affect the result in narrower cases, such as stand-in processing when an issuer is unavailable, or fraud services an issuer chooses to use.\u003c/p>\u003cp>Network rules are private contracts that bind members, which then pass them on to \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchants\u003c/a> through their agreements. They are not law, and they vary by network and region. A rule that applies to Visa in Europe may not apply to Visa in the US or to Mastercard anywhere. Networks also revise their rules regularly.\u003c/p>\u003cp>For engineers, this means a behaviour observed on one brand should not be assumed for another. If code branches on \u003ccode>network\u003c/code>, check the current rulebook or your provider's documentation for each brand, and record which edition the logic was based on.\u003c/p>","avoid":"","usage":["Mastercard let us capture this after a week, so Visa should too, right?","Not necessarily. The networks have different authorization rules, so check each one before we hard-code the window."],"out":[2,3,13,21,22,67,66,5,0,1]},{"name":"Four-party model","section":0,"description":"The card payment structure linking cardholder, merchant, issuer and acquirer through a card network.","body":"\u003cp>The four-party model is the standard structure of a card payment. The four parties are the \u003ca href=\"#Cardholder\" data-term=\"Cardholder\">cardholder\u003c/a>, the \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchant\u003c/a>, the cardholder's \u003ca href=\"#Issuer\" data-term=\"Issuer\">issuer\u003c/a> and the merchant's \u003ca href=\"#Acquirer\" data-term=\"Acquirer\">acquirer\u003c/a>. A \u003ca href=\"#Card%20network\" data-term=\"Card network\">card network\u003c/a> sits between the two institutions and is not counted as one of the four.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Party\u003c/th>\u003cth>Relationship\u003c/th>\u003cth>Role in a payment\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Cardholder\u003c/td>\u003ctd>Customer of the issuer\u003c/td>\u003ctd>Presents the card\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Merchant\u003c/td>\u003ctd>Customer of the acquirer\u003c/td>\u003ctd>Sells goods and requests payment\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Issuer\u003c/td>\u003ctd>Member of the network\u003c/td>\u003ctd>Approves and pays on the cardholder's behalf\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Acquirer\u003c/td>\u003ctd>Member of the network\u003c/td>\u003ctd>Submits transactions and funds the merchant\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Network\u003c/td>\u003ctd>Connects issuer and acquirer\u003c/td>\u003ctd>Routes messages and applies rules\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The structure explains why a merchant cannot ask &quot;the bank&quot; what happened to a payment. The merchant has a relationship only with its acquirer or \u003ca href=\"#Payment%20service%20provider\" data-term=\"Payment service provider\">payment service provider\u003c/a>, and the cardholder has one only with the issuer. A decline reason, a missing \u003ca href=\"#Refund\" data-term=\"Refund\">refund\u003c/a> or a \u003ca href=\"#Chargeback\" data-term=\"Chargeback\">chargeback\u003c/a> has to pass through that chain, so each side sees only part of the picture. Shared references such as the \u003ca href=\"#Acquirer%20reference%20number\" data-term=\"Acquirer reference number\">acquirer reference number\u003c/a> exist to connect the two views.\u003c/p>\u003cp>The alternative is a three-party scheme, in which the scheme itself acts as both issuer and acquirer. EU \u003ca href=\"#Interchange%20fee\" data-term=\"Interchange fee\">Interchange\u003c/a> Fee Regulation 2015/751 defines both structures, and treats a three-party scheme as four-party when it licenses other providers to issue or acquire, or issues cards with a co-branding partner or through an agent. American Express and Discover are commonly described as three-party networks, but both also work with partner institutions in some markets, so the label depends on the product and country.\u003c/p>\u003cp>Money flows between issuer and acquirer through \u003ca href=\"#Settlement\" data-term=\"Settlement\">settlement\u003c/a>.\u003c/p>","avoid":"","usage":["Can't we just ask the customer's bank why it failed?","They won't talk to us. We're on the acquirer side of the four-party model, so the customer has to contact their issuer."],"out":[0,1,2,3,4,6,20,60,33,66,22]},{"name":"Payment service provider","section":0,"description":"A company that lets merchants accept payments, or in EU law, an institution authorised to provide payment services.","body":"\u003cp>A payment service provider (PSP) is a company that gives \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchants\u003c/a> the means to accept payments, usually through one contract and one API. The term has two meanings, and they do not always describe the same company.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Sense\u003c/th>\u003cth>Meaning\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Commercial\u003c/td>\u003ctd>A vendor that bundles checkout, processing, reporting and payouts\u003c/td>\u003c/tr>\u003ctr>\u003ctd>EU legal\u003c/td>\u003ctd>Under \u003ca href=\"#PSD2\" data-term=\"PSD2\">PSD2\u003c/a>, a defined category such as a credit institution, e-money institution or payment institution\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A company can be a PSP commercially while relying on a licensed partner for the regulated activity. Check the contract to see which entity holds the funds and which is the \u003ca href=\"#Acquirer\" data-term=\"Acquirer\">acquirer\u003c/a>.\u003c/p>\u003cp>The roles around a PSP are often blurred because one vendor may perform several of them.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Role\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Holds merchant funds?\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#Payment%20gateway\" data-term=\"Payment gateway\">Payment gateway\u003c/a>\u003c/td>\u003ctd>Passes payment data to processing systems\u003c/td>\u003ctd>Usually not\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Payment%20processor\" data-term=\"Payment processor\">Payment processor\u003c/a>\u003c/td>\u003ctd>Runs authorization and \u003ca href=\"#Clearing\" data-term=\"Clearing\">clearing\u003c/a> messages\u003c/td>\u003ctd>Usually not\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Acquirer\u003c/td>\u003ctd>Signs the merchant and answers to the network\u003c/td>\u003ctd>Yes, or via a partner\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Payment%20facilitator\" data-term=\"Payment facilitator\">Payment facilitator\u003c/a>\u003c/td>\u003ctd>Onboards sub-merchants under an acquirer\u003c/td>\u003ctd>Often\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Merchant%20of%20record\" data-term=\"Merchant of record\">Merchant of record\u003c/a>\u003c/td>\u003ctd>Is the legal seller of the goods to the buyer\u003c/td>\u003ctd>Yes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PSP\u003c/td>\u003ctd>Packages some or all of the above\u003c/td>\u003ctd>Depends on the model\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A PSP may be a payment facilitator for small accounts and offer a direct acquiring contract to large ones, so the same vendor name can imply different responsibilities.\u003c/p>\u003cp>The cost of this bundling appears when a merchant tries to leave. Saved cards are often held as PSP-specific \u003ca href=\"#Tokenization\" data-term=\"Tokenization\">tokens\u003c/a> in the provider's \u003ca href=\"#Card%20vault\" data-term=\"Card vault\">card vault\u003c/a>, so they do not work elsewhere until the card data is migrated. Ask about export terms before integrating, and store your own record of each payment rather than treating the PSP's dashboard as your only source of truth.\u003c/p>","avoid":"","usage":["We can switch PSPs over the weekend, right?","Not with saved cards. Our tokens only work with the current provider, so we need a vault migration first."],"out":[1,48,3,7,8,21,9,10,39,41]},{"name":"Payment gateway","section":0,"description":"The technical service that carries payment details from a checkout to processing systems and returns the result.","body":"\u003cp>A payment gateway is the technical service that takes payment details from a \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchant's\u003c/a> checkout, sends them securely toward the \u003ca href=\"#Payment%20processor\" data-term=\"Payment processor\">payment processor\u003c/a> or \u003ca href=\"#Acquirer\" data-term=\"Acquirer\">acquirer\u003c/a>, and returns the response. It is the connection between the merchant's system and the card payment infrastructure. In a physical shop, the terminal and its software do a similar job.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Role\u003c/th>\u003cth>Main question it answers\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Gateway\u003c/td>\u003ctd>How does this request reach the card rails?\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Payment processor\u003c/td>\u003ctd>How is the transaction message handled?\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Acquirer\u003c/td>\u003ctd>Which licensed institution takes on this merchant?\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Payment%20service%20provider\" data-term=\"Payment service provider\">Payment service provider\u003c/a>\u003c/td>\u003ctd>Who sells the merchant the packaged service?\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A standalone gateway usually does not hold the merchant's money. Under \u003ca href=\"#PSD2\" data-term=\"PSD2\">PSD2\u003c/a>, technical service providers that support payments without ever possessing the funds are excluded from the directive, which is one reason a pure gateway may not need a payment licence in the EU. Whether a specific business qualifies depends on what it actually does. Many modern providers combine gateway, processing and acquiring, so &quot;gateway&quot; often describes one layer of a larger product.\u003c/p>\u003cp>Because it handles card data, a gateway falls under \u003ca href=\"#PCI%20DSS\" data-term=\"PCI DSS\">PCI DSS\u003c/a> as a service provider. It commonly also offers \u003ca href=\"#Tokenization\" data-term=\"Tokenization\">tokenization\u003c/a>, \u003ca href=\"#Hosted%20payment%20fields\" data-term=\"Hosted payment fields\">hosted payment fields\u003c/a>, and \u003ca href=\"#3-D%20Secure\" data-term=\"3-D Secure\">3-D Secure\u003c/a> integration.\u003c/p>\u003cp>The failure engineers meet most often here is a timeout. The merchant sends a charge to the gateway, the connection drops, and nobody on the merchant's side knows whether the \u003ca href=\"#Issuer\" data-term=\"Issuer\">issuer\u003c/a> approved it. This is an \u003ca href=\"#Unknown%20payment%20outcome\" data-term=\"Unknown payment outcome\">unknown payment outcome\u003c/a>. Retrying blindly can produce a \u003ca href=\"#Double%20charge\" data-term=\"Double charge\">double charge\u003c/a>. Instead, send a stable idempotency key (a client-generated value that makes retries safe) if the gateway supports one, then query the transaction status before attempting the payment again.\u003c/p>","avoid":"","usage":["The gateway timed out on that order. Should the worker just retry the charge?","Not yet. Look up the payment by its reference first. It may have been approved even though we never got the response."],"out":[1,8,3,6,48,37,39,43,44,2,107,106]},{"name":"Payment processor","section":0,"description":"The company whose systems handle card transaction messages and records for an acquirer or issuer.","body":"\u003cp>A payment processor is a company that runs the systems handling card transactions on behalf of an \u003ca href=\"#Acquirer\" data-term=\"Acquirer\">acquirer\u003c/a> or \u003ca href=\"#Issuer\" data-term=\"Issuer\">issuer\u003c/a>. It formats and routes messages, tracks transaction state, and produces the files used for \u003ca href=\"#Clearing\" data-term=\"Clearing\">clearing\u003c/a> and \u003ca href=\"#Settlement\" data-term=\"Settlement\">settlement\u003c/a>. The licensed institution remains accountable to the \u003ca href=\"#Card%20network\" data-term=\"Card network\">card network\u003c/a> even when a processor does the technical work.\u003c/p>\u003cp>Processors are usually divided by side and by stage.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Type\u003c/th>\u003cth>Works for\u003c/th>\u003cth>Handles\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Acquirer processor\u003c/td>\u003ctd>Acquirer\u003c/td>\u003ctd>Card acceptance, batches and reporting\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Issuer processor\u003c/td>\u003ctd>Issuer\u003c/td>\u003ctd>Card accounts, authorization decisions under issuer rules, posting\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Front-end processor\u003c/td>\u003ctd>Either\u003c/td>\u003ctd>Real-time \u003ca href=\"#Card%20authorization\" data-term=\"Card authorization\">card authorization\u003c/a> messages\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Back-end processor\u003c/td>\u003ctd>Either\u003c/td>\u003ctd>Clearing files, settlement data and dispute records\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The distinction from nearby terms is about responsibility. A \u003ca href=\"#Payment%20gateway\" data-term=\"Payment gateway\">payment gateway\u003c/a> connects a \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchant's\u003c/a> checkout to processing. A processor runs the transaction work behind that connection. An acquirer holds the licence or network membership and takes on the merchant's risk. A \u003ca href=\"#Payment%20service%20provider\" data-term=\"Payment service provider\">payment service provider\u003c/a> may package all three. Merchants often say &quot;our processor&quot; when they mean whichever vendor they pay, so confirm the actual role before relying on the word.\u003c/p>\u003cp>Processor problems tend to appear as gaps between systems. A batch that was not submitted on time means authorized sales do not reach clearing, so funds arrive late and the hold stays on the customer's card. A partial outage may produce approvals in one system with no matching record in another. These cases surface during \u003ca href=\"#Payment%20reconciliation\" data-term=\"Payment reconciliation\">payment reconciliation\u003c/a>, when expected sales are missing from a \u003ca href=\"#Settlement%20file\" data-term=\"Settlement file\">settlement file\u003c/a>.\u003c/p>\u003cp>When investigating, compare identifiers across stages: the authorization code, the \u003ca href=\"#Network%20transaction%20ID\" data-term=\"Network transaction ID\">network transaction ID\u003c/a> and, once cleared, the \u003ca href=\"#Acquirer%20reference%20number\" data-term=\"Acquirer reference number\">acquirer reference number\u003c/a>. The stage where the identifier disappears shows where the transaction stopped.\u003c/p>","avoid":"","usage":["Tuesday's sales were authorized, but they're missing from the settlement report.","Looks like the processor never submitted that batch. Ask them to confirm it and resubmit before the authorizations go stale."],"out":[3,2,21,22,4,13,7,1,6,111,112,34,33]},{"name":"Payment facilitator","section":0,"description":"A company registered through an acquirer to onboard and process payments for smaller sponsored merchants.","body":"\u003cp>A payment facilitator, or PayFac, is a company registered through an \u003ca href=\"#Acquirer\" data-term=\"Acquirer\">acquirer\u003c/a> to accept card payments on behalf of smaller businesses, called sponsored \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchants\u003c/a> or sub-merchants. Instead of each business getting its own \u003ca href=\"#Merchant%20account\" data-term=\"Merchant account\">merchant account\u003c/a>, the facilitator onboards them under its own acquiring relationship, often quickly.\u003c/p>\u003cp>Network definitions differ. Visa classes a facilitator as a third-party agent and treats an entity as one if it deposits transactions, receives \u003ca href=\"#Settlement\" data-term=\"Settlement\">settlement\u003c/a>, or contracts with an acquirer on behalf of a sponsored merchant. Mastercard defines it as a service provider registered by an acquirer to facilitate transactions for submerchants, and its rules make the acquirer responsible for the facilitator and those submerchants.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Party\u003c/th>\u003cth>Responsibility\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Acquirer\u003c/td>\u003ctd>Registers the facilitator, answers to the network\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Payment facilitator\u003c/td>\u003ctd>Onboards, monitors and usually pays sub-merchants\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Sponsored merchant\u003c/td>\u003ctd>Sells goods and remains the seller to the \u003ca href=\"#Cardholder\" data-term=\"Cardholder\">cardholder\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Card%20network\" data-term=\"Card network\">Card network\u003c/a>\u003c/td>\u003ctd>Sets the facilitator program rules\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The term is often confused with two others. A \u003ca href=\"#Payment%20service%20provider\" data-term=\"Payment service provider\">payment service provider\u003c/a> is a broader commercial label, and many PSPs operate as facilitators for small accounts. A \u003ca href=\"#Merchant%20of%20record\" data-term=\"Merchant of record\">merchant of record\u003c/a> is itself the seller, whereas a sponsored merchant stays the seller and the facilitator provides the acceptance. Visa also treats a marketplace as a separate category.\u003c/p>\u003cp>Fast onboarding has a visible cost. The facilitator may let a business start charging after light checks, then complete fuller \u003ca href=\"#KYB\" data-term=\"KYB\">KYB\u003c/a> review once volume grows. A seller can therefore process payments for weeks and then find its \u003ca href=\"#Payout\" data-term=\"Payout\">payout\u003c/a> paused until it supplies ownership documents. Facilitators do this because they carry risk for \u003ca href=\"#Chargeback\" data-term=\"Chargeback\">chargebacks\u003c/a> from sub-merchants that disappear.\u003c/p>","avoid":"","usage":["Our new seller processed fine for a month, and now their payout is frozen.","They hit the review threshold on our PayFac. Ask them for the ownership documents so compliance can release it."],"out":[3,1,11,22,0,4,6,10,50,23,60]},{"name":"Merchant of record","section":0,"description":"The legal entity that sells to the buyer in a card payment and takes responsibility for that sale and its disputes.","body":"\u003cp>A merchant of record (MoR) is the legal entity that sells goods or services to the buyer in a transaction. Its name appears on the \u003ca href=\"#Cardholder\" data-term=\"Cardholder\">cardholder's\u003c/a> statement, it takes the payment, and it handles \u003ca href=\"#Refund\" data-term=\"Refund\">refunds\u003c/a> and \u003ca href=\"#Chargeback\" data-term=\"Chargeback\">chargebacks\u003c/a> for that sale. A software company may sell through an MoR, which buys or licenses the product and resells it to the end customer.\u003c/p>\u003cp>The term is widely used but is not defined identically everywhere. Visa's risk guidance uses it for a marketplace that contracts with the \u003ca href=\"#Acquirer\" data-term=\"Acquirer\">acquirer\u003c/a>, rather than the underlying retailers. Visa's rules also look at who sells to the cardholder, whose name identifies the outlet, and who gives the cardholder recourse.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Model\u003c/th>\u003cth>Legal seller to the buyer\u003c/th>\u003cth>Who handles disputes\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Direct merchant\u003c/td>\u003ctd>The business\u003c/td>\u003ctd>The business\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Payment%20facilitator\" data-term=\"Payment facilitator\">Payment facilitator\u003c/a>\u003c/td>\u003ctd>The sponsored merchant\u003c/td>\u003ctd>Sponsored merchant, via facilitator\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Marketplace\u003c/td>\u003ctd>Usually the marketplace\u003c/td>\u003ctd>Marketplace, under its terms\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Merchant of record\u003c/td>\u003ctd>The MoR\u003c/td>\u003ctd>The MoR\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A facilitator helps a business accept cards while that business stays the seller. An MoR takes the seller's position, so it commonly also handles customer invoices and sales tax or VAT collection. The business then receives a net \u003ca href=\"#Payout\" data-term=\"Payout\">payout\u003c/a> from the MoR after its fee, taxes and refunds. Which obligations move, and in which countries, depends on the contract and local tax law.\u003c/p>\u003cp>The symptom customers notice is an unfamiliar name. Someone buys a tool from a small software company and sees the MoR's name on their statement, assumes it is fraud, and calls their bank. A clear \u003ca href=\"#Statement%20descriptor\" data-term=\"Statement descriptor\">statement descriptor\u003c/a> and a receipt naming both companies reduce these disputes.\u003c/p>","avoid":"","usage":["Customers keep asking why their receipt shows a company they've never heard of.","That's our merchant of record. Let's put our product name in the descriptor and explain the reseller on the receipt."],"out":[0,20,60,3,9,23,35]},{"name":"Merchant account","section":0,"description":"The acquiring relationship that lets a business accept cards, identified by a merchant ID. It is not a normal bank account.","body":"\u003cp>A merchant account is the arrangement between a business and an \u003ca href=\"#Acquirer\" data-term=\"Acquirer\">acquirer\u003c/a> that allows the business to accept card payments. It is identified by a merchant ID and carries the terms agreed at onboarding, including what the business sells, its \u003ca href=\"#Merchant%20category%20code\" data-term=\"Merchant category code\">merchant category code\u003c/a>, currencies and risk limits.\u003c/p>\u003cp>Despite the name, it is usually not an account the business can spend from. Card proceeds are tracked against it, then paid to a separate bank account.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Item\u003c/th>\u003cth>What it is\u003c/th>\u003cth>Can the business spend from it?\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Merchant account\u003c/td>\u003ctd>Acquiring contract and transaction record\u003c/td>\u003ctd>No\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PSP balance\u003c/td>\u003ctd>Amount a provider currently owes the business\u003c/td>\u003ctd>Only by \u003ca href=\"#Payout\" data-term=\"Payout\">payout\u003c/a>, in most setups\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Business bank account\u003c/td>\u003ctd>Ordinary account that receives the payout\u003c/td>\u003ctd>Yes\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>This explains a common question from finance teams: the dashboard shows sales as successful, but the bank balance has not moved. The funds are still between \u003ca href=\"#Settlement\" data-term=\"Settlement\">settlement\u003c/a> and payout, or they have been reduced by \u003ca href=\"#Refund\" data-term=\"Refund\">refunds\u003c/a>, fees, \u003ca href=\"#Chargeback\" data-term=\"Chargeback\">chargebacks\u003c/a> or a \u003ca href=\"#Rolling%20reserve\" data-term=\"Rolling reserve\">rolling reserve\u003c/a>.\u003c/p>\u003cp>There are two common setups. With a dedicated merchant account, the business has a direct contract with an acquirer, which usually involves more underwriting and more control over pricing and data. With an aggregated setup, a \u003ca href=\"#Payment%20facilitator\" data-term=\"Payment facilitator\">payment facilitator\u003c/a> holds the acquiring relationship and the business is a sponsored merchant beneath it, which is quicker to start but gives the provider more control over funds and account status.\u003c/p>\u003cp>If an acquirer closes a merchant account for rule violations, the closure can be recorded in network-run lists of terminated merchants, such as Mastercard's MATCH, which can make it harder to open a new one.\u003c/p>","avoid":"","usage":["The dashboard says we took 40k this week, so why isn't it in the bank?","That's the merchant account view. The payout goes out after settlement, minus refunds and the reserve."],"out":[3,32,23,22,20,60,72,9]},{"name":"Sponsor bank","section":0,"description":"A licensed bank or network member that gives a non-member company access to card networks under its membership.","body":"\u003cp>A sponsor bank is a licensed bank, and member of a \u003ca href=\"#Card%20network\" data-term=\"Card network\">card network\u003c/a>, that lets a company without its own membership take part in card payments. A fintech issuing cards, a non-bank \u003ca href=\"#Payment%20processor\" data-term=\"Payment processor\">payment processor\u003c/a> or a \u003ca href=\"#Payment%20facilitator\" data-term=\"Payment facilitator\">payment facilitator\u003c/a> can operate under the sponsor's membership, while the sponsor remains answerable to the network and its regulators.\u003c/p>\u003cp>Sponsorship can sit on either side of a transaction.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Side\u003c/th>\u003cth>Sponsored company\u003c/th>\u003cth>What the sponsor provides\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Issuing\u003c/td>\u003ctd>Fintech card program or program manager\u003c/td>\u003ctd>The \u003ca href=\"#Issuer\" data-term=\"Issuer\">issuer\u003c/a> role, \u003ca href=\"#BIN\" data-term=\"BIN\">BIN\u003c/a> access, regulated accounts\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Acquiring\u003c/td>\u003ctd>Independent sales organisation, PayFac\u003c/td>\u003ctd>\u003ca href=\"#Acquirer\" data-term=\"Acquirer\">Acquirer\u003c/a> membership and access to \u003ca href=\"#Settlement\" data-term=\"Settlement\">settlement\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A sponsor bank differs from a partner bank that only holds deposits. The sponsor's network membership is what gives the company access to the card rails. It also differs from a processor, which runs technology but does not itself provide the membership.\u003c/p>\u003cp>The model is common in the US, where non-bank companies frequently reach Visa and Mastercard through a sponsoring bank. It is not universal. The Bank of England's guide for FCA-authorised non-bank providers says it is possible to be a direct participant in Visa and Mastercard in most respects while settling through another organisation. In the EU, \u003ca href=\"#PSD2\" data-term=\"PSD2\">PSD2\u003c/a> generally requires payment system access rules to be objective, non-discriminatory and proportionate. Each network sets its own eligibility criteria.\u003c/p>\u003cp>Because the sponsor carries the regulatory exposure, it sets conditions on the program. It may review marketing, require \u003ca href=\"#KYC\" data-term=\"KYC\">KYC\u003c/a> and \u003ca href=\"#AML\" data-term=\"AML\">AML\u003c/a> controls, and audit the company's operations. If a sponsor exits a program or a regulator restricts it, the company can lose card access or need to migrate customers to a new BIN, which means new card numbers for customers. Check what the contract says about termination and transition.\u003c/p>","avoid":"","usage":["Why does compliance need to approve the copy for our card launch?","We issue under our sponsor bank's membership. If our marketing breaks its rules, it's their licence at risk."],"out":[4,8,9,2,25,3,22,48,49,51]},{"name":"Card authorization","section":1,"description":"A real-time request asking the card issuer to approve a payment and usually reserve funds, without moving money yet.","body":"\u003cp>A card authorization is a real-time request asking the \u003ca href=\"#Issuer\" data-term=\"Issuer\">issuer\u003c/a> whether a card payment can go ahead. If approved, the issuer usually reserves the amount with an \u003ca href=\"#Authorization%20hold\" data-term=\"Authorization hold\">authorization hold\u003c/a>. In the usual dual-message card flow, no money moves at this step.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Step\u003c/th>\u003cth>Who\u003c/th>\u003cth>What happens\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\u003ca href=\"#Merchant\" data-term=\"Merchant\">Merchant\u003c/a>\u003c/td>\u003ctd>Sends amount and card details through its provider\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\u003ca href=\"#Acquirer\" data-term=\"Acquirer\">Acquirer\u003c/a>\u003c/td>\u003ctd>Formats the request and forwards it to the network\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\u003ca href=\"#Card%20network\" data-term=\"Card network\">Card network\u003c/a>\u003c/td>\u003ctd>Routes the request to the issuer\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>Issuer\u003c/td>\u003ctd>Checks status, funds and risk, then responds\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Merchant\u003c/td>\u003ctd>Receives an approval or a \u003ca href=\"#Decline%20code\" data-term=\"Decline code\">decline code\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Authorization is the first of four stages that people often merge into &quot;the payment&quot;.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Stage\u003c/th>\u003cth>Question it answers\u003c/th>\u003cth>Money moves?\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Authorization\u003c/td>\u003ctd>Will the issuer approve this?\u003c/td>\u003ctd>No, funds are reserved\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Capture\" data-term=\"Capture\">Capture\u003c/a>\u003c/td>\u003ctd>Does the merchant want to take payment?\u003c/td>\u003ctd>No\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Clearing\" data-term=\"Clearing\">Clearing\u003c/a>\u003c/td>\u003ctd>What is the final transaction record?\u003c/td>\u003ctd>No, amounts are calculated\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Settlement\" data-term=\"Settlement\">Settlement\u003c/a>\u003c/td>\u003ctd>Who pays whom?\u003c/td>\u003ctd>Yes, between institutions\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Treating an approval as completed payment causes a familiar bug. An order system marks a sale &quot;paid&quot; after authorization, the capture job later fails, and the goods ship with no money collected. The approval eventually expires and the hold disappears. Record authorized and captured as separate states in the \u003ca href=\"#Payment%20state%20machine\" data-term=\"Payment state machine\">payment state machine\u003c/a>.\u003c/p>\u003cp>Some transactions combine stages. A &quot;sale&quot; API call authorizes and captures together. In a single-message system, common for PIN debit, one message carries both the authorization and the financial transaction.\u003c/p>\u003cp>How long an approval stays valid varies by network, region and transaction type. Mastercard, for example, distinguishes preauthorizations, final and undefined authorizations. A valid approval also does not prove that the real \u003ca href=\"#Cardholder\" data-term=\"Cardholder\">cardholder\u003c/a> made the purchase, so it does not protect the merchant from a later fraud \u003ca href=\"#Chargeback\" data-term=\"Chargeback\">chargeback\u003c/a>.\u003c/p>","avoid":"","usage":["The order says paid, but finance can't find the money.","It was only authorized. The capture job failed, so nothing ever went to clearing."],"out":[2,14,1,3,4,29,15,21,22,105,0,60]},{"name":"Authorization hold","section":1,"description":"A temporary reduction in a cardholder's available funds after an approved authorization, before any money is taken.","body":"\u003cp>An authorization hold is a temporary reduction in a \u003ca href=\"#Cardholder\" data-term=\"Cardholder\">cardholder's\u003c/a> available balance or credit after an \u003ca href=\"#Issuer\" data-term=\"Issuer\">issuer\u003c/a> approves a \u003ca href=\"#Card%20authorization\" data-term=\"Card authorization\">card authorization\u003c/a>. The money stays in the account but cannot be spent. Banking apps usually show it as &quot;pending&quot;, which is why customers often read a hold as a completed charge.\u003c/p>\u003cp>This is the source of a frequent support ticket. A customer's first checkout attempt appears to fail, they try again, and now see two pending amounts. Only one order exists, but both approvals are holding funds. The customer reports being charged twice, even though neither hold has been captured. On a debit card with a low balance, the extra hold can also cause an unrelated payment or rent debit to fail.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Event\u003c/th>\u003cth>Effect on the hold\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#Capture\" data-term=\"Capture\">Capture\u003c/a> and \u003ca href=\"#Clearing\" data-term=\"Clearing\">clearing\u003c/a>\u003c/td>\u003ctd>Replaced by the posted transaction\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Partial%20capture\" data-term=\"Partial capture\">Partial capture\u003c/a>\u003c/td>\u003ctd>Unused part should be released\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Incremental%20authorization\" data-term=\"Incremental authorization\">Incremental authorization\u003c/a>\u003c/td>\u003ctd>Held amount increases\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Authorization%20reversal\" data-term=\"Authorization reversal\">Authorization reversal\u003c/a>\u003c/td>\u003ctd>Issuer releases the funds\u003c/td>\u003c/tr>\u003ctr>\u003ctd>No further action\u003c/td>\u003ctd>Issuer drops it after its own time limit\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchant\u003c/a> controls whether a hold is captured or released, but the issuer controls how quickly the customer sees the change. A released hold can continue to display for some time in a banking app. How long an unused hold lasts depends on the issuer, the network and the transaction type, so avoid promising customers a specific number of days.\u003c/p>\u003cp>The fix for abandoned or duplicate approvals is to send a reversal as soon as you know the funds are not needed. Visa's rules require a reversal in specified cases, including when a transaction is cancelled or finishes below the authorized amount, and Visa can assess a fee on approvals that are neither cleared nor reversed. Mastercard has its own requirements.\u003c/p>","avoid":"","usage":["A customer says we charged her twice for one order.","One is a stale hold from the failed attempt. Send the reversal and tell her it should drop off once her bank processes it."],"out":[0,2,13,15,21,16,17,19,1]},{"name":"Capture","section":1,"description":"The merchant's instruction to collect an authorized card payment, which sends the transaction toward clearing.","body":"\u003cp>Capture is the \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchant's\u003c/a> instruction to collect funds that were approved in a \u003ca href=\"#Card%20authorization\" data-term=\"Card authorization\">card authorization\u003c/a>. It converts &quot;the \u003ca href=\"#Issuer\" data-term=\"Issuer\">issuer\u003c/a> said yes&quot; into &quot;take this amount&quot;. Capture is a provider and API term. At network level, the equivalent step is the submission of a \u003ca href=\"#Clearing\" data-term=\"Clearing\">clearing\u003c/a> record, which Mastercard calls first presentment.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Stage\u003c/th>\u003cth>Who acts\u003c/th>\u003cth>Result\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Authorization\u003c/td>\u003ctd>Issuer\u003c/td>\u003ctd>Approval and \u003ca href=\"#Authorization%20hold\" data-term=\"Authorization hold\">authorization hold\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Capture\u003c/td>\u003ctd>Merchant or its system\u003c/td>\u003ctd>Final amount is confirmed\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Clearing\u003c/td>\u003ctd>\u003ca href=\"#Acquirer\" data-term=\"Acquirer\">Acquirer\u003c/a>, network, issuer\u003c/td>\u003ctd>Transaction record is exchanged\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Settlement\" data-term=\"Settlement\">Settlement\u003c/a>\u003c/td>\u003ctd>Institutions\u003c/td>\u003ctd>Funds move between them\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A provider may capture individually or collect captures into a daily batch, so a successful capture response does not mean the money has arrived.\u003c/p>\u003cp>Merchants choose between two flows. With automatic capture, authorization and capture happen together, which suits digital goods delivered immediately. With manual capture, the merchant authorizes at checkout and captures later, which suits physical goods that ship after stock is confirmed. Card rules or local law may also restrict charging before goods are shipped, so check what applies in each market.\u003c/p>\u003cp>The main failure with manual capture is forgetting to do it. A background job crashes, the approval expires, and a shipped order has no payment behind it. Capturing late carries a second risk. Visa has a dispute condition for no authorization or late presentment, and Mastercard has an authorization-related \u003ca href=\"#Chargeback\" data-term=\"Chargeback\">chargeback\u003c/a> with a defined protection period, so a late capture can be charged back even if the goods were delivered. Time limits differ by network and transaction type.\u003c/p>\u003cp>Alert on authorized payments approaching their capture window, and make the capture call safe to retry so a repeated job cannot create a \u003ca href=\"#Double%20charge\" data-term=\"Double charge\">double charge\u003c/a>. If you need less than the approved amount, use a \u003ca href=\"#Partial%20capture\" data-term=\"Partial capture\">partial capture\u003c/a>.\u003c/p>","avoid":"","usage":["Why did we get a chargeback on an order that definitely arrived?","We captured it three weeks after authorizing. The approval had expired, so proof of delivery doesn't help."],"out":[1,13,2,21,14,3,22,60,106,16]},{"name":"Partial capture","section":1,"description":"Collecting less than the authorized card amount, for example when only part of an order ships.","body":"\u003cp>A partial capture collects less than the amount approved in a \u003ca href=\"#Card%20authorization\" data-term=\"Card authorization\">card authorization\u003c/a>. A customer orders three items for 90, the \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchant\u003c/a> authorizes 90, one item is out of stock, and the merchant captures 60.\u003c/p>\u003cp>The step people miss is what happens to the remaining 30. Capturing 60 does not guarantee that the rest of the \u003ca href=\"#Authorization%20hold\" data-term=\"Authorization hold\">authorization hold\u003c/a> is released promptly. The customer can see a 60 charge and a 90 pending amount at the same time and believe they were overcharged.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Situation\u003c/th>\u003cth>Correct handling\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Final amount is lower\u003c/td>\u003ctd>Capture the lower amount, release the difference\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Order cancelled entirely\u003c/td>\u003ctd>Send a full \u003ca href=\"#Authorization%20reversal\" data-term=\"Authorization reversal\">authorization reversal\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Final amount is higher\u003c/td>\u003ctd>Use \u003ca href=\"#Incremental%20authorization\" data-term=\"Incremental authorization\">incremental authorization\u003c/a> if eligible\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Already settled, too high\u003c/td>\u003ctd>Issue a \u003ca href=\"#Refund\" data-term=\"Refund\">refund\u003c/a> for the difference\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Network rules address the unused amount. Visa requires a merchant to submit an authorization reversal for the difference when a completed transaction's final amount is less than the amount authorized. Mastercard's rules for Europe require a reversal when a transaction is finalised at a lower amount, and its other regions have their own wording. Many \u003ca href=\"#Payment%20service%20provider\" data-term=\"Payment service provider\">payment service providers\u003c/a> send this automatically, but confirm it rather than assume.\u003c/p>\u003cp>Partial capture is different from multiple capture, which takes several amounts against one authorization, usually for split shipments. Multiple capture is more restricted. Visa permits a single authorization with multiple \u003ca href=\"#Clearing\" data-term=\"Clearing\">clearing\u003c/a> records only in listed cases, including airlines, cruise lines, US railways, and card-absent merchants shipping goods in parts, with conditions such as telling the \u003ca href=\"#Cardholder\" data-term=\"Cardholder\">cardholder\u003c/a>.\u003c/p>\u003cp>Engineers should store authorized, captured and refunded amounts as separate fields in \u003ca href=\"#Minor%20unit\" data-term=\"Minor unit\">minor units\u003c/a>. A single \u003ccode>amount\u003c/code> column cannot represent a partly captured payment, and support then cannot tell what the customer actually paid.\u003c/p>","avoid":"","usage":["She was charged 60 but her bank still shows 90 pending.","We did a partial capture and never released the other 30. Check whether the provider sent the reversal."],"out":[13,1,14,19,17,20,6,21,0,76]},{"name":"Incremental authorization","section":1,"description":"An added authorization that raises the approved amount on an existing card transaction when the final cost grows.","body":"\u003cp>An incremental authorization is an extra request that increases the amount approved on an existing card transaction. It is used when the cost grows after the first approval: a hotel guest extends a stay, a rental car is kept longer, or a bar tab increases.\u003c/p>\u003cp>Visa defines it as a request that follows an approved estimated \u003ca href=\"#Card%20authorization\" data-term=\"Card authorization\">authorization\u003c/a> and covers an additional amount the \u003ca href=\"#Cardholder\" data-term=\"Cardholder\">cardholder\u003c/a> is expected to spend or has incurred in that same transaction. Mastercard handles the same need through preauthorizations, with additional requests referencing the original by its trace identifier. Eligibility varies by network, region, \u003ca href=\"#Merchant%20category%20code\" data-term=\"Merchant category code\">merchant category\u003c/a> and \u003ca href=\"#Acquirer\" data-term=\"Acquirer\">acquirer\u003c/a>, so a flow that works for one brand may not work for another.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Option\u003c/th>\u003cth>Links to original?\u003c/th>\u003cth>Effect on the customer\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Incremental authorization\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>One growing \u003ca href=\"#Authorization%20hold\" data-term=\"Authorization hold\">authorization hold\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>New separate authorization\u003c/td>\u003ctd>No\u003c/td>\u003ctd>Two holds, which can look like two charges\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Reauthorization\u003c/td>\u003ctd>Yes, by rule\u003c/td>\u003ctd>Refreshes an approval that is expiring\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Partial%20capture\" data-term=\"Partial capture\">Partial capture\u003c/a>\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>Takes less than was approved\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The link matters because the \u003ca href=\"#Issuer\" data-term=\"Issuer\">issuer\u003c/a> needs to know this is the same purchase. Without it, a \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchant\u003c/a> that sends a fresh approval for the extra amount creates a second hold and a second record. The customer sees two pending entries, and \u003ca href=\"#Clearing\" data-term=\"Clearing\">clearing\u003c/a> may no longer match cleanly to one authorization.\u003c/p>\u003cp>An incremental request is a new decision and can be declined. A guest with a nearly full credit limit may be approved at check-in and declined when the stay is extended. The merchant is then exposed for the extra amount unless it collects another payment method, so request the increase before providing the additional service.\u003c/p>\u003cp>Pass the \u003ca href=\"#Network%20transaction%20ID\" data-term=\"Network transaction ID\">network transaction ID\u003c/a> from the original approval on each increment and release any unused amount at the end.\u003c/p>","avoid":"","usage":["The guest added two nights and now has two pending hotel charges.","We sent a new auth. It should have been an incremental on the original transaction."],"out":[13,0,32,3,14,16,2,1,21,34]},{"name":"Void","section":1,"description":"Cancelling a card payment before it is submitted for clearing, so that no money is collected from the customer.","body":"\u003cp>A void cancels a card payment before it has been submitted for \u003ca href=\"#Clearing\" data-term=\"Clearing\">clearing\u003c/a>. Because the transaction has not been finalised, no money is taken and no \u003ca href=\"#Refund\" data-term=\"Refund\">refund\u003c/a> is needed. A shop assistant who rings up the wrong amount and cancels it immediately is performing a void.\u003c/p>\u003cp>&quot;Void&quot; is mainly a term used by \u003ca href=\"#Payment%20service%20provider\" data-term=\"Payment service provider\">payment service providers\u003c/a>, terminals and processors, and its exact behaviour depends on the provider. What happens underneath depends on how far the payment has gone.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Term\u003c/th>\u003cth>When it applies\u003c/th>\u003cth>What happens\u003c/th>\u003cth>Customer sees\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Void\u003c/td>\u003ctd>Before clearing submission\u003c/td>\u003ctd>Provider cancels the pending transaction\u003c/td>\u003ctd>Pending entry, then nothing\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Authorization%20reversal\" data-term=\"Authorization reversal\">Authorization reversal\u003c/a>\u003c/td>\u003ctd>After approval, before \u003ca href=\"#Capture\" data-term=\"Capture\">capture\u003c/a>\u003c/td>\u003ctd>Message tells the \u003ca href=\"#Issuer\" data-term=\"Issuer\">issuer\u003c/a> to release funds\u003c/td>\u003ctd>Hold disappears\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Refund\u003c/td>\u003ctd>After clearing or \u003ca href=\"#Settlement\" data-term=\"Settlement\">settlement\u003c/a>\u003c/td>\u003ctd>New credit transaction returns the money\u003c/td>\u003ctd>Charge, then a separate credit\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A void and a reversal are often the same event seen at two levels. The \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchant\u003c/a> calls &quot;void&quot; in an API, and the provider sends an authorization reversal to the issuer. A void can, however, fail to release the customer's money if the provider only removes the transaction from its own batch and sends no reversal. The sale is cancelled, but the \u003ca href=\"#Authorization%20hold\" data-term=\"Authorization hold\">authorization hold\u003c/a> stays on the card until the issuer's time limit passes. Check which behaviour your provider documents.\u003c/p>\u003cp>Timing is the common source of errors. Providers usually close batches on a schedule, and after the cutoff a void call is rejected with an error such as &quot;already settled&quot;. Support tools should try a void first when the payment is eligible and otherwise issue a refund. Doing both can credit a customer for money never taken, so code the choice from the payment's current state in the \u003ca href=\"#Payment%20state%20machine\" data-term=\"Payment state machine\">payment state machine\u003c/a>.\u003c/p>","avoid":"","usage":["Support tried to void yesterday's order and got an error.","The batch already closed, so it can't be voided. Issue a refund instead."],"out":[21,20,6,19,15,2,22,1,14,105]},{"name":"Authorization reversal","section":1,"description":"A message telling the issuer to cancel all or part of an approved authorization so the held funds are released.","body":"\u003cp>An authorization reversal is a message that cancels all or part of an approved \u003ca href=\"#Card%20authorization\" data-term=\"Card authorization\">card authorization\u003c/a>, telling the \u003ca href=\"#Issuer\" data-term=\"Issuer\">issuer\u003c/a> to release the funds it was holding. Visa's rules describe it as a system message that cancels an approval response. It applies before the transaction has been cleared.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Term\u003c/th>\u003cth>Stage\u003c/th>\u003cth>Mechanism\u003c/th>\u003cth>Money already moved?\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Authorization reversal\u003c/td>\u003ctd>After approval, before \u003ca href=\"#Clearing\" data-term=\"Clearing\">clearing\u003c/a>\u003c/td>\u003ctd>Network message to the issuer\u003c/td>\u003ctd>No\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Void\" data-term=\"Void\">Void\u003c/a>\u003c/td>\u003ctd>Before clearing submission\u003c/td>\u003ctd>Provider action, often sends a reversal\u003c/td>\u003ctd>No\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Refund\" data-term=\"Refund\">Refund\u003c/a>\u003c/td>\u003ctd>After clearing\u003c/td>\u003ctd>New credit transaction\u003c/td>\u003ctd>Yes\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchant\u003c/a> needs a reversal in four common situations: the customer cancels, stock runs out, the final amount is lower than approved, or a timeout leaves an approval the merchant cannot use. The issuer approves, the response is lost, and the merchant records a failure. The customer's funds stay on hold for an order that does not exist. Visa's rules require a reversal when a point-of-sale merchant receives an approval after timing out.\u003c/p>\u003cp>Requirements are ne
