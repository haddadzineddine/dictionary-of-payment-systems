 \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchant's\u003c/a> disputes relative to its transactions. \u003ca href=\"#Card%20network\" data-term=\"Card network\">Card networks\u003c/a> and \u003ca href=\"#Acquirer\" data-term=\"Acquirer\">acquirers\u003c/a> use it to identify businesses with unusually high fraud or customer problems. There is no universal formula, so a dashboard percentage may not match a network's figure.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Network\u003c/th>\u003cth>Program\u003c/th>\u003cth>Measure\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Visa\u003c/td>\u003ctd>Visa Acquirer Monitoring Program (VAMP)\u003c/td>\u003ctd>Count of fraud reports plus disputes, divided by settled transactions, card-not-present only\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Mastercard\u003c/td>\u003ctd>Excessive Chargeback Program\u003c/td>\u003ctd>Chargebacks in a calendar month, divided by Mastercard transactions in the preceding month\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The differences change the result. Visa's VAMP ratio includes reported fraud, so a transaction can count even when no chargeback follows. It can also exclude some disputes resolved through pre-dispute tools and fraud that qualifies for Compelling Evidence 3.0. Mastercard divides by the previous month's transactions, so a seasonal drop in sales can raise the ratio even if the number of chargebacks stays flat.\u003c/p>\u003cp>Both programs apply thresholds and minimum counts, which differ by region and have changed recently. Visa's published fact sheet, for example, records a lower merchant threshold for several regions from April 2026. Take current figures from the network or your acquirer.\u003c/p>\u003cp>Exceeding a program's level can lead to remediation plans, fees passed on by the acquirer, a \u003ca href=\"#Rolling%20reserve\" data-term=\"Rolling reserve\">rolling reserve\u003c/a>, or closure of the \u003ca href=\"#Merchant%20account\" data-term=\"Merchant account\">merchant account\u003c/a>. Because disputes arrive weeks after a sale, the ratio lags the cause.\u003c/p>\u003cp>To manage it, compute each network's metric separately, by merchant ID, and alert on the trend rather than waiting for a notice. Address the sources: unclear \u003ca href=\"#Statement%20descriptor\" data-term=\"Statement descriptor\">statement descriptors\u003c/a>, hard-to-cancel subscriptions, slow delivery, and fraud controls such as \u003ca href=\"#3-D%20Secure\" data-term=\"3-D Secure\">3-D Secure\u003c/a>. A prompt \u003ca href=\"#Refund\" data-term=\"Refund\">refund\u003c/a> before a dispute avoids a chargeback entirely.\u003c/p>\u003cp>Splitting payments or moving volume between merchant accounts to dilute the ratio can breach network rules.\u003c/p>","avoid":"","usage":["Our dashboard says disputes are under one percent, so we're fine, right?","That's blended. Visa counts fraud reports too, so check the VAMP ratio by merchant ID."],"out":[1,4,3,72,11,35,44,20]},{"name":"Interchange fee","section":5,"description":"A fee the acquirer pays the issuer on most card payments, set by network schedules and capped by regulators in some regions.","body":"\u003cp>An interchange fee is a fee the \u003ca href=\"#Acquirer\" data-term=\"Acquirer\">acquirer\u003c/a>, the \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchant\u003c/a>'s bank, pays to the \u003ca href=\"#Issuer\" data-term=\"Issuer\">issuer\u003c/a>, the \u003ca href=\"#Cardholder\" data-term=\"Cardholder\">cardholder\u003c/a>'s bank, on most card purchases in a \u003ca href=\"#Four-party%20model\" data-term=\"Four-party model\">four-party model\u003c/a>. The \u003ca href=\"#Card%20network\" data-term=\"Card network\">card network\u003c/a> publishes the rates. They vary by card type, region, merchant category, sales channel and the data sent with the transaction. The merchant does not pay the issuer directly. The acquirer recovers the cost through the merchant's pricing.\u003c/p>\u003cp>Interchange is often confused with the total cost of accepting a card. It is one component. A \u003ca href=\"#Scheme%20fee\" data-term=\"Scheme fee\">scheme fee\u003c/a> goes to the network, the acquirer adds its own margin, and the \u003ca href=\"#Merchant%20discount%20rate\" data-term=\"Merchant discount rate\">merchant discount rate\u003c/a> expresses the combined charge.\u003c/p>\u003cp>Regulators cap interchange in some markets, and the rules differ:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Region\u003c/th>\u003cth>Rule\u003c/th>\u003cth>Current point to check\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>EU\u003c/td>\u003ctd>Regulation (EU) 2015/751 caps most consumer debit and credit cards\u003c/td>\u003ctd>Commercial cards and three-party schemes generally fall outside the caps\u003c/td>\u003c/tr>\u003ctr>\u003ctd>UK\u003c/td>\u003ctd>Onshored version of the EU caps\u003c/td>\u003ctd>The Payment Systems Regulator is working on a UK-EEA cross-border cap\u003c/td>\u003c/tr>\u003ctr>\u003ctd>US\u003c/td>\u003ctd>Regulation II caps debit interchange for large issuers\u003c/td>\u003ctd>An October 2026 Eighth Circuit ruling upheld vacating the cap, effective only once the court's mandate issues\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Australia\u003c/td>\u003ctd>Reserve Bank of Australia standards\u003c/td>\u003ctd>Lower domestic caps began on 1 October 2026\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A merchant usually notices interchange when monthly card costs rise while prices and sales stay flat. A larger share of premium, commercial or foreign cards can cause this. Missing transaction data can also push a payment into a more expensive category, which acquirers call a downgrade. Whether interchange comes back on a \u003ca href=\"#Refund\" data-term=\"Refund\">refund\u003c/a> depends on the network and the acquirer contract, so check it instead of assuming.\u003c/p>","avoid":"","usage":["Card costs went up this month, but revenue is flat.","More volume came from commercial and foreign cards, and interchange is higher on both. Pull the fee report by card type."],"out":[3,1,2,0,5,4,67,68,20]},{"name":"Scheme fee","section":5,"description":"A fee the card network charges acquirers and issuers for using its network, separate from interchange.","body":"\u003cp>A scheme fee is a charge that a \u003ca href=\"#Card%20network\" data-term=\"Card network\">card network\u003c/a> such as Visa or Mastercard applies for use of its network. \u003ca href=\"#Acquirer\" data-term=\"Acquirer\">Acquirers\u003c/a> and \u003ca href=\"#Issuer\" data-term=\"Issuer\">issuers\u003c/a> both pay scheme fees, and in the US they are often called assessments or network fees. An acquirer normally passes its share on to the \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchant\u003c/a>, either as itemised lines or inside a single rate.\u003c/p>\u003cp>Scheme fees differ from an \u003ca href=\"#Interchange%20fee\" data-term=\"Interchange fee\">interchange fee\u003c/a> in who receives the money. Interchange moves from the acquirer to the issuer. A scheme fee goes to the network. Interchange is capped in some jurisdictions, while scheme fees are set by each network and are generally not covered by those same caps.\u003c/p>\u003cp>A single payment can trigger several scheme fees:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Fee type\u003c/th>\u003cth>Triggered by\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Volume assessment\u003c/td>\u003ctd>The value of transactions processed\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Authorization fee\u003c/td>\u003ctd>Each authorization request, including declined ones in some programmes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Clearing\" data-term=\"Clearing\">Clearing\u003c/a> fee\u003c/td>\u003ctd>Each transaction submitted for clearing\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Cross-border%20fee\" data-term=\"Cross-border fee\">Cross-border fee\u003c/a>\u003c/td>\u003ctd>The issuer and merchant being in different countries or regions\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Compliance or misuse fee\u003c/td>\u003ctd>Breaching a network rule, which can include repeated reattempts\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The names, amounts and triggers change, and each network publishes updates to its acquirers rather than a single public price list. For that reason, a merchant's statement can gain an unfamiliar line with no change to its contract.\u003c/p>\u003cp>The usual symptom is a set of small, oddly named charges that finance cannot explain. A retry loop can make this worse, because each repeated \u003ca href=\"#Card%20authorization\" data-term=\"Card authorization\">authorization\u003c/a> attempt may incur a fee even when the issuer declines it. To investigate, ask the acquirer for a per-transaction fee report, group charges by fee code, and compare the count of authorization attempts with the count of successful orders. A large gap often points to retries or \u003ca href=\"#Card%20testing\" data-term=\"Card testing\">card testing\u003c/a>.\u003c/p>","avoid":"","usage":["What is this new network access line on the acquirer statement?","It's a scheme fee charged per authorization. Our retry job doubled the attempts last month, so the line doubled too."],"out":[4,3,2,1,66,21,73,13,55]},{"name":"Merchant discount rate","section":5,"description":"The total percentage an acquirer or provider deducts from a card sale, covering interchange, scheme fees and margin.","body":"\u003cp>The \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchant\u003c/a> discount rate, or MDR, is the total percentage an \u003ca href=\"#Acquirer\" data-term=\"Acquirer\">acquirer\u003c/a> or \u003ca href=\"#Payment%20service%20provider\" data-term=\"Payment service provider\">payment service provider\u003c/a> deducts from a merchant's card sales. It normally covers the \u003ca href=\"#Interchange%20fee\" data-term=\"Interchange fee\">interchange fee\u003c/a>, the \u003ca href=\"#Scheme%20fee\" data-term=\"Scheme fee\">scheme fee\u003c/a> and the acquirer's margin. Some contracts add a fixed amount per transaction, so the quoted percentage may not be the full cost.\u003c/p>\u003cp>The MDR is often mistaken for interchange. Interchange is one input, paid to the \u003ca href=\"#Issuer\" data-term=\"Issuer\">issuer\u003c/a>. The MDR is what the merchant sees deducted. Under \u003ca href=\"#Blended%20pricing\" data-term=\"Blended pricing\">blended pricing\u003c/a> the MDR is one published rate. Under \u003ca href=\"#Interchange-plus%20pricing\" data-term=\"Interchange-plus pricing\">interchange-plus pricing\u003c/a> there is no single rate in advance, but an effective MDR can be calculated after the fact.\u003c/p>\u003cp>This worked example uses invented figures to show how a sale of 100.00 divides:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Component\u003c/th>\u003cth>Receiver\u003c/th>\u003cth>Amount\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Interchange\u003c/td>\u003ctd>Issuer\u003c/td>\u003ctd>1.20\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Scheme fee\u003c/td>\u003ctd>Network\u003c/td>\u003ctd>0.15\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Acquirer margin\u003c/td>\u003ctd>Acquirer\u003c/td>\u003ctd>0.65\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Total deducted\u003c/strong>\u003c/td>\u003ctd>\u003c/td>\u003ctd>2.00\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Net to merchant\u003c/strong>\u003c/td>\u003ctd>\u003c/td>\u003ctd>98.00\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The effective rate is total fees divided by processed volume. Calculate it over a full statement, including fixed fees, monthly charges and \u003ca href=\"#Chargeback\" data-term=\"Chargeback\">chargeback\u003c/a> fees. A fixed per-transaction fee matters more on small orders: the same fixed amount is a much larger share of a 3.00 sale than of a 300.00 sale.\u003c/p>\u003cp>The failure finance teams see is a \u003ca href=\"#Payout\" data-term=\"Payout\">payout\u003c/a> lower than recorded sales, with the difference booked as an unexplained variance. Record gross, fees and net separately for each transaction so that \u003ca href=\"#Payment%20reconciliation\" data-term=\"Payment reconciliation\">payment reconciliation\u003c/a> can explain the gap. When comparing provider quotes, compare effective rates on your own card mix, because a lower headline rate can cost more if other fees apply.\u003c/p>","avoid":"","usage":["The provider quoted us 1.9%, but we're paying nearer 2.6%.","That quote left out the per-transaction fee. On our small baskets, the effective merchant discount rate is much higher."],"out":[1,3,6,66,67,2,70,69,60,23,111]},{"name":"Interchange-plus pricing","section":5,"description":"A pricing model passing actual interchange and often scheme fees to the merchant, plus a disclosed acquirer markup.","body":"\u003cp>Interchange-plus pricing is a card pricing model in which the \u003ca href=\"#Acquirer\" data-term=\"Acquirer\">acquirer\u003c/a> charges the \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchant\u003c/a> the actual \u003ca href=\"#Interchange%20fee\" data-term=\"Interchange fee\">interchange fee\u003c/a> for each transaction plus a fixed, disclosed markup. A common variant, interchange-plus-plus or IC++, itemises the \u003ca href=\"#Scheme%20fee\" data-term=\"Scheme fee\">scheme fee\u003c/a> as well. Providers use these labels inconsistently, so check the contract to see whether scheme fees are passed through or included in the markup.\u003c/p>\u003cp>The alternative is \u003ca href=\"#Blended%20pricing\" data-term=\"Blended pricing\">blended pricing\u003c/a>, where the merchant pays one rate and the provider absorbs the variation. With interchange-plus, the merchant carries that variation and can see what each card cost.\u003c/p>\u003cp>This example uses invented figures for two sales of 100.00 with a markup of 0.30:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Line\u003c/th>\u003cth>Domestic debit\u003c/th>\u003cth>Foreign commercial credit\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Interchange\u003c/td>\u003ctd>0.20\u003c/td>\u003ctd>1.80\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Scheme fees\u003c/td>\u003ctd>0.05\u003c/td>\u003ctd>0.40\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Acquirer markup\u003c/td>\u003ctd>0.30\u003c/td>\u003ctd>0.30\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Total cost\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>0.55\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>2.50\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Net received\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>99.45\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>97.50\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The markup is the same in both columns, and the total differs because of the underlying card. This transparency makes it easier to compare acquirers, since the markup is the part they control.\u003c/p>\u003cp>The drawback is unpredictability. A merchant's monthly cost can rise with no change in contract because customers used more premium or foreign cards. Statements are also longer, and fees may be reported a day or more after the sale, or billed monthly rather than netted from each \u003ca href=\"#Payout\" data-term=\"Payout\">payout\u003c/a>. Engineering teams feel this during \u003ca href=\"#Payment%20reconciliation\" data-term=\"Payment reconciliation\">payment reconciliation\u003c/a>, because the final fee is unknown when the order is recorded. Store an estimated fee if needed, then post an adjusting \u003ca href=\"#Ledger\" data-term=\"Ledger\">ledger\u003c/a> entry when the actual fee arrives, keeping both visible.\u003c/p>","avoid":"","usage":["Why did our fees move when the acquirer's rate didn't change?","We're on interchange-plus pricing. Our markup stayed fixed, but more customers paid with foreign commercial cards."],"out":[3,1,66,67,70,23,111,109]},{"name":"Blended pricing","section":5,"description":"A card pricing model charging one rate across card types, with the provider absorbing variation in underlying costs.","body":"\u003cp>Blended pricing is a card pricing model in which a \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchant\u003c/a> pays one published rate, or a small set of rates, regardless of the underlying card. A provider might quote one percentage plus a fixed fee for every online card payment. The provider pays the actual \u003ca href=\"#Interchange%20fee\" data-term=\"Interchange fee\">interchange fee\u003c/a> and \u003ca href=\"#Scheme%20fee\" data-term=\"Scheme fee\">scheme fee\u003c/a> from that amount and keeps the difference.\u003c/p>\u003cp>The provider's margin therefore changes from one transaction to the next. It earns more on a low-cost domestic debit card and less, or even loses money, on an expensive foreign commercial card. Providers set the rate using an expected card mix, and may reprice or add surcharges for categories such as international cards.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Model\u003c/th>\u003cth>Merchant pays\u003c/th>\u003cth>Predictability\u003c/th>\u003cth>Cost visibility\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Blended\u003c/td>\u003ctd>One rate\u003c/td>\u003ctd>High\u003c/td>\u003ctd>Low\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Tiered\u003c/td>\u003ctd>A rate per provider-defined bucket\u003c/td>\u003ctd>Medium\u003c/td>\u003ctd>Low\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Interchange-plus%20pricing\" data-term=\"Interchange-plus pricing\">Interchange-plus pricing\u003c/a>\u003c/td>\u003ctd>Actual cost plus a markup\u003c/td>\u003ctd>Lower\u003c/td>\u003ctd>High\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Tiered pricing, sometimes described as qualified, mid-qualified and non-qualified rates, is a related model. The provider decides which transactions fall into each tier, so the rate paid can be hard to predict or audit.\u003c/p>\u003cp>Blended pricing suits merchants that value a simple bill and have modest volume. The usual problem appears as a business grows. A merchant whose customers mostly use domestic debit cards may pay well above the underlying cost, and nothing on the statement reveals it because the components are hidden. To check, ask for a sample of transaction-level costs or request an interchange-plus quote, then compare both against the last few months of your real card mix. Include fixed fees, since they can outweigh a small percentage difference on low-value orders.\u003c/p>","avoid":"","usage":["Our provider charges one flat rate. Is that good for us?","It's blended pricing, and most of our volume is domestic debit. We're probably overpaying, so let's get an interchange-plus quote."],"out":[1,66,67,69]},{"name":"Surcharging","section":5,"description":"Adding a fee at checkout for paying with a particular method, which is allowed, limited or banned depending on place and network.","body":"\u003cp>Surcharging is when a \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchant\u003c/a> adds a fee to the price because the customer chose a particular payment method, usually a credit card. Whether a merchant may do it depends on the jurisdiction, the \u003ca href=\"#Card%20network\" data-term=\"Card network\">card network\u003c/a>'s rules, the card type and sometimes the sector. There is no universal rule.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Jurisdiction\u003c/th>\u003cth>Position at the time of writing\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>EU\u003c/td>\u003ctd>\u003ca href=\"#PSD2\" data-term=\"PSD2\">PSD2\u003c/a> bars surcharges on consumer cards under the interchange caps and on SEPA transfers and debits. Other instruments vary by member state\u003c/td>\u003c/tr>\u003ctr>\u003ctd>UK\u003c/td>\u003ctd>The Consumer Rights (Payment Surcharges) Regulations 2012 ban surcharges on consumer cards and some other methods. Commercial cards may be surcharged up to cost\u003c/td>\u003c/tr>\u003ctr>\u003ctd>US\u003c/td>\u003ctd>State laws and network rules apply, and network rules generally exclude debit and \u003ca href=\"#Prepaid%20card\" data-term=\"Prepaid card\">prepaid cards\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Australia\u003c/td>\u003ctd>From 1 October 2026, Reserve Bank of Australia changes ended surcharging on designated eftpos, Mastercard and Visa cards\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Surcharging is often confused with two nearby practices. A convenience fee is charged for using a particular channel and has its own network rules. A cash discount lowers the price for non-card payment instead of raising it for card payment. Relabelling a surcharge does not necessarily change how it is classified.\u003c/p>\u003cp>A merchant may apply a blanket checkout fee and then receive a network compliance notice, a regulator complaint or a \u003ca href=\"#Chargeback\" data-term=\"Chargeback\">chargeback\u003c/a> for the added amount. An engineering team detects card type from the \u003ca href=\"#BIN\" data-term=\"BIN\">BIN\u003c/a> and applies a credit surcharge to a debit card, because the lookup data was stale.\u003c/p>\u003cp>Before launching, confirm the current rules for every country and network you sell in, and ask your \u003ca href=\"#Acquirer\" data-term=\"Acquirer\">acquirer\u003c/a> or a lawyer. Keep the fee as its own line item, so it can be refunded and reported correctly.\u003c/p>","avoid":"","usage":["Can we add a 2% card fee to all checkouts?","Not across all markets. The EU and UK ban it on consumer cards, and US rules vary by state and network. Ask legal first."],"out":[1,4,48,100,60,25,3]},{"name":"Rolling reserve","section":5,"description":"A share of each payout that a provider holds for a set period to cover future refunds and chargebacks.","body":"\u003cp>A rolling reserve is an arrangement in which a \u003ca href=\"#Payment%20service%20provider\" data-term=\"Payment service provider\">payment service provider\u003c/a> withholds a percentage of each \u003ca href=\"#Settlement\" data-term=\"Settlement\">settlement\u003c/a> and releases it after a fixed period. It protects the provider against losses that arrive after a sale, mainly a \u003ca href=\"#Chargeback\" data-term=\"Chargeback\">chargeback\u003c/a> or \u003ca href=\"#Refund\" data-term=\"Refund\">refund\u003c/a> the \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchant\u003c/a> can no longer fund. If the merchant fails, the \u003ca href=\"#Acquirer\" data-term=\"Acquirer\">acquirer\u003c/a> can still be liable to the \u003ca href=\"#Card%20network\" data-term=\"Card network\">card network\u003c/a>, so it holds this money as cover.\u003c/p>\u003cp>The contract sets the percentage and the holding period. Providers commonly apply a reserve to higher-risk categories, new businesses, merchants with long delivery times, or accounts with rising disputes. Other forms exist: a fixed reserve holds one lump sum, and delayed \u003ca href=\"#Payout\" data-term=\"Payout\">payout\u003c/a> lengthens the time before any funds are paid.\u003c/p>\u003cp>This example uses invented figures and a 10% reserve, with amounts in \u003ca href=\"#Minor%20unit\" data-term=\"Minor unit\">minor units\u003c/a>:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Event\u003c/th>\u003cth>Available\u003c/th>\u003cth>Reserve\u003c/th>\u003cth>Total\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Sale of 100000 settles\u003c/td>\u003ctd>90000\u003c/td>\u003ctd>10000\u003c/td>\u003ctd>100000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Chargeback of 5000\u003c/td>\u003ctd>85000\u003c/td>\u003ctd>10000\u003c/td>\u003ctd>95000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Reserve period ends\u003c/td>\u003ctd>95000\u003c/td>\u003ctd>0\u003c/td>\u003ctd>95000\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A reserve is not a fee. The money still belongs to the merchant, subject to the contract, and is normally recorded as a receivable. Booking the withheld amount as an expense overstates costs and hides money the business expects to receive.\u003c/p>\u003cp>Merchants usually discover a reserve when a payout is lower than expected, or when cash runs short during fast growth because a growing portion of revenue is held at any one time. Model a separate reserve balance in the \u003ca href=\"#Ledger\" data-term=\"Ledger\">ledger\u003c/a>, using the release date from the settlement data, and forecast cash on that basis. To negotiate a lower reserve, show the provider a clean dispute history and shorter delivery times.\u003c/p>","avoid":"","usage":["Payouts are 10% lower than sales since we moved to the new provider.","They put us on a rolling reserve. It's released after the holding period, so book it as a receivable, not a fee."],"out":[6,22,60,20,1,3,4,23,76,109]},{"name":"Cross-border fee","section":5,"description":"A charge applied when a card's issuing country differs from the merchant's or acquirer's country, even in one currency.","body":"\u003cp>A cross-border fee is a charge applied when a card payment crosses a country or region boundary, usually because the \u003ca href=\"#Issuer\" data-term=\"Issuer\">issuer\u003c/a> and the \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchant\u003c/a>'s \u003ca href=\"#Acquirer\" data-term=\"Acquirer\">acquirer\u003c/a> are in different places. The \u003ca href=\"#Card%20network\" data-term=\"Card network\">card network\u003c/a> defines what counts as cross-border, and those definitions can treat a region such as the European Economic Area differently from a single country.\u003c/p>\u003cp>The term covers several charges that people often merge:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Charge\u003c/th>\u003cth>Who pays\u003c/th>\u003cth>Who sets it\u003c/th>\u003cth>Trigger\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Network cross-border fee\u003c/td>\u003ctd>Acquirer and issuer\u003c/td>\u003ctd>Card network\u003c/td>\u003ctd>Issuer and acquirer in different regions\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Cross-border interchange\u003c/td>\u003ctd>Acquirer, paid to issuer\u003c/td>\u003ctd>Network or regulator\u003c/td>\u003ctd>Inter-regional transaction\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Foreign transaction fee\u003c/td>\u003ctd>\u003ca href=\"#Cardholder\" data-term=\"Cardholder\">Cardholder\u003c/a>\u003c/td>\u003ctd>Issuer\u003c/td>\u003ctd>Foreign purchase, under the card terms\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Currency conversion margin\u003c/td>\u003ctd>Payer or merchant\u003c/td>\u003ctd>Whoever converts\u003c/td>\u003ctd>Currencies differ\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A cross-border fee does not require a currency conversion. A US cardholder paying a merchant in US dollars can still be charged a foreign transaction fee if the merchant's acquirer is abroad. The customer then complains about a fee on a payment that appeared to be domestic, and the merchant's support team cannot see the charge because the issuer applied it.\u003c/p>\u003cp>Merchants see the cost as a higher fee on foreign cards. Interchange can rise sharply when a payment becomes inter-regional. Payments between the UK and EEA are a current example: the UK's Payment Systems Regulator has been working on a cap for fees on EEA-issued cards used online at UK businesses.\u003c/p>\u003cp>Businesses with significant foreign volume can reduce the cost by acquiring locally, using a domestic acquirer in each main market. That requires a local legal entity or an eligible provider setup in many countries, so check the requirements. \u003ca href=\"#Payment%20routing\" data-term=\"Payment routing\">Payment routing\u003c/a> can then send each card to the local acquirer.\u003c/p>","avoid":"","usage":["A US customer was charged a foreign fee, but we billed in dollars.","Our acquirer is in Ireland, so the issuer treated it as cross-border. Currency wasn't the trigger."],"out":[2,1,3,4,0,113]},{"name":"Dynamic currency conversion","section":5,"description":"An option at checkout or an ATM to pay in the card's home currency, using a rate set by the merchant's provider.","body":"\u003cp>Dynamic currency conversion, or DCC, is a service that offers a \u003ca href=\"#Cardholder\" data-term=\"Cardholder\">cardholder\u003c/a> the choice to pay in their card's home currency at a terminal, ATM or online checkout. The \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchant\u003c/a>'s provider performs the conversion and sets the rate, usually including a markup. If the customer declines, the payment proceeds in the local currency and the \u003ca href=\"#Card%20network\" data-term=\"Card network\">card network\u003c/a> or \u003ca href=\"#Issuer\" data-term=\"Issuer\">issuer\u003c/a> handles the conversion.\u003c/p>\u003cp>The choice is commonly shown as a prompt such as &quot;Pay 54.20 USD or 50.00 EUR&quot;. Choosing the home currency gives certainty about the amount, but the rate can be less favourable than the one the card would otherwise receive.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Option\u003c/th>\u003cth>Who converts\u003c/th>\u003cth>Who sets the price shown\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Pay in local currency\u003c/td>\u003ctd>Network or issuer\u003c/td>\u003ctd>Merchant, in local currency\u003c/td>\u003c/tr>\u003ctr>\u003ctd>DCC\u003c/td>\u003ctd>Merchant's provider\u003c/td>\u003ctd>Provider, at the point of sale\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Multi-currency%20pricing\" data-term=\"Multi-currency pricing\">Multi-currency pricing\u003c/a>\u003c/td>\u003ctd>Usually the \u003ca href=\"#Acquirer\" data-term=\"Acquirer\">acquirer\u003c/a>\u003c/td>\u003ctd>Merchant, in the buyer's currency\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>DCC is often confused with multi-currency pricing. With multi-currency pricing the merchant sets a price in the buyer's currency in advance. With DCC the item is priced in local currency and converted at the moment of payment.\u003c/p>\u003cp>Card network rules require the cardholder to make an active choice. In the EU, Regulation (EU) 2021/1230 requires parties offering conversion at an ATM or point of sale to disclose the charges before payment as a percentage markup over the latest European Central Bank reference rate.\u003c/p>\u003cp>The typical failure is a traveller who sees a higher amount than expected on their statement and says they never agreed to the conversion. A terminal that preselects home currency, or staff who choose for the customer, can lead to complaints and \u003ca href=\"#Chargeback\" data-term=\"Chargeback\">chargebacks\u003c/a>. Keep evidence of the customer's choice, the rate and the markup on the receipt.\u003c/p>","avoid":"","usage":["A customer disputes the amount, saying we charged them in pounds without asking.","The terminal had dynamic currency conversion on by default. Turn off preselection and check the receipt shows the markup."],"out":[0,1,4,2,75,3,60]},{"name":"Multi-currency pricing","section":5,"description":"Showing and charging customers in their own currency at merchant-set prices, while settling in another or the same currency.","body":"\u003cp>Multi-currency pricing is a setup in which a \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchant\u003c/a> displays and charges prices in the buyer's currency, then receives \u003ca href=\"#Settlement\" data-term=\"Settlement\">settlement\u003c/a> in that currency or a different one. The currency shown to the customer is the presentment currency. The currency paid out to the merchant is the settlement currency. When they differ, the \u003ca href=\"#Acquirer\" data-term=\"Acquirer\">acquirer\u003c/a> or \u003ca href=\"#Payment%20service%20provider\" data-term=\"Payment service provider\">payment service provider\u003c/a> usually performs the conversion and charges a margin.\u003c/p>\u003cp>The merchant controls the customer-facing price, using a price list per currency or a base price with a chosen rate and rounding rule. This differs from \u003ca href=\"#Dynamic%20currency%20conversion\" data-term=\"Dynamic currency conversion\">dynamic currency conversion\u003c/a>, where the item is priced in local currency and converted at the moment of payment, with the provider setting the rate.\u003c/p>\u003cp>A multi-currency payment needs more fields than a single amount:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Field\u003c/th>\u003cth>Example\u003c/th>\u003cth>Why it is stored\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Presentment amount\u003c/td>\u003ctd>5000 JPY\u003c/td>\u003ctd>What the customer agreed to pay\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Settlement amount\u003c/td>\u003ctd>3120 USD \u003ca href=\"#Minor%20unit\" data-term=\"Minor unit\">minor units\u003c/a>\u003c/td>\u003ctd>What the merchant received\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Exchange rate\u003c/td>\u003ctd>As reported by the provider\u003c/td>\u003ctd>Audit and reconciliation\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Conversion fee\u003c/td>\u003ctd>62 USD minor units\u003c/td>\u003ctd>Margin cost\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Each amount is stored in the minor unit of its own currency. In this example, 5000 JPY means 5,000 yen because the yen has no decimal places, while 3120 USD means 31.20 dollars.\u003c/p>\u003cp>The common failure happens on a \u003ca href=\"#Refund\" data-term=\"Refund\">refund\u003c/a>. A customer paid 100.00 EUR, the merchant settled in USD, and the rate moved before the refund. The customer gets 100.00 EUR back, but the USD debited from the merchant differs from what it originally received. Finance sees a small unexplained gain or loss. Record the rate for each leg and post the difference to a foreign exchange gain or loss account in the \u003ca href=\"#Ledger\" data-term=\"Ledger\">ledger\u003c/a>.\u003c/p>","avoid":"","usage":["Our refund cost more in dollars than the original sale brought in.","That's the exchange rate moving under multi-currency pricing. Record it as an FX loss rather than adjusting the original payment."],"out":[1,22,3,6,74,76,20,109]},{"name":"Minor unit","section":5,"description":"The smallest unit of a currency under ISO 4217, such as cents for USD, used to store money as an integer.","body":"\u003cp>A minor unit is the smallest denomination of a currency, as defined by the ISO 4217 currency standard. One US dollar is 100 cents, so USD has an exponent of 2. Payment systems commonly store and transmit money as an integer count of minor units, because binary floating-point numbers cannot represent many decimal values exactly and accumulate rounding errors.\u003c/p>\u003cpre>\u003ccode>{ &quot;amount&quot;: 1050, &quot;currency&quot;: &quot;USD&quot; }\u003c/code>\u003c/pre>\u003cp>That value means 10.50 dollars. The same integer means something else in another currency, so an amount must always be stored with its currency code.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Currency\u003c/th>\u003cth>ISO 4217 exponent\u003c/th>\u003cth>1050 means\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>USD\u003c/td>\u003ctd>2\u003c/td>\u003ctd>10.50\u003c/td>\u003c/tr>\u003ctr>\u003ctd>EUR\u003c/td>\u003ctd>2\u003c/td>\u003ctd>10.50\u003c/td>\u003c/tr>\u003ctr>\u003ctd>JPY\u003c/td>\u003ctd>0\u003c/td>\u003ctd>1,050\u003c/td>\u003c/tr>\u003ctr>\u003ctd>KRW\u003c/td>\u003ctd>0\u003c/td>\u003ctd>1,050\u003c/td>\u003c/tr>\u003ctr>\u003ctd>KWD\u003c/td>\u003ctd>3\u003c/td>\u003ctd>1.050\u003c/td>\u003c/tr>\u003ctr>\u003ctd>BHD\u003c/td>\u003ctd>3\u003c/td>\u003ctd>1.050\u003c/td>\u003c/tr>\u003ctr>\u003ctd>CLF\u003c/td>\u003ctd>4\u003c/td>\u003ctd>0.1050\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A common bug is multiplying every price by 100. A 1,000 yen order is sent as 100000 and the customer is charged 100,000 yen. Dividing by 100 for display makes the reverse error, and a Kuwaiti dinar amount is off by a factor of ten.\u003c/p>\u003cp>Read the exponent from a maintained ISO 4217 table instead of hardcoding it. SIX, the standard's maintenance agency, publishes the current list, and exponents can change when a currency is reformed. Providers sometimes diverge from ISO for particular currencies, such as requiring a two-decimal format for a zero-decimal currency or restricting fractional amounts, so check each provider's documentation and convert at that boundary.\u003c/p>\u003cp>Some message formats use decimal strings instead. \u003ca href=\"#ISO%2020022\" data-term=\"ISO 20022\">ISO 20022\u003c/a>, for example, carries amounts such as \u003ccode>10.50\u003c/code> with a currency attribute. Convert these to integers at the system edge using exact decimal parsing, and define a rounding rule for tax, fee and foreign exchange calculations.\u003c/p>","avoid":"","usage":["A Japanese customer was charged 100 times the price.","We multiplied by 100 for every currency. JPY has no minor unit, so read the exponent from the ISO 4217 table."],"out":[90]},{"name":"ACH","section":6,"description":"The US batch bank-to-bank network for credits and debits, governed by Nacha rules and operated by FedACH and EPN.","body":"\u003cp>ACH, the Automated Clearing House network, is the US system for moving batched electronic credits and debits between bank accounts. Nacha writes the operating rules. Two operators process the entries: the Federal Reserve's FedACH and The Clearing House's Electronic Payments Network. Payroll and bill payments commonly use it.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Step\u003c/th>\u003cth>Who\u003c/th>\u003cth>What happens\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Originator (business)\u003c/td>\u003ctd>Gets authorization and creates an entry\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>ODFI (originating bank)\u003c/td>\u003ctd>Submits batched entries to an operator\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>ACH operator\u003c/td>\u003ctd>Sorts entries and delivers them to receiving banks\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>RDFI (receiving bank)\u003c/td>\u003ctd>Posts the credit or debit to the receiver's account\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>RDFI\u003c/td>\u003ctd>Sends a return if the entry cannot be honoured\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>An ACH credit pushes money to a receiver. An ACH debit pulls money from a payer under an authorization, which is why debits carry more risk for the business collecting them. Same Day ACH offers faster processing within windows and per-payment limits set by Nacha, but it remains batched. It is not the same as an instant rail such as \u003ca href=\"#FedNow\" data-term=\"FedNow\">FedNow\u003c/a> or the \u003ca href=\"#RTP%20network\" data-term=\"RTP network\">RTP network\u003c/a>.\u003c/p>\u003cp>ACH is often confused with a wire. A \u003ca href=\"#Fedwire\" data-term=\"Fedwire\">Fedwire\u003c/a> payment settles individually and is final. An ACH debit can settle and still come back later as a \u003ca href=\"#Payment%20return\" data-term=\"Payment return\">payment return\u003c/a>, for reasons such as insufficient funds or a claim that it was unauthorised.\u003c/p>\u003cp>The failure this causes is familiar to anyone shipping goods on ACH. The dashboard shows &quot;paid&quot;, the order ships, and days later a return such as \u003ccode>R01\u003c/code> reverses the money. Treat a debit as provisional until your risk window has passed, and record the return as a new \u003ca href=\"#Ledger\" data-term=\"Ledger\">ledger\u003c/a> entry. Nacha also added fraud-monitoring duties that took effect in phases during 2026, so confirm current obligations with your bank.\u003c/p>","avoid":"","usage":["The customer's payment cleared Monday, so why did we lose the money today?","It was an ACH debit and came back \u003ccode>R01\u003c/code>. Settled doesn't mean final, so hold high-value orders longer."],"out":[84,85,82,92,109]},{"name":"SEPA Credit Transfer","section":6,"description":"The euro bank transfer scheme across SEPA countries, where the payer's bank pushes funds under European Payments Council rules.","body":"\u003cp>A SEPA Credit Transfer, or SCT, is a euro payment that a payer instructs their bank to push to a payee's account within the Single Euro Payments Area. The European Payments Council publishes the rulebook for participating \u003ca href=\"#Payment%20service%20provider\" data-term=\"Payment service provider\">payment service providers\u003c/a> (PSPs). SEPA is wider than the EU and includes non-EU countries such as Norway, Switzerland and the United Kingdom.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Step\u003c/th>\u003cth>Who\u003c/th>\u003cth>What happens\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Payer\u003c/td>\u003ctd>Enters the payee's \u003ca href=\"#IBAN\" data-term=\"IBAN\">IBAN\u003c/a>, name, amount and reference\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Payer's PSP\u003c/td>\u003ctd>Validates and debits the account\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Clearing system\u003c/td>\u003ctd>Exchanges the \u003ca href=\"#ISO%2020022\" data-term=\"ISO 20022\">ISO 20022\u003c/a> message and settles between PSPs\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>Payee's PSP\u003c/td>\u003ctd>Credits the payee\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>EU payment services law generally requires a euro transfer to reach the payee's provider by the end of the next business day. A standard SCT is therefore not instant. \u003ca href=\"#SEPA%20Instant\" data-term=\"SEPA Instant\">SEPA Instant\u003c/a> is a separate scheme that runs continuously, while \u003ca href=\"#SEPA%20Direct%20Debit\" data-term=\"SEPA Direct Debit\">SEPA Direct Debit\u003c/a> is a pull payment started by the creditor.\u003c/p>\u003cp>Since 9 October 2025, the Instant Payments Regulation has required euro-area banks to offer verification of payee on euro credit transfers. The check compares the payee name with the IBAN before the payer confirms. Providers in non-euro EU member states have a later date of 9 July 2027, and payment and e-money institutions follow their own timetable.\u003c/p>\u003cp>Two failures are common for businesses collecting by transfer. A customer omits or mistypes the reference, so the money arrives but nothing links it to an invoice, and it waits in a suspense account. Or a payer sends funds to the wrong IBAN and asks for them back. The payer's bank can send a recall, which the receiving side may refuse. Issue a unique reference per invoice and match on it automatically.\u003c/p>","avoid":"","usage":["The customer sent proof of transfer, but the invoice is still unpaid.","The SEPA Credit Transfer arrived without a reference. Match it from the suspense account and make the reference field clearer on the invoice."],"out":[6,89,90,79,80]},{"name":"SEPA Instant","section":6,"description":"The European Payments Council's euro instant credit transfer scheme, running around the clock under the Instant Payments Regulation.","body":"\u003cp>SEPA Instant, formally the SEPA Instant Credit Transfer or SCT Inst, is a euro credit transfer scheme that runs 24 hours a day on every day of the year. The European Payments Council publishes the rulebook. Regulation (EU) 2024/886, the Instant Payments Regulation, requires funds to reach the payee within 10 seconds of the order being received, and it requires EU providers that offer euro credit transfers to support instant ones.\u003c/p>\u003cp>The regulation phases in by location and firm type, according to the European Central Bank's published timetable:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Obligation\u003c/th>\u003cth>Euro area\u003c/th>\u003cth>Non-euro EU\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Receive instant\u003c/td>\u003ctd>9 January 2025\u003c/td>\u003ctd>9 January 2027\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Send instant\u003c/td>\u003ctd>9 October 2025\u003c/td>\u003ctd>9 July 2027\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Verification of payee\u003c/td>\u003ctd>9 October 2025\u003c/td>\u003ctd>9 July 2027\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Payment and e-money institutions have separate dates, starting 9 April 2027. Instant transfers may not cost more than the same provider's comparable standard transfers. Providers must also check their customers against EU targeted financial sanctions at least daily, in place of screening each instant transfer against those EU measures.\u003c/p>\u003cp>SEPA Instant differs from a \u003ca href=\"#SEPA%20Credit%20Transfer\" data-term=\"SEPA Credit Transfer\">SEPA Credit Transfer\u003c/a> in speed and availability, but both are credit pushes that the payer starts. Completed transfers cannot be reversed by the payer, so a misdirected payment relies on a recall the receiver can refuse.\u003c/p>\u003cp>For engineers, the short deadline changes failure handling. A client timeout does not prove that a transfer failed, because the provider may have completed it just as the connection dropped. Treat it as an \u003ca href=\"#Unknown%20payment%20outcome\" data-term=\"Unknown payment outcome\">unknown payment outcome\u003c/a> and query the status using your end-to-end reference before sending again. Also, release goods only on a confirmed credit, not on the customer's &quot;sent&quot; screen. Speed also helps fraudsters, since stolen money can be moved onward within seconds.\u003c/p>","avoid":"","usage":["The transfer API timed out. Should I resend the SEPA Instant payment?","Not yet. Query the status with the end-to-end ID, since it may already have landed."],"out":[78,107]},{"name":"SEPA Direct Debit","section":6,"description":"The euro pull-payment scheme in which a creditor collects from a debtor's account under a signed mandate.","body":"\u003cp>SEPA Direct Debit, or SDD, is a European Payments Council scheme that lets a creditor collect euro payments from a debtor's account under a \u003ca href=\"#Direct%20debit%20mandate\" data-term=\"Direct debit mandate\">direct debit mandate\u003c/a>. There are two schemes. SDD Core is available to consumers and businesses. SDD B2B is for business debtors only and needs the debtor bank to confirm the mandate.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Step\u003c/th>\u003cth>Who\u003c/th>\u003cth>What happens\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Creditor\u003c/td>\u003ctd>Obtains the mandate with its creditor identifier and a unique reference\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Creditor\u003c/td>\u003ctd>Gives the debtor advance notice of the amount and date\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Creditor's PSP\u003c/td>\u003ctd>Submits the collection\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>Debtor's PSP\u003c/td>\u003ctd>Debits the account, or rejects or returns the collection\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Debtor\u003c/td>\u003ctd>May request a refund under the scheme rules\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The refund right is where SDD differs most from a card payment. Under the current SDD Core rulebook, a debtor can get a no-questions-asked refund within eight weeks of the debit, and can claim for an unauthorised collection for up to 13 months. SDD B2B has no equivalent refund right for an authorised collection. These periods come from the rulebook and can change.\u003c/p>\u003cp>An SDD refund is also different from a \u003ca href=\"#Chargeback\" data-term=\"Chargeback\">chargeback\u003c/a>. Card disputes have a \u003ca href=\"#Representment\" data-term=\"Representment\">representment\u003c/a> stage where the \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchant\u003c/a> can contest with evidence. In the eight-week window, the creditor cannot block the refund through the scheme and must pursue any valid debt separately.\u003c/p>\u003cp>The symptom is revenue reversing weeks after delivery, with a reason code such as \u003ccode>MD06\u003c/code>, while a failed collection may show \u003ccode>AM04\u003c/code> for insufficient funds. Treat each collection as provisional in your \u003ca href=\"#Ledger\" data-term=\"Ledger\">ledger\u003c/a>, post reversals as new entries, and keep the mandate available, because the debtor's bank can request a copy for an unauthorised claim.\u003c/p>","avoid":"","usage":["A customer got their money back seven weeks after we delivered.","That's an SDD Core refund, \u003ccode>MD06\u003c/code>. We can't contest it in the scheme, so finance has to invoice them again."],"out":[91,60,62,1,109]},{"name":"SWIFT","section":6,"description":"The member-owned network that sends payment messages between banks without itself holding or moving their funds.","body":"\u003cp>SWIFT, the Society for Worldwide Interbank Financial Telecommunication, now styled Swift, is a member-owned cooperative based in Belgium that runs a secure messaging network for financial institutions. It carries payment instructions between banks. It does not hold customer accounts or settle funds. The money moves through accounts that banks hold with each other, known as \u003ca href=\"#Correspondent%20banking\" data-term=\"Correspondent banking\">correspondent banking\u003c/a>, or through a \u003ca href=\"#Settlement\" data-term=\"Settlement\">settlement\u003c/a> system such as an \u003ca href=\"#RTGS\" data-term=\"RTGS\">RTGS\u003c/a>.\u003c/p>\u003cp>A &quot;Swift code&quot; is a Business Identifier Code, or BIC, defined by ISO 9362. It identifies a bank or branch. It is different from an \u003ca href=\"#IBAN\" data-term=\"IBAN\">IBAN\u003c/a>, which identifies a customer account.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Layer\u003c/th>\u003cth>Example\u003c/th>\u003cth>Job\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Identifier\u003c/td>\u003ctd>BIC\u003c/td>\u003ctd>Names the institution\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Message\u003c/td>\u003ctd>\u003ccode>pacs.008\u003c/code>, formerly MT103\u003c/td>\u003ctd>Describes the payment\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Network\u003c/td>\u003ctd>Swift\u003c/td>\u003ctd>Delivers the message\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Funds\u003c/td>\u003ctd>\u003ca href=\"#Nostro%20account\" data-term=\"Nostro account\">Nostro account\u003c/a> or RTGS\u003c/td>\u003ctd>Moves the value\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The message format has changed. For cross-border payment instructions between financial institutions, the coexistence period for legacy MT messages and \u003ca href=\"#ISO%2020022\" data-term=\"ISO 20022\">ISO 20022\u003c/a> ended on 22 November 2025. Swift had also planned to remove fully unstructured postal addresses in November 2026. In 2026 it agreed to extend that timeline for payment messages after community requests, so check its current roadmap before relying on a date.\u003c/p>\u003cp>The usual confusion appears when a business receives a &quot;Swift copy&quot; as proof of payment. That document shows an instruction was sent. It does not prove the beneficiary was credited. A payment can still be held by an intermediary for compliance review, rejected for bad details, or arrive short because a bank in the chain deducted a fee. To trace one, ask the sending bank for its Unique End-to-end Transaction Reference (UETR), which banks use to track the payment across the chain.\u003c/p>","avoid":"","usage":["The supplier says they never got the money, but we have the Swift confirmation.","That only proves our bank sent the message. Give them the UETR and ask the bank to trace it."],"out":[87,22,83,89,88,90]},{"name":"Fedwire","section":6,"description":"The Federal Reserve's real-time gross settlement service for final, typically high-value US dollar payments.","body":"\u003cp>Fedwire, formally the Fedwire Funds Service, is a real-time gross \u003ca href=\"#Settlement\" data-term=\"Settlement\">settlement\u003c/a> system operated by the Federal Reserve Banks. A participating institution sends a payment order, and the Reserve Banks settle it individually by debiting the sender's Federal Reserve account and crediting the receiver's. Once settled, the payment is final and irrevocable. Businesses know it as a &quot;wire&quot;, and it is typically used for large or time-critical payments such as property closings and interbank transfers.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Rail\u003c/th>\u003cth>Operator\u003c/th>\u003cth>Processing\u003c/th>\u003cth>Can the money come back automatically?\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Fedwire\u003c/td>\u003ctd>Federal Reserve Banks\u003c/td>\u003ctd>Individual, business hours\u003c/td>\u003ctd>No, it is final\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#ACH\" data-term=\"ACH\">ACH\u003c/a>\u003c/td>\u003ctd>FedACH and EPN\u003c/td>\u003ctd>Batched\u003c/td>\u003ctd>Yes, through returns\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#FedNow\" data-term=\"FedNow\">FedNow\u003c/a>\u003c/td>\u003ctd>Federal Reserve Banks\u003c/td>\u003ctd>Individual, 24x7x365\u003c/td>\u003ctd>No, it is final\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Fedwire adopted \u003ca href=\"#ISO%2020022\" data-term=\"ISO 20022\">ISO 20022\u003c/a> on 14 July 2025, replacing its proprietary format. Its operating day runs on business days, so a payment instructed late may wait until the next one. In October 2025, the Federal Reserve Board announced that the service will expand to 22 hours a day, six days a week, with implementation planned for 2028 or 2029. Check the published schedule for current hours and cut-offs, because banks often set earlier internal deadlines for their customers.\u003c/p>\u003cp>Finality makes wire fraud hard to recover from. In a common scam, a criminal impersonates a supplier by email and sends new bank details. The finance team pays, the funds settle, and the sending bank can only ask the receiving bank to return them. The receiving bank does not have to agree, and the account may already be empty.\u003c/p>\u003cp>Confirm any change of payment details through a known phone number, require a second approver on high-value wires, and report suspected fraud to your bank immediately.\u003c/p>","avoid":"","usage":["Can we pull back the wire we sent to the new supplier account?","Fedwire payments are final. Call the bank now and ask for a recall, but the receiving bank has to agree."],"out":[22,77,84,90]},{"name":"RTGS","section":6,"description":"Real-time gross settlement, where a central bank settles each interbank payment individually and with finality.","body":"\u003cp>Real-time gross \u003ca href=\"#Settlement\" data-term=\"Settlement\">settlement\u003c/a>, or RTGS, is a type of settlement system in which interbank payments settle one at a time, as soon as they are processed, usually across accounts at a central bank. &quot;Gross&quot; means each payment settles for its full amount and is not netted against others. Settlement in central bank money removes the risk that the paying bank fails before settling.\u003c/p>\u003cp>Major examples are \u003ca href=\"#Fedwire\" data-term=\"Fedwire\">Fedwire\u003c/a> in the US, T2 in the euro area and the Bank of England's RTGS service, which settles CHAPS payments in the UK.\u003c/p>\u003cp>The main alternative is deferred net settlement, where a system adds up what participants owe each other and settles only the difference at set times:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Property\u003c/th>\u003cth>RTGS\u003c/th>\u003cth>Deferred net settlement\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Settlement\u003c/td>\u003ctd>Each payment, in full\u003c/td>\u003ctd>Net positions, in cycles\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Liquidity needed\u003c/td>\u003ctd>Higher\u003c/td>\u003ctd>Lower\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Settlement risk\u003c/td>\u003ctd>Low, because settlement is immediate\u003c/td>\u003ctd>Exists between cycles unless covered\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Example\u003c/td>\u003ctd>Fedwire, T2, CHAPS\u003c/td>\u003ctd>\u003ca href=\"#Faster%20Payments\" data-term=\"Faster Payments\">Faster Payments\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>RTGS is often confused with instant payments. RTGS describes how banks settle. Instant payments describe what the customer experiences. Faster Payments credits customers quickly but settles between banks on a net basis three times per business day, according to the Bank of England, with participants prefunding their exposure. A traditional RTGS can also close overnight and on weekends, while a customer-facing instant service runs all the time.\u003c/p>\u003cp>Because every payment needs its full value, a bank must hold enough liquidity during the day. If it does not, the system may queue the payment until incoming funds arrive. A treasury team sees this as a high-value payment stuck in &quot;queued&quot; near a cut-off. Banks manage it with intraday credit, payment scheduling and liquidity-saving features in the system.\u003c/p>","avoid":"","usage":["Why is this CHAPS payment still queued?","Our settlement account is short on intraday liquidity. RTGS needs the full amount, so treasury has to fund it first."],"out":[22,82,86]},{"name":"FedNow","section":6,"description":"The Federal Reserve's around-the-clock US instant payment service for final, individually settled credit transfers.","body":"\u003cp>FedNow is an instant payment service operated by the Federal Reserve Banks, launched in July 2023. It runs 24 hours a day, every day of the year. A participating bank or credit union sends a credit transfer, and the service settles it individually across Federal Reserve master accounts, or through a correspondent acting for the institution. The receiver can have the funds within seconds, and the payment is final.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Step\u003c/th>\u003cth>Who\u003c/th>\u003cth>What happens\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Payer's bank\u003c/td>\u003ctd>Validates the payment and sends an \u003ca href=\"#ISO%2020022\" data-term=\"ISO 20022\">ISO 20022\u003c/a> message\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>FedNow\u003c/td>\u003ctd>Checks it and forwards it to the receiving bank\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Receiver's bank\u003c/td>\u003ctd>Accepts or rejects\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>FedNow\u003c/td>\u003ctd>Settles and notifies both banks\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Receiver's bank\u003c/td>\u003ctd>Makes the funds available\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>FedNow is often confused with \u003ca href=\"#Fedwire\" data-term=\"Fedwire\">Fedwire\u003c/a> because both belong to the Federal Reserve. Fedwire is the established high-value wire service with a limited operating day. FedNow is designed for continuous, everyday instant payments. It is also separate from the \u003ca href=\"#RTP%20network\" data-term=\"RTP network\">RTP network\u003c/a>, a private-sector instant system run by The Clearing House. A bank can join either, both or neither, and the two do not automatically exchange payments.\u003c/p>\u003cp>FedNow is a credit push. The payer's institution sends the money, so the service cannot be used as a card-style pull. Request-for-payment messages exist, but the payer still has to approve the payment. The Federal Reserve sets a network transaction limit, and participants may set lower ones, so check current values with your bank.\u003c/p>\u003cp>The failure teams usually meet is reachability. A checkout or \u003ca href=\"#Payout\" data-term=\"Payout\">payout\u003c/a> offers &quot;instant&quot;, but the recipient's bank is not enabled to receive FedNow, or it only receives and cannot send. Check reachability by routing number first, and fall back to another rail with the customer told about the slower timing.\u003c/p>","avoid":"","usage":["Why did this instant payout fail for only some customers?","Their banks aren't enabled for FedNow. Check reachability by routing number and fall back to \u003ca href=\"#ACH\" data-term=\"ACH\">ACH\u003c/a>."],"out":[90,82,85,23,77]},{"name":"RTP network","section":6,"description":"The Clearing House's private US instant payment network, settling final credit transfers around the clock from a prefunded account.","body":"\u003cp>The RTP network is a US instant payment system operated by The Clearing House, a company owned by large banks. It launched in 2017 and runs around the clock. Participating institutions send credit transfers using \u003ca href=\"#ISO%2020022\" data-term=\"ISO 20022\">ISO 20022\u003c/a> messages, and receivers can have the funds within seconds. Payments on the network are final.\u003c/p>\u003cp>\u003ca href=\"#Settlement\" data-term=\"Settlement\">Settlement\u003c/a> relies on a prefunded joint account held at the Federal Reserve Bank of New York. Participants fund their positions in that account, and each payment adjusts their balances on The Clearing House's records as it is processed. This model lets the network settle while traditional wire systems are closed.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Property\u003c/th>\u003cth>RTP network\u003c/th>\u003cth>\u003ca href=\"#FedNow\" data-term=\"FedNow\">FedNow\u003c/a>\u003c/th>\u003cth>\u003ca href=\"#ACH\" data-term=\"ACH\">ACH\u003c/a>\u003c/th>\u003cth>\u003ca href=\"#Fedwire\" data-term=\"Fedwire\">Fedwire\u003c/a>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Operator\u003c/td>\u003ctd>The Clearing House\u003c/td>\u003ctd>Federal Reserve Banks\u003c/td>\u003ctd>Nacha rules, two operators\u003c/td>\u003ctd>Federal Reserve Banks\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Availability\u003c/td>\u003ctd>Continuous\u003c/td>\u003ctd>Continuous\u003c/td>\u003ctd>Processing windows\u003c/td>\u003ctd>Business days\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Direction\u003c/td>\u003ctd>Credit push\u003c/td>\u003ctd>Credit push\u003c/td>\u003ctd>Credit and debit\u003c/td>\u003ctd>Credit push\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Finality\u003c/td>\u003ctd>Final\u003c/td>\u003ctd>Final\u003c/td>\u003ctd>Returns possible\u003c/td>\u003ctd>Final\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The RTP network and FedNow are separate. A bank on one is not automatically reachable through the other, which is the main point of confusion for teams adding instant \u003ca href=\"#Payout\" data-term=\"Payout\">payouts\u003c/a> in the US. The network also carries Request for Payment messages, which ask a payer to approve a push. A request is not a debit, so nothing moves until the payer agrees.\u003c/p>\u003cp>The failure engineers meet is a payout that works in testing and then fails for a portion of real customers because their bank does not receive RTP payments. Check eligibility for each routing number before promising instant delivery, and keep a fallback rail. Because payments are final, a payout to a wrong account depends on the recipient's bank and the recipient agreeing to send it back. Limits are set by the network and by each bank, and they change, so confirm them with your provider.\u003c/p>","avoid":"","usage":["Can we promise instant payouts to every US account?","No. The RTP network doesn't reach every bank, so check the routing number and fall back to ACH."],"out":[90,22,84,77,82,23]},{"name":"Faster Payments","section":6,"description":"The UK's always-on retail bank transfer system, operated by Pay.UK and settled net at the Bank of England.","body":"\u003cp>Faster Payments is the UK's system for near-real-time bank transfers in sterling, operated by Pay.UK. It runs 24 hours a day and carries everyday transfers, bill payments and many \u003ca href=\"#Payout\" data-term=\"Payout\">payouts\u003c/a>. A customer usually sees the money arrive within seconds, although banks can hold a payment for fraud checks.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Step\u003c/th>\u003cth>Who\u003c/th>\u003cth>What happens\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Payer\u003c/td>\u003ctd>Enters the sort code, account number and reference\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Sending bank\u003c/td>\u003ctd>Checks the payment and submits it\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Faster Payments\u003c/td>\u003ctd>Routes it to the receiving bank\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>Receiving bank\u003c/td>\u003ctd>Accepts it and credits the payee\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Bank of England\u003c/td>\u003ctd>Settles net positions in cycles\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The customer experience is immediate, but interbank \u003ca href=\"#Settlement\" data-term=\"Settlement\">settlement\u003c/a> is not. According to the Bank of England, Faster Payments settles on a deferred net basis three times each business day in its \u003ca href=\"#RTGS\" data-term=\"RTGS\">RTGS\u003c/a> service, with direct participants prefunding their maximum exposure. It should not be confused with CHAPS, the UK's high-value system, which settles each payment gross. Bacs is a third, batch-based UK system and is the one used for UK direct debits.\u003c/p>\u003cp>Pay.UK's New Payments Architecture is intended to replace Faster Payments and use \u003ca href=\"#ISO%2020022\" data-term=\"ISO 20022\">ISO 20022\u003c/a>. Its timing has moved before, so check Pay.UK's current plans.\u003c/p>\u003cp>A common failure is authorised push payment fraud, where a criminal persuades a customer to send money. The customer approved it, so the transfer completes. Since 7 October 2024, Payment Systems Regulator rules have required in-scope payment firms to reimburse victims, subject to conditions and a maximum amount that can be revised. A missing reference is a separate problem, because it leaves a received payment unmatched. Give each customer a unique reference, and use Confirmation of Payee, the UK name-checking service, before paying new accounts.\u003c/p>","avoid":"","usage":["The customer says they paid by bank transfer, but the order is still open.","The Faster Payment landed without our reference. Match it manually and show the reference more clearly at checkout."],"out":[23,22,83,90]},{"name":"Correspondent banking","section":6,"description":"An arrangement where one bank holds an account at another to make payments in a currency or country it cannot reach directly.","body":"\u003cp>Correspondent banking is an arrangement in which one bank, the correspondent, holds an account for another bank, the respondent, and makes or receives payments on its behalf. A bank needs this when it has no direct access to the payment system of a currency. A small bank in France, for example, usually cannot settle US dollars in \u003ca href=\"#Fedwire\" data-term=\"Fedwire\">Fedwire\u003c/a>, so it holds dollars at a US bank that can.\u003c/p>\u003cp>A cross-border payment may pass through several banks:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Step\u003c/th>\u003cth>Who\u003c/th>\u003cth>What happens\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Payer's bank\u003c/td>\u003ctd>Debits the payer and sends the instruction\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Its correspondent\u003c/td>\u003ctd>Debits the payer's bank's account and screens the payment\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Intermediary, if any\u003c/td>\u003ctd>Passes value toward the beneficiary's bank\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>Beneficiary's bank\u003c/td>\u003ctd>Receives value and credits the beneficiary\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Correspondent banking is often confused with \u003ca href=\"#SWIFT\" data-term=\"SWIFT\">SWIFT\u003c/a>. Swift carries the messages between these banks. The correspondent accounts, or a \u003ca href=\"#Settlement\" data-term=\"Settlement\">settlement\u003c/a> system such as an \u003ca href=\"#RTGS\" data-term=\"RTGS\">RTGS\u003c/a>, carry the value. The account is called a \u003ca href=\"#Nostro%20account\" data-term=\"Nostro account\">nostro account\u003c/a> by the bank that owns it and a vostro account by the bank that holds it.\u003c/p>\u003cp>Each bank in the chain performs its own compliance checks, including \u003ca href=\"#Sanctions%20screening\" data-term=\"Sanctions screening\">sanctions screening\u003c/a> and \u003ca href=\"#AML\" data-term=\"AML\">AML\u003c/a> review, and may charge a fee. This produces two common complaints. The first is a short payment: an invoice for 10,000 arrives as 9,965 because an intermediary deducted its charge. The sender can reduce this by choosing a charge option, where \u003ccode>OUR\u003c/code> means the sender pays, \u003ccode>SHA\u003c/code> means costs are shared and \u003ccode>BEN\u003c/code> means the beneficiary pays, though not every bank honours it fully. The second is a payment that stops for days while a bank asks about its purpose or parties.\u003c/p>\u003cp>Correspondents may also withdraw from relationships they consider high-risk, known as de-risking.\u003c/p>","avoid":"","usage":["The supplier received 35 dollars less than we sent.","An intermediary in the correspondent banking chain took its fee. Send it as \u003ccode>OUR\u003c/code> next time, and gross up if needed."],"out":[82,81,22,83,88,52,51]},{"name":"Nostro account","section":6,"description":"A bank's account held at another bank, usually in foreign currency, which the other bank calls a vostro account.","body":"\u003cp>A nostro account is an account that a bank holds at another bank, usually in a foreign currency, in order to make and receive payments in that currency. The word comes from the Italian for &quot;ours&quot;. The bank holding the account calls the same account a vostro account, meaning &quot;yours&quot;. Both names describe one account seen from two sides.\u003c/p>\u003cp>A nostro is an asset on the owning bank's books, because it is money owed to that bank. The matching vostro is a liability on the correspondent's books. This example shows Bank A paying 1,000 USD on behalf of a customer through its nostro at Bank B, with the beneficiary also banking at B:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Bank\u003c/th>\u003cth>Account\u003c/th>\u003cth>Type\u003c/th>\u003cth>Debit\u003c/th>\u003cth>Credit\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>A\u003c/td>\u003ctd>Customer's USD account\u003c/td>\u003ctd>Liability\u003c/td>\u003ctd>1,000\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A\u003c/td>\u003ctd>Nostro at Bank B\u003c/td>\u003ctd>Asset\u003c/td>\u003ctd>\u003c/td>\u003ctd>1,000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>B\u003c/td>\u003ctd>Vostro for Bank A\u003c/td>\u003ctd>Liability\u003c/td>\u003ctd>1,000\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>B\u003c/td>\u003ctd>Beneficiary's account\u003c/td>\u003ctd>Liability\u003c/td>\u003ctd>\u003c/td>\u003ctd>1,000\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Each bank's entries balance. Bank A's nostro asset and its liability to the customer both fall by 1,000. Bank B's total liabilities stay the same, because its obligation moves from Bank A to the beneficiary.\u003c/p>\u003cp>Banks use nostros as part of \u003ca href=\"#Correspondent%20banking\" data-term=\"Correspondent banking\">correspondent banking\u003c/a>, and their treasury teams must keep enough in each currency to cover outgoing payments. Too little causes failed or delayed payments or overdraft charges. Too much ties up cash in idle balances.\u003c/p>\u003cp>The operational task is nostro reconciliation: comparing the bank's internal record of the account with the statements sent by the correspondent. An item on one side but not the other is called a break. Common causes are a fee the correspondent deducted, a payment in transit across a cut-off, or a duplicate. Unresolved breaks can hide errors or fraud, so teams track their age.\u003c/p>","avoid":"","usage":["Why is the USD position 25 dollars off this morning?","There's a nostro break. The correspondent deducted a fee that we haven't booked, so post it and clear the item."],"out":[87]},{"name":"IBAN","section":6,"description":"An international bank account number under ISO 13616, with a country code, check digits and a domestic account identifier.","body":"\u003cp>An IBAN, or International Bank Account Number, is a standard format for identifying a bank account across borders, defined by ISO 13616. It starts with a two-letter country code and two check digits, followed by a country-specific Basic Bank Account Number. It can be up to 34 characters long, and each country has a fixed length. \u003ca href=\"#SWIFT\" data-term=\"SWIFT\">Swift\u003c/a> acts as the registration authority and publishes the registry of national formats.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Part\u003c/th>\u003cth>Example from \u003ccode>GB82 WEST 1234 5698 7654 32\u003c/code>\u003c/th>\u003cth>Meaning\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Country\u003c/td>\u003ctd>\u003ccode>GB\u003c/code>\u003c/td>\u003ctd>United Kingdom\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Check digits\u003c/td>\u003ctd>\u003ccode>82\u003c/code>\u003c/td>\u003ctd>Detects typing errors\u003c/td>\u003c/tr>\u003ctr>\u003ctd>BBAN\u003c/td>\u003ctd>\u003ccode>WEST12345698765432\u003c/code>\u003c/td>\u003ctd>Domestic bank and account\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>IBANs are used across Europe and in many countries in the Middle East and elsewhere. They are required for \u003ca href=\"#SEPA%20Credit%20Transfer\" data-term=\"SEPA Credit Transfer\">SEPA Credit Transfer\u003c/a> payments. The US does not use them, relying on a routing number and account number instead, so a form that insists on an IBAN will block American payees. An IBAN is also not a BIC: the BIC identifies a bank, while the IBAN identifies an account.\u003c/p>\u003cp>The check digits use a modulo 97 calculation. Move the first four characters to the end, convert letters to numbers (A is 10, B is 11), and the remainder must equal 1.\u003c/p>\u003cpre>\u003ccode>const valid = (iban) =&gt; {\n  const s = iban.replace(/\\s/g, &quot;&quot;).toUpperCase();\n  const n = (s.slice(4) + s.slice(0, 4)).replace(/[A-Z]/g, (c) =&gt; c.charCodeAt(0) - 55);\n  return BigInt(n) % 97n === 1n;\n};\u003c/code>\u003c/pre>\u003cp>Passing this check only means the number is well formed. It does not prove that the account exists or belongs to the named person, so a mistyped but valid IBAN can still send money to a stranger. Verification of payee, which is required for euro transfers under the EU Instant Payments Regulation, addresses that gap. Store IBANs in uppercase without spaces, display them in groups of four, and validate length per country.\u003c/p>","avoid":"","usage":["The form rejected a customer's IBAN, but it's correct on their statement.","They pasted it with non-breaking spaces. Strip all whitespace before validating."],"out":[81,78]},{"name":"ISO 20022","section":6,"description":"An international standard for financial messages, used by major payment systems for richer, structured payment data.","body":"\u003cp>ISO 20022 is an international standard for building financial messages from a shared data model. It defines business concepts such as debtor, creditor and remittance information, and message definitions built from them, most commonly expressed in XML. It is a language for payment data. It is not a network or a payment rail.\u003c/p>\u003cp>Message names show their purpose:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Family\u003c/th>\u003cth>Example\u003c/th>\u003cth>Use\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>pain\u003c/code>\u003c/td>\u003ctd>\u003ccode>pain.001\u003c/code>\u003c/td>\u003ctd>Customer instructs its bank to pay\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>pacs\u003c/code>\u003c/td>\u003ctd>\u003ccode>pacs.008\u003c/code>\u003c/td>\u003ctd>Bank-to-bank customer credit transfer\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>pacs\u003c/code>\u003c/td>\u003ctd>\u003ccode>pacs.004\u003c/code>\u003c/td>\u003ctd>\u003ca href=\"#Payment%20return\" data-term=\"Payment return\">Payment return\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>camt\u003c/code>\u003c/td>\u003ctd>\u003ccode>camt.053\u003c/code>\u003c/td>\u003ctd>Account statement\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>ISO 20022 is sometimes confused with \u003ca href=\"#ISO%208583\" data-term=\"ISO 8583\">ISO 8583\u003c/a>, the older standard for card messages. \u003ca href=\"#Card%20network\" data-term=\"Card network\">Card networks\u003c/a> still rely mainly on ISO 8583, while ISO 20022 has spread across bank payment systems:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>System\u003c/th>\u003cth>ISO 20022 status\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>SEPA schemes\u003c/td>\u003ctd>Used by the schemes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>T2 (euro area)\u003c/td>\u003ctd>Migrated March 2023\u003c/td>\u003c/tr>\u003ctr>\u003ctd>CHAPS (UK)\u003c/td>\u003ctd>Migrated June 2023\u003c/td>\u003c/tr>\u003ctr>\u003ctd>CHIPS (US)\u003c/td>\u003ctd>Migrated April 2024\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Fedwire\" data-term=\"Fedwire\">Fedwire\u003c/a>\u003c/td>\u003ctd>Migrated 14 July 2025\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#SWIFT\" data-term=\"SWIFT\">Swift\u003c/a> cross-border\u003c/td>\u003ctd>MT coexistence for payment instructions ended 22 November 2025\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#FedNow\" data-term=\"FedNow\">FedNow\u003c/a>, \u003ca href=\"#RTP%20network\" data-term=\"RTP network\">RTP network\u003c/a>\u003c/td>\u003ctd>Built on ISO 20022\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Faster%20Payments\" data-term=\"Faster Payments\">Faster Payments\u003c/a>\u003c/td>\u003ctd>Planned through Pay.UK's New Payments Architecture\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Structured addresses are the main unfinished item. Swift planned to reject fully unstructured postal addresses from November 2026, then agreed in 2026 to extend the timeline for payment messages. Check its current roadmap.\u003c/p>\u003cp>The failures usually come from translation between formats.
