twork-specific. Visa requires merchants to submit reversals in listed cases and can charge a misuse-of-authorization fee on approvals matched to neither a clearing record nor a reversal. Mastercard's Transaction Processing Rules set separate requirements, including a timed rule in the Europe region for cancelled or reduced transactions.\u003c/p>\u003cp>Reversals can be full or partial. A partial reversal reduces the held amount and is the usual companion to a \u003ca href=\"#Partial%20capture\" data-term=\"Partial capture\">partial capture\u003c/a>. The message must reference the original authorization, normally through the \u003ca href=\"#Network%20transaction%20ID\" data-term=\"Network transaction ID\">network transaction ID\u003c/a> or matching data, or the issuer may not connect the two.\u003c/p>\u003cp>Visa also uses &quot;Reversal&quot; for a separate correction of a transaction sent through clearing in error. When reading a rulebook or provider log, check which of the two is meant.\u003c/p>","avoid":"","usage":["The auth call timed out, so we marked the order failed. Are we done?","No. It may have been approved. Send a reversal, or the customer's money stays on hold."],"out":[13,2,21,18,20,1,16,34]},{"name":"Refund","section":1,"description":"A new credit transaction returning money to a card after the original payment has been captured and cleared.","body":"\u003cp>A refund returns money to a customer's card after the original payment has been \u003ca href=\"#Capture\" data-term=\"Capture\">captured\u003c/a> and \u003ca href=\"#Clearing\" data-term=\"Clearing\">cleared\u003c/a>. It is a new transaction in the opposite direction. The original charge stays on the statement, and a separate credit appears later.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Action\u003c/th>\u003cth>Timing\u003c/th>\u003cth>Result on the statement\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#Void\" data-term=\"Void\">Void\u003c/a>\u003c/td>\u003ctd>Before clearing submission\u003c/td>\u003ctd>Usually no posted entry\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Authorization%20reversal\" data-term=\"Authorization reversal\">Authorization reversal\u003c/a>\u003c/td>\u003ctd>Before clearing\u003c/td>\u003ctd>Pending hold disappears\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Refund\u003c/td>\u003ctd>After clearing\u003c/td>\u003ctd>Charge plus separate credit\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Chargeback\" data-term=\"Chargeback\">Chargeback\u003c/a>\u003c/td>\u003ctd>After a dispute with the \u003ca href=\"#Issuer\" data-term=\"Issuer\">issuer\u003c/a>\u003c/td>\u003ctd>Credit forced through the network\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A refund is initiated by the \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchant\u003c/a>, which distinguishes it from a chargeback, initiated by the issuer. The money is deducted from the merchant's balance or a future \u003ca href=\"#Payout\" data-term=\"Payout\">payout\u003c/a>. If the balance is too low, the provider may delay the refund or debit the merchant's bank account.\u003c/p>\u003cp>A common complaint is &quot;you said you refunded me, but I don't have it&quot;. The merchant's system shows success because the provider accepted the instruction, but the credit still has to pass through clearing and be posted by the issuer. That can take days, and the exact time varies. Give the customer the \u003ca href=\"#Acquirer%20reference%20number\" data-term=\"Acquirer reference number\">acquirer reference number\u003c/a> when your provider exposes one, since their bank can use it to trace the credit.\u003c/p>\u003cp>Refunds interact badly with disputes. If a customer has already opened a chargeback and the merchant also issues a refund, the customer can receive the money twice. Check for an open dispute first. If a refund was issued before the dispute, submit that as evidence through \u003ca href=\"#Representment\" data-term=\"Representment\">representment\u003c/a>.\u003c/p>\u003cp>Visa's rules require a refund to the same payment credential where possible, with listed exceptions. Refunds to a different card are a known fraud pattern. Whether the merchant recovers its processing fees depends on its contract.\u003c/p>","avoid":"","usage":["The customer says the refund never arrived, but our dashboard shows it succeeded.","Send them the ARN. Their bank can use it to find the credit."],"out":[15,21,18,19,60,2,1,23,33,62]},{"name":"Clearing","section":1,"description":"The exchange of final card transaction records between acquirer and issuer, which sets what each institution owes.","body":"\u003cp>Clearing is the exchange of final transaction records between an \u003ca href=\"#Acquirer\" data-term=\"Acquirer\">acquirer\u003c/a> and an \u003ca href=\"#Issuer\" data-term=\"Issuer\">issuer\u003c/a> through a \u003ca href=\"#Card%20network\" data-term=\"Card network\">card network\u003c/a>. It tells the issuer the final amount to post to the customer's account and calculates what the institutions owe each other. Visa's rules describe it as the validation and valuation of records exchanged between Visa and its members. Mastercard calls the record a first presentment.\u003c/p>\u003cp>Clearing sits between the \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchant's\u003c/a> instruction and the actual movement of money.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Stage\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Output\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#Card%20authorization\" data-term=\"Card authorization\">Card authorization\u003c/a>\u003c/td>\u003ctd>Issuer approves the payment\u003c/td>\u003ctd>Approval and hold\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Capture\" data-term=\"Capture\">Capture\u003c/a>\u003c/td>\u003ctd>Merchant confirms the amount\u003c/td>\u003ctd>Instruction to acquirer or batch\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Clearing\u003c/td>\u003ctd>Records are exchanged and valued\u003c/td>\u003ctd>Final amounts, fees, positions\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Settlement\" data-term=\"Settlement\">Settlement\u003c/a>\u003c/td>\u003ctd>Institutions pay net amounts\u003c/td>\u003ctd>Funds transferred\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Payout\" data-term=\"Payout\">Payout\u003c/a>\u003c/td>\u003ctd>Provider pays the merchant\u003c/td>\u003ctd>Bank deposit\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Clearing is where the actual transaction amount becomes final, and it can differ from the authorized amount. A restaurant authorizes the bill and clears it with a tip. A clearing record is also where \u003ca href=\"#Interchange%20fee\" data-term=\"Interchange fee\">interchange\u003c/a> and \u003ca href=\"#Scheme%20fee\" data-term=\"Scheme fee\">scheme fees\u003c/a> are typically determined, so data quality at this stage affects cost. Incorrect \u003ca href=\"#Merchant%20category%20code\" data-term=\"Merchant category code\">merchant category codes\u003c/a> or missing fields can lead to a higher fee category.\u003c/p>\u003cp>Most card transactions use a dual-message flow, with one message for authorization and another for clearing. Some debit systems use a single message for both.\u003c/p>\u003cp>A common engineering problem is treating the authorization as the final record. If the clearing amount differs, or clears on a different date or in a different currency, a ledger built from authorization data will not match the \u003ca href=\"#Settlement%20file\" data-term=\"Settlement file\">settlement file\u003c/a>. Build \u003ca href=\"#Payment%20reconciliation\" data-term=\"Payment reconciliation\">payment reconciliation\u003c/a> from cleared records. Visa also assesses fees on clearing records with no matching approval, so clearing transactions must keep the references from the original authorization.\u003c/p>","avoid":"","usage":["Why does the charge in our ledger differ from the settlement report by the tip amount?","The ledger used the auth. Clearing carried the final amount, so reconcile against that."],"out":[3,2,4,1,13,15,22,23,66,67,32,112,111]},{"name":"Settlement","section":1,"description":"The transfer of net funds between issuers, acquirers and the card network after clearing has set the amounts owed.","body":"\u003cp>Settlement is the movement of money between financial institutions after \u003ca href=\"#Clearing\" data-term=\"Clearing\">clearing\u003c/a> has established what each one owes. In a card payment, the \u003ca href=\"#Issuer\" data-term=\"Issuer\">issuer\u003c/a> pays, usually on a net basis, through the \u003ca href=\"#Card%20network\" data-term=\"Card network\">card network's\u003c/a> settlement arrangements, and the \u003ca href=\"#Acquirer\" data-term=\"Acquirer\">acquirer\u003c/a> receives funds. Visa's rules define settlement as the reporting and funds transfer of amounts owed by one member to another, or to Visa, as a result of clearing.\u003c/p>\u003cp>Networks usually settle net positions rather than each individual card payment. An acquirer may be owed for millions of purchases and owe for \u003ca href=\"#Refund\" data-term=\"Refund\">refunds\u003c/a> and \u003ca href=\"#Chargeback\" data-term=\"Chargeback\">chargebacks\u003c/a>, so one net amount moves in a settlement currency.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Stage\u003c/th>\u003cth>Parties\u003c/th>\u003cth>What moves\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#Card%20authorization\" data-term=\"Card authorization\">Card authorization\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"#Merchant\" data-term=\"Merchant\">Merchant\u003c/a> to issuer\u003c/td>\u003ctd>A message and a hold\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Clearing\u003c/td>\u003ctd>Acquirer, network, issuer\u003c/td>\u003ctd>Transaction records\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Settlement\u003c/td>\u003ctd>Issuer, network, acquirer\u003c/td>\u003ctd>Net funds between institutions\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Payout\" data-term=\"Payout\">Payout\u003c/a>\u003c/td>\u003ctd>Acquirer or provider to merchant\u003c/td>\u003ctd>Funds to a business bank account\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The word causes a specific misunderstanding. A provider dashboard may show a payment as &quot;settled&quot; while the merchant's bank has received nothing. That status can mean the transaction was submitted, that the provider has received funds, or that the payment is in the next payout. Each provider defines it differently, so read the documentation rather than assuming that settled means deposited.\u003c/p>\u003cp>Settlement timing depends on the network, currency, business days and bank holidays. A \u003ca href=\"#Payment%20service%20provider\" data-term=\"Payment service provider\">payment service provider\u003c/a> may add its own payout delay.\u003c/p>\u003cp>Engineers usually meet settlement through a \u003ca href=\"#Settlement%20file\" data-term=\"Settlement file\">settlement file\u003c/a> or report. It often lists amounts grouped by batch and net of fees, in the settlement currency, which may differ from the customer's currency. Matching those records to orders requires shared identifiers, and it is the purpose of \u003ca href=\"#Payment%20reconciliation\" data-term=\"Payment reconciliation\">payment reconciliation\u003c/a>. Track settlement in your \u003ca href=\"#Ledger\" data-term=\"Ledger\">ledger\u003c/a> as a separate event from \u003ca href=\"#Capture\" data-term=\"Capture\">capture\u003c/a> so finance can see money in transit.\u003c/p>","avoid":"","usage":["The dashboard says Friday's sales settled. Why isn't the money in the bank?","Settled just means the acquirer has it. The payout runs on Tuesday."],"out":[21,2,4,3,20,60,13,1,23,6,112,111,109,15]},{"name":"Payout","section":1,"description":"The transfer of a merchant's available funds from its acquirer or payment provider to its bank account.","body":"\u003cp>A payout is the transfer of funds from an \u003ca href=\"#Acquirer\" data-term=\"Acquirer\">acquirer\u003c/a> or \u003ca href=\"#Payment%20service%20provider\" data-term=\"Payment service provider\">payment service provider\u003c/a> to a \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchant's\u003c/a> bank account. It is the last step of the card flow and the first point at which the business can spend the money. Some providers call it a deposit, remittance or funding.\u003c/p>\u003cp>A payout differs from \u003ca href=\"#Settlement\" data-term=\"Settlement\">settlement\u003c/a>, which moves money between institutions. Settlement can complete while the merchant still has not been paid.\u003c/p>\u003cp>A payout is rarely the sum of the day's sales. It is a net amount.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Line item\u003c/th>\u003cth>Effect on payout\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Captured sales\u003c/td>\u003ctd>Adds\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Refund\" data-term=\"Refund\">Refunds\u003c/a>\u003c/td>\u003ctd>Subtracts\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Chargeback\" data-term=\"Chargeback\">Chargebacks\u003c/a> and dispute fees\u003c/td>\u003ctd>Subtracts\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Processing fees\u003c/td>\u003ctd>Subtracts\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Newly withheld \u003ca href=\"#Rolling%20reserve\" data-term=\"Rolling reserve\">rolling reserve\u003c/a>\u003c/td>\u003ctd>Subtracts\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Released reserve\u003c/td>\u003ctd>Adds\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Reversed chargebacks\u003c/td>\u003ctd>Adds\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>This is why finance teams often find a deposit that matches no order total. Reconcile by obtaining the provider's list of transactions included in each payout, using its payout ID, rather than comparing bank deposits with daily sales. This is a main task of \u003ca href=\"#Payment%20reconciliation\" data-term=\"Payment reconciliation\">payment reconciliation\u003c/a>.\u003c/p>\u003cp>A balance can also go negative. If refunds and chargebacks exceed new sales, there is nothing to pay out, and the provider may debit the merchant's bank account or recover the shortfall from future sales. A payout can fail when bank details are wrong or an account is closed, and the funds then return to the provider's balance.\u003c/p>\u003cp>Providers may pause payouts during a risk or compliance review, for example when \u003ca href=\"#KYB\" data-term=\"KYB\">KYB\u003c/a> details are missing, sales patterns change sharply, or a \u003ca href=\"#Sanctions%20screening\" data-term=\"Sanctions screening\">sanctions screening\u003c/a> alert is unresolved.\u003c/p>\u003cp>On a platform, the term also covers payments to sellers, which may use a \u003ca href=\"#Split%20payment\" data-term=\"Split payment\">split payment\u003c/a>. Model each payout in your \u003ca href=\"#Ledger\" data-term=\"Ledger\">ledger\u003c/a> as a separate record linked to the transactions it contains, and treat a provider's &quot;paid&quot; status as provisional until the bank confirms receipt.\u003c/p>","avoid":"","usage":["Today's deposit is 3,100 but we sold 4,000 yesterday.","Pull the payout breakdown. It nets out refunds, fees and that chargeback from last week."],"out":[3,6,1,22,20,60,72,111,50,52,122,109]},{"name":"PAN","section":2,"description":"The primary account number on a payment card, which identifies the issuer and card account under ISO/IEC 7812.","body":"\u003cp>A PAN, or primary account number, is the long number that identifies a payment card account. Its format comes from ISO/IEC 7812, which allows up to 19 digits. Sixteen is common, but not universal, so a form or database column that assumes 16 digits will reject or corrupt valid cards.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Part\u003c/th>\u003cth>Position\u003c/th>\u003cth>Purpose\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#Issuer\" data-term=\"Issuer\">Issuer\u003c/a> identifier\u003c/td>\u003ctd>Leading digits\u003c/td>\u003ctd>The \u003ca href=\"#BIN\" data-term=\"BIN\">BIN\u003c/a>, identifying the issuer or program\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Account identifier\u003c/td>\u003ctd>Middle digits\u003c/td>\u003ctd>The individual account within that issuer\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Check digit\u003c/td>\u003ctd>Final digit\u003c/td>\u003ctd>Catches typing errors using the Luhn formula\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The Luhn check only detects mistyped numbers. A number that passes is well formed, and that says nothing about whether the account exists, is open, or belongs to the person typing it. Only a \u003ca href=\"#Card%20authorization\" data-term=\"Card authorization\">card authorization\u003c/a> can check that.\u003c/p>\u003cp>\u003ca href=\"#PCI%20DSS\" data-term=\"PCI DSS\">PCI DSS\u003c/a> treats the PAN as the defining element of cardholder data: if a system stores, processes or transmits it, that system is in scope. Masking and truncation are different. Masking hides digits on a screen while the full value may still exist underneath. Truncation permanently removes digits from the stored value. PCI SSC publishes the formats it accepts for truncation, and these changed with the move to longer BINs.\u003c/p>\u003cp>The usual incident is accidental storage. A debug log captures a full request body, a support agent pastes a card number into a ticket, or an analytics script reads a checkout field. This widens compliance scope and requires clean-up across logs and backups.\u003c/p>\u003cp>Most \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchants\u003c/a> avoid handling the PAN by using \u003ca href=\"#Hosted%20payment%20fields\" data-term=\"Hosted payment fields\">hosted payment fields\u003c/a> and keeping a \u003ca href=\"#Tokenization\" data-term=\"Tokenization\">PSP token\u003c/a> or \u003ca href=\"#Network%20token\" data-term=\"Network token\">network token\u003c/a>. A network token is itself a different number in PAN format, so code should not assume that every card-shaped value is the underlying card number.\u003c/p>","avoid":"","usage":["Why is compliance asking us to purge three months of application logs?","The request logger captured full PANs from the checkout endpoint. Those logs are now in PCI scope."],"out":[2,25,13,37,1,43,39,40]},{"name":"BIN","section":2,"description":"The leading digits of a card number, identifying the issuer or program. ISO calls it the issuer identification number.","body":"\u003cp>A BIN, or bank identification number, is the leading part of a \u003ca href=\"#PAN\" data-term=\"PAN\">PAN\u003c/a> that identifies the \u003ca href=\"#Issuer\" data-term=\"Issuer\">issuer\u003c/a> or card program. ISO/IEC 7812 calls it the issuer identification number, or IIN.\u003c/p>\u003cp>The BIN was historically six digits. ISO revised the standard to make it eight, converting each six-digit range into a block of one hundred eight-digit ranges. Visa set April 2022 as the date for its clients to support eight-digit BINs and stopped assigning new six-digit issuing BINs after that.\u003c/p>\u003cp>Systems use BIN data to answer questions about a card before or during payment.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Question\u003c/th>\u003cth>Used for\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Which network?\u003c/td>\u003ctd>Showing the logo, \u003ca href=\"#Payment%20routing\" data-term=\"Payment routing\">payment routing\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Credit, debit or prepaid?\u003c/td>\u003ctd>Pricing, eligibility, blocking card types\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Issuing country?\u003c/td>\u003ctd>Fraud rules, \u003ca href=\"#Cross-border%20fee\" data-term=\"Cross-border fee\">cross-border fee\u003c/a> estimates\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Consumer or commercial?\u003c/td>\u003ctd>Fee estimates, invoicing flows\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The move to eight digits created a quiet failure. Code that takes \u003ccode>pan.slice(0, 6)\u003c/code> and looks it up in a local table still runs, but two different programs can now share the same first six digits. A fraud rule or a block aimed at one program can then hit another, and a credit card can be classified as debit. Use the longest available prefix, and refresh BIN tables from your provider or network, because ranges are reassigned.\u003c/p>\u003cp>BIN data is an attribute of the card, so it is not proof of anything about the person using it. Issuing country in particular says where the card was issued, which may differ from where the customer lives. A \u003ca href=\"#Network%20token\" data-term=\"Network token\">network token\u003c/a> can carry its own token range rather than the underlying card's BIN.\u003c/p>\u003cp>A sudden run of declines on sequential cards from the same BIN at one \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchant\u003c/a> is a warning sign of \u003ca href=\"#Card%20testing\" data-term=\"Card testing\">card testing\u003c/a>.\u003c/p>","avoid":"","usage":["Our prepaid block started rejecting normal credit cards from this bank.","The rule matches on six digits. That range is now split across products, so move the lookup to eight-digit BINs."],"out":[24,2,113,73,40,1,55]},{"name":"CVV","section":2,"description":"The short card security code checked by the issuer on remote payments. PCI DSS forbids storing it after authorization.","body":"\u003cp>A CVV, or card verification value, is the short security code on a payment card that an \u003ca href=\"#Issuer\" data-term=\"Issuer\">issuer\u003c/a> can check during a \u003ca href=\"#Card-not-present%20transaction\" data-term=\"Card-not-present transaction\">card-not-present transaction\u003c/a>. It is meant to show that the person paying has access to the card rather than only the \u003ca href=\"#PAN\" data-term=\"PAN\">PAN\u003c/a>. The name varies by network.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Network\u003c/th>\u003cth>Common name\u003c/th>\u003cth>Usual length and location\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Visa\u003c/td>\u003ctd>CVV2\u003c/td>\u003ctd>Three digits, back of card\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Mastercard\u003c/td>\u003ctd>CVC2\u003c/td>\u003ctd>Three digits, back of card\u003c/td>\u003c/tr>\u003ctr>\u003ctd>American Express\u003c/td>\u003ctd>CID\u003c/td>\u003ctd>Four digits, front of card\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The printed code differs from the value encoded on the magnetic stripe, and chip transactions use separate cryptographic values.\u003c/p>\u003cp>\u003ca href=\"#PCI%20DSS\" data-term=\"PCI DSS\">PCI DSS\u003c/a> classes the card verification code as sensitive authentication data. Requirement 3.3.1 forbids storing such data after \u003ca href=\"#Card%20authorization\" data-term=\"Card authorization\">authorization\u003c/a>, even if encrypted. Issuers and companies supporting issuing services have a narrow exception. Teams building subscriptions sometimes save the CVV for later charges. That breaches the standard and is unnecessary: a later \u003ca href=\"#Merchant-initiated%20transaction\" data-term=\"Merchant-initiated transaction\">merchant-initiated transaction\u003c/a> relies on the \u003ca href=\"#Stored%20credential\" data-term=\"Stored credential\">stored credential\u003c/a> framework and does not need the code. Keep it out of logs and queues too.\u003c/p>\u003cp>A CVV check is a signal and does not prove identity. The result comes back with the authorization, and a mismatch does not always cause a decline, because some issuers approve anyway and leave the decision to the \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchant\u003c/a>. Decide in your \u003ca href=\"#Risk%20scoring\" data-term=\"Risk scoring\">risk scoring\u003c/a> rules whether to reverse an approved payment with a failed check. If you do, send an \u003ca href=\"#Authorization%20reversal\" data-term=\"Authorization reversal\">authorization reversal\u003c/a> so the funds are released.\u003c/p>\u003cp>Stolen card data often includes the code, so a correct CVV does not rule out fraud. Unlike \u003ca href=\"#3-D%20Secure\" data-term=\"3-D Secure\">3-D Secure\u003c/a>, a passing CVV check does not by itself give the merchant a \u003ca href=\"#Liability%20shift\" data-term=\"Liability shift\">liability shift\u003c/a>. Repeated CVV failures across attempts on one card are a sign of \u003ca href=\"#Card%20testing\" data-term=\"Card testing\">card testing\u003c/a>.\u003c/p>","avoid":"","usage":["Can we store the CVV encrypted so renewals don't need the customer?","No, PCI DSS bans storing it after authorization, even encrypted. Renewals should use the stored credential flow."],"out":[2,54,24,37,13,118,116,1,59,19,44,47,55]},{"name":"EMV","section":2,"description":"Technical specifications managed by EMVCo for chip and contactless card payments, and for related payment technologies.","body":"\u003cp>EMV is a family of technical specifications for secure card payments, best known for chip cards and contactless payments. The name comes from Europay, Mastercard and Visa. The specifications are managed by EMVCo, a technical body collectively owned by American Express, Discover, JCB, Mastercard, UnionPay and Visa.\u003c/p>\u003cp>A chip card differs from a magnetic stripe in how it proves itself. A stripe holds static data that can be copied. A chip holds secret keys and generates a cryptogram, a one-time code computed over the transaction's details, which the \u003ca href=\"#Issuer\" data-term=\"Issuer\">issuer\u003c/a> can verify.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Step\u003c/th>\u003cth>Who\u003c/th>\u003cth>What happens\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Terminal\u003c/td>\u003ctd>Reads the card and sends transaction details to the chip\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Card\u003c/td>\u003ctd>Generates a cryptogram for this transaction\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Terminal\u003c/td>\u003ctd>Sends it in the \u003ca href=\"#Card%20authorization\" data-term=\"Card authorization\">card authorization\u003c/a> request\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>Issuer\u003c/td>\u003ctd>Recalculates the cryptogram and approves or declines\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Card\u003c/td>\u003ctd>Can verify the issuer's response and complete the transaction\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Because each cryptogram is tied to one transaction, data captured from a chip payment cannot be replayed to make a counterfeit card work. This is the protection chip adds in a \u003ca href=\"#Card-present%20transaction\" data-term=\"Card-present transaction\">card-present transaction\u003c/a>.\u003c/p>\u003cp>EMV does not protect a \u003ca href=\"#Card-not-present%20transaction\" data-term=\"Card-not-present transaction\">card-not-present transaction\u003c/a>, because no chip takes part. For that channel, EMVCo publishes separate specifications for \u003ca href=\"#3-D%20Secure\" data-term=\"3-D Secure\">3-D Secure\u003c/a> and for payment tokens, which are used in \u003ca href=\"#Network%20token\" data-term=\"Network token\">network tokens\u003c/a>. The shared name causes confusion: &quot;EMV 3DS&quot; is an online authentication protocol and has no chip involved.\u003c/p>\u003cp>EMVCo does not set network rules or enforce adoption. Each \u003ca href=\"#Card%20network\" data-term=\"Card network\">card network\u003c/a> decides those separately, including the chip \u003ca href=\"#Liability%20shift\" data-term=\"Liability shift\">liability shift\u003c/a>. Where it applies, a \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchant\u003c/a> that swipes a chip card on a terminal that cannot read chips can be liable for resulting counterfeit fraud.\u003c/p>","avoid":"","usage":["The new terminal keeps failing on chip, so staff are just swiping.","Stop that. If those turn out to be counterfeit, the liability can land on us. Get the reader replaced."],"out":[2,13,53,54,44,40,4,47,1]},{"name":"ISO 8583","section":2,"description":"The international standard for card transaction messages exchanged between acquirers and issuers.","body":"\u003cp>ISO 8583 is the international standard for the messages that card systems exchange, such as authorization requests and responses. It defines a common interface between \u003ca href=\"#Acquirer\" data-term=\"Acquirer\">acquirers\u003c/a> and \u003ca href=\"#Issuer\" data-term=\"Issuer\">issuers\u003c/a>, usually through a \u003ca href=\"#Card%20network\" data-term=\"Card network\">card network\u003c/a>. The current edition is ISO 8583:2023. Older editions remain in production.\u003c/p>\u003cp>An ISO 8583 message has three main parts.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Part\u003c/th>\u003cth>Purpose\u003c/th>\u003cth>Example\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Message type indicator\u003c/td>\u003ctd>Says what the message is\u003c/td>\u003ctd>\u003ccode>0100\u003c/code> authorization request\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Bitmap\u003c/td>\u003ctd>Marks which data fields are present\u003c/td>\u003ctd>Bits for fields 2, 3, 4\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Data elements\u003c/td>\u003ctd>Carry the values\u003c/td>\u003ctd>\u003ca href=\"#PAN\" data-term=\"PAN\">PAN\u003c/a>, amount, response code\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Mastercard's rules show how these labels appear in practice.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Message\u003c/th>\u003cth>Meaning\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>0100\u003c/code>\u003c/td>\u003ctd>Authorization request\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>0110\u003c/code>\u003c/td>\u003ctd>Authorization response\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>0400\u003c/code>\u003c/td>\u003ctd>Reversal request\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>0420\u003c/code>\u003c/td>\u003ctd>Acquirer reversal advice\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>1240\u003c/code>\u003c/td>\u003ctd>First presentment, for \u003ca href=\"#Clearing\" data-term=\"Clearing\">clearing\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The standard is a framework, and each network implements its own variant. Field usage, private data elements and code values differ between Visa, Mastercard and domestic switches. A parser built from the ISO document alone will not correctly handle a real network feed, so work from the network or processor's interface specification.\u003c/p>\u003cp>Most application developers never see ISO 8583 because a \u003ca href=\"#Payment%20service%20provider\" data-term=\"Payment service provider\">payment service provider\u003c/a> wraps it in a JSON API. It still shapes what they receive. A \u003ca href=\"#Decline%20code\" data-term=\"Decline code\">decline code\u003c/a> such as \u003ccode>51\u003c/code> comes from a response code field, and a truncated \u003ca href=\"#Statement%20descriptor\" data-term=\"Statement descriptor\">statement descriptor\u003c/a> reflects a fixed-length name field.\u003c/p>\u003cp>Engineers working closer to the rails meet different failures: a bitmap that does not match the fields sent, an amount in the wrong \u003ca href=\"#Minor%20unit\" data-term=\"Minor unit\">minor unit\u003c/a>, or a reversal that omits the original transaction's reference data. Log parsed messages with the PAN and other sensitive fields masked, since raw dumps bring logs into \u003ca href=\"#PCI%20DSS\" data-term=\"PCI DSS\">PCI DSS\u003c/a> scope.\u003c/p>\u003cp>ISO 8583 is separate from \u003ca href=\"#ISO%2020022\" data-term=\"ISO 20022\">ISO 20022\u003c/a>, the data standard widely used for bank payments.\u003c/p>","avoid":"","usage":["The processor rejected our message but the JSON looks fine.","Check the ISO 8583 output. The bitmap flags field 43, but our mapper never set the merchant name."],"out":[3,2,4,24,21,6,29,35,76,37,90]},{"name":"Decline code","section":2,"description":"The response code returned when a card authorization is refused, indicating the reason and whether a retry makes sense.","body":"\u003cp>A decline code is the value returned when a \u003ca href=\"#Card%20authorization\" data-term=\"Card authorization\">card authorization\u003c/a> is refused. It usually originates from the \u003ca href=\"#Issuer\" data-term=\"Issuer\">issuer\u003c/a> in the response code field of an \u003ca href=\"#ISO%208583\" data-term=\"ISO 8583\">ISO 8583\u003c/a> message, though a network, \u003ca href=\"#Acquirer\" data-term=\"Acquirer\">acquirer\u003c/a> or fraud tool can also generate one. Examples include \u003ccode>51\u003c/code> for insufficient funds and \u003ccode>05\u003c/code> for &quot;do not honor&quot;.\u003c/p>\u003cp>Meanings are not identical across networks, and \u003ca href=\"#Payment%20service%20provider\" data-term=\"Payment service provider\">payment service providers\u003c/a> often translate raw codes into their own labels. Keep the original code as well.\u003c/p>\u003cp>Visa's rules group decline codes into four categories that control retry behaviour.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Visa category\u003c/th>\u003cth>Example codes\u003c/th>\u003cth>\u003ca href=\"#Merchant\" data-term=\"Merchant\">Merchant\u003c/a> response\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1. Issuer will never approve\u003c/td>\u003ctd>\u003ccode>04\u003c/code>, \u003ccode>41\u003c/code> lost, \u003ccode>43\u003c/code> stolen, \u003ccode>46\u003c/code> closed\u003c/td>\u003ctd>Do not retry this card\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2. Cannot approve at this time\u003c/td>\u003ctd>\u003ccode>51\u003c/code> funds, \u003ccode>61\u003c/code> limit, \u003ccode>91\u003c/code> issuer down\u003c/td>\u003ctd>Retry within Visa's limits\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3. Data quality\u003c/td>\u003ctd>\u003ccode>54\u003c/code> expired, \u003ccode>82\u003c/code> failed card check\u003c/td>\u003ctd>Correct the data, then retry\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4. Generic\u003c/td>\u003ctd>All other codes\u003c/td>\u003ctd>Retry within limits, or ask for another card\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>These categories are Visa's. Mastercard signals retry guidance differently, including through merchant advice codes in its responses. Reattempt limits are set by each network and can change, so take them from current rules or your provider.\u003c/p>\u003cp>The practical distinction is between a \u003ca href=\"#Soft%20decline\" data-term=\"Soft decline\">soft decline\u003c/a>, which may succeed after a change, and a \u003ca href=\"#Hard%20decline\" data-term=\"Hard decline\">hard decline\u003c/a>, which will not. A retry job that treats all failures the same will keep charging lost or closed cards, adding cost and possibly breaching network limits. This is a common defect in \u003ca href=\"#Recurring%20billing\" data-term=\"Recurring billing\">recurring billing\u003c/a> and \u003ca href=\"#Dunning\" data-term=\"Dunning\">dunning\u003c/a>.\u003c/p>\u003cp>Be careful with customer messages. Showing &quot;suspected fraud&quot; or &quot;stolen card&quot; can alert a criminal and embarrass a real customer. Say the payment was declined and suggest another method. A jump in one code can indicate an integration problem or \u003ca href=\"#Card%20testing\" data-term=\"Card testing\">card testing\u003c/a>.\u003c/p>","avoid":"","usage":["The billing job retried this card eleven times last week.","It's a code 46, closed account. That's category 1 for Visa, so we should never have retried it."],"out":[13,2,28,3,6,1,30,31,119,120,55]},{"name":"Soft decline","section":2,"description":"A card decline that may succeed after a change, most specifically when the issuer requires stronger authentication.","body":"\u003cp>A soft decline is a card refusal that may succeed if something changes. The term has two uses, and teams often mix them up.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Use\u003c/th>\u003cth>Meaning\u003c/th>\u003cth>Correct response\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Narrow\u003c/td>\u003ctd>\u003ca href=\"#Issuer\" data-term=\"Issuer\">Issuer\u003c/a> requires \u003ca href=\"#Strong%20customer%20authentication\" data-term=\"Strong customer authentication\">strong customer authentication\u003c/a>\u003c/td>\u003ctd>Authenticate, then send a new request\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Broad\u003c/td>\u003ctd>Any temporary condition, such as insufficient funds or an issuer outage\u003c/td>\u003ctd>Retry later, within network limits\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The narrow sense comes from European regulation. Under \u003ca href=\"#PSD2\" data-term=\"PSD2\">PSD2\u003c/a>, when a payment needs authentication and arrives without it, the issuer can decline with a specific code asking for it. Mastercard's Transaction Processing Rules require issuers in its listed SCA countries to use a &quot;soft decline&quot; response in this case, and require the \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchant\u003c/a> to attempt \u003ca href=\"#3-D%20Secure\" data-term=\"3-D Secure\">3-D Secure\u003c/a> with a mandated challenge or use another SCA method. Visa's rules list code \u003ccode>1A\u003c/code>, &quot;additional customer authentication required&quot;, for its Europe and CEMEA regions.\u003c/p>\u003cp>The typical symptom appears after a merchant requests an \u003ca href=\"#SCA%20exemption\" data-term=\"SCA exemption\">SCA exemption\u003c/a>. The issuer does not accept it and returns a soft decline. If the checkout shows a generic &quot;card declined&quot; message, the customer leaves even though one authentication step would probably have completed the sale.\u003c/p>\u003cp>The handling should be explicit in the \u003ca href=\"#Payment%20state%20machine\" data-term=\"Payment state machine\">payment state machine\u003c/a>:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Step\u003c/th>\u003cth>Who\u003c/th>\u003cth>What happens\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Merchant\u003c/td>\u003ctd>Sends the \u003ca href=\"#Card%20authorization\" data-term=\"Card authorization\">card authorization\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Issuer\u003c/td>\u003ctd>Returns the authentication-required code\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Merchant\u003c/td>\u003ctd>Starts 3-D Secure with the customer present\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>Merchant\u003c/td>\u003ctd>Sends a new authorization with the authentication data\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>If the customer is absent, as in a \u003ca href=\"#Merchant-initiated%20transaction\" data-term=\"Merchant-initiated transaction\">merchant-initiated transaction\u003c/a>, step 3 cannot happen immediately. Ask them to return and authenticate through an email or in-app prompt.\u003c/p>\u003cp>The broad usage needs a \u003ca href=\"#Payment%20retry\" data-term=\"Payment retry\">payment retry\u003c/a> policy with limits and spacing. Contrast both uses with a \u003ca href=\"#Hard%20decline\" data-term=\"Hard decline\">hard decline\u003c/a>, where retrying the same card will not help.\u003c/p>","avoid":"","usage":["Conversion in Germany dropped after we turned on the low-value exemption.","Those are soft declines. We're showing an error instead of falling back to 3DS."],"out":[2,45,48,1,44,46,105,13,118,108,31]},{"name":"Hard decline","section":2,"description":"A card refusal that retrying will not fix, such as a closed account or a card reported lost or stolen.","body":"\u003cp>A hard decline is a card refusal that will not be resolved by trying the same card again. The account may be closed, the card may be reported lost or stolen, or the transaction type may not be allowed. The next step is to get a different payment method.\u003c/p>\u003cp>&quot;Hard decline&quot; is industry shorthand and has no single definition across networks. Visa's rules contain the closest formal version: Category 1 \u003ca href=\"#Decline%20code\" data-term=\"Decline code\">decline codes\u003c/a>, labelled &quot;\u003ca href=\"#Issuer\" data-term=\"Issuer\">issuer\u003c/a> will never approve&quot;, which a \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchant\u003c/a> must never reattempt.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Visa Category 1 code\u003c/th>\u003cth>Meaning\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>04\u003c/code>\u003c/td>\u003ctd>Pick up card, no fraud\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>07\u003c/code>\u003c/td>\u003ctd>Pick up card, special condition\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>41\u003c/code>\u003c/td>\u003ctd>Lost card\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>43\u003c/code>\u003c/td>\u003ctd>Stolen card\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>46\u003c/code>\u003c/td>\u003ctd>Closed account\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>57\u003c/code>\u003c/td>\u003ctd>Transaction not permitted to \u003ca href=\"#Cardholder\" data-term=\"Cardholder\">cardholder\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>R0\u003c/code>, \u003ccode>R1\u003c/code>, \u003ccode>R3\u003c/code>\u003c/td>\u003ctd>Stop-payment instructions\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Other networks classify codes differently. Mastercard, for example, uses merchant advice codes to tell merchants how to respond, so a mapping built only from Visa's table is incomplete. Generic codes such as \u003ccode>05\u003c/code> &quot;do not honor&quot; should not automatically count as hard or soft. A \u003ca href=\"#Soft%20decline\" data-term=\"Soft decline\">soft decline\u003c/a>, by contrast, may succeed after a change.\u003c/p>\u003cp>The common failure occurs in \u003ca href=\"#Recurring%20billing\" data-term=\"Recurring billing\">recurring billing\u003c/a>. A subscription job retries a closed card on every \u003ca href=\"#Dunning\" data-term=\"Dunning\">dunning\u003c/a> cycle. Each attempt fails, adds authorization cost, and lowers the merchant's \u003ca href=\"#Authorization%20rate\" data-term=\"Authorization rate\">authorization rate\u003c/a>, and it can also breach network retry rules.\u003c/p>\u003cp>The correct handling is to stop retries, mark the stored card unusable, and ask the customer to update it. An \u003ca href=\"#Account%20updater\" data-term=\"Account updater\">account updater\u003c/a> or \u003ca href=\"#Network%20token\" data-term=\"Network token\">network token\u003c/a> can sometimes supply new details after a reissue, but do not use these to continue charging a card reported stolen or an account the customer closed deliberately. Tell the customer only that the payment was declined.\u003c/p>","avoid":"","usage":["This subscription has failed six months in a row. Should dunning keep going?","Check the code. If it's a 46, that's a hard decline, so stop retrying and email them for a new card."],"out":[29,2,1,0,30,119,120,115,121,40]},{"name":"Merchant category code","section":2,"description":"A four-digit code classifying a merchant's type of business, used for fees, card restrictions and risk rules.","body":"\u003cp>A merchant category code (MCC) is a four-digit number that classifies a merchant's type of business, such as a grocery store, airline or software seller. ISO 18245 defines a set of these codes, and \u003ca href=\"#Card%20network\" data-term=\"Card network\">card networks\u003c/a> publish their own lists and assignment rules. Visa's Merchant Data Standards Manual says the MCC describes a merchant's primary business, based on annual sales volume.\u003c/p>\u003cp>The \u003ca href=\"#Acquirer\" data-term=\"Acquirer\">acquirer\u003c/a> or \u003ca href=\"#Payment%20service%20provider\" data-term=\"Payment service provider\">payment service provider\u003c/a> normally assigns the code at onboarding. It then travels in each \u003ca href=\"#Card%20authorization\" data-term=\"Card authorization\">card authorization\u003c/a> and \u003ca href=\"#Clearing\" data-term=\"Clearing\">clearing\u003c/a> record, where several parties use it.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Party\u003c/th>\u003cth>How it uses the MCC\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#Issuer\" data-term=\"Issuer\">Issuer\u003c/a>\u003c/td>\u003ctd>Applies rewards, spending controls and block rules\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Network\u003c/td>\u003ctd>Applies category-specific rules and \u003ca href=\"#Interchange%20fee\" data-term=\"Interchange fee\">interchange\u003c/a> programs\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Acquirer\u003c/td>\u003ctd>Assesses merchant risk and pricing\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Cardholder\" data-term=\"Cardholder\">Cardholder\u003c/a>\u003c/td>\u003ctd>Sees spending categories in a banking app\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>An incorrect code can cause failures that look unrelated. A company card program may block some categories, so a business coded as gambling or money transfer can see declines from customers whose cards work elsewhere. A wrong MCC can also change the fees the merchant pays, or remove eligibility for a feature such as \u003ca href=\"#Incremental%20authorization\" data-term=\"Incremental authorization\">incremental authorization\u003c/a>, which networks often limit by category.\u003c/p>\u003cp>MCC is different from a product category in your own catalogue. It describes the business as a whole, so one transaction for a single item does not get its own code. A merchant with distinct lines of business may need separate merchant IDs with separate MCCs, depending on network rules.\u003c/p>\u003cp>Deliberately using a misleading code to obtain lower fees or avoid a restricted category is a rule violation, and it can lead to network penalties passed on by the acquirer or to closure of the \u003ca href=\"#Merchant%20account\" data-term=\"Merchant account\">merchant account\u003c/a>. If the business changes, ask the acquirer to review the code.\u003c/p>","avoid":"","usage":["Corporate cards keep getting declined on our site, but only corporate cards.","We're coded under a restricted MCC. Ask the acquirer to review our classification."],"out":[4,3,6,13,21,2,66,0,17,11]},{"name":"Acquirer reference number","section":2,"description":"A reference created for a cleared card transaction, used to trace refunds and disputes between acquirer and issuer.","body":"\u003cp>An acquirer reference number (ARN) is an identifier attached to a card transaction when it enters \u003ca href=\"#Clearing\" data-term=\"Clearing\">clearing\u003c/a>. Both the acquirer and the \u003ca href=\"#Issuer\" data-term=\"Issuer\">issuer\u003c/a> can use it to find the same transaction, so it is the reference most often used to trace a \u003ca href=\"#Refund\" data-term=\"Refund\">refund\u003c/a> or a dispute. Visa's rules refer to the acquirer reference number, and Mastercard's rules call the equivalent value acquirer reference data (ARD).\u003c/p>\u003cp>The ARN is one of several identifiers that appear at different stages, and they are easy to confuse.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Identifier\u003c/th>\u003cth>Created at\u003c/th>\u003cth>Main use\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Authorization code\u003c/td>\u003ctd>Approval\u003c/td>\u003ctd>Short code from the issuer for that approval\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Network%20transaction%20ID\" data-term=\"Network transaction ID\">Network transaction ID\u003c/a>\u003c/td>\u003ctd>Authorization\u003c/td>\u003ctd>Links related network messages\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ARN\u003c/td>\u003ctd>Clearing\u003c/td>\u003ctd>Tracing between acquirer and issuer\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Provider payment ID\u003c/td>\u003ctd>Provider API\u003c/td>\u003ctd>Finding the payment in your provider\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Merchant\" data-term=\"Merchant\">Merchant's\u003c/a> order ID\u003c/td>\u003ctd>Checkout\u003c/td>\u003ctd>Finding the order in your own system\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Because the ARN comes from clearing, it does not exist at authorization. A payment that has been authorized but not \u003ca href=\"#Capture\" data-term=\"Capture\">captured\u003c/a> has none, and one that has just been refunded may not have one until the refund is submitted. Model it as optional and populate it from a later event or report.\u003c/p>\u003cp>A typical use is a refund complaint. A customer says the money never arrived, and the \u003ca href=\"#Cardholder\" data-term=\"Cardholder\">cardholder's\u003c/a> bank says it has no record. The merchant asks its \u003ca href=\"#Payment%20service%20provider\" data-term=\"Payment service provider\">payment service provider\u003c/a> for the refund's ARN and gives it to the customer, who gives it to the bank. The bank can then search its records for that exact credit. The refund has its own reference, so make sure you send that one and not the ARN of the original purchase.\u003c/p>\u003cp>In a \u003ca href=\"#Chargeback\" data-term=\"Chargeback\">chargeback\u003c/a>, the ARN ties the dispute back to the original sale. Store it against the payment record.\u003c/p>","avoid":"","usage":["Her bank says they can't see the refund we sent.","Get the ARN for the refund from the provider. The bank can trace the credit with that."],"out":[21,2,20,34,1,15,0,6,60]},{"name":"Network transaction ID","section":2,"description":"A card network's identifier for a transaction, used to link later messages and stored-card payments to the original.","body":"\u003cp>A network transaction ID is the identifier a \u003ca href=\"#Card%20network\" data-term=\"Card network\">card network\u003c/a> assigns to a transaction, returned with the \u003ca href=\"#Card%20authorization\" data-term=\"Card authorization\">card authorization\u003c/a> response. Later messages for the same payment, and later payments that depend on it, carry this value so that the network and \u003ca href=\"#Issuer\" data-term=\"Issuer\">issuer\u003c/a> can connect them. The generic term covers different network-specific fields.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Network\u003c/th>\u003cth>Name in the rules\u003c/th>\u003cth>Notes\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Visa\u003c/td>\u003ctd>Transaction Identifier\u003c/td>\u003ctd>Assigned per transaction, used as an audit trail through the life cycle\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Mastercard\u003c/td>\u003ctd>Trace ID\u003c/td>\u003ctd>Built from network reference data and settlement date\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>It is different from the \u003ca href=\"#Acquirer%20reference%20number\" data-term=\"Acquirer reference number\">acquirer reference number\u003c/a>, which appears at \u003ca href=\"#Clearing\" data-term=\"Clearing\">clearing\u003c/a> and is the usual reference for tracing a \u003ca href=\"#Refund\" data-term=\"Refund\">refund\u003c/a> with a bank. The network transaction ID exists from authorization onward and is primarily for system-to-system linking.\u003c/p>\u003cp>The ID matters most for \u003ca href=\"#Stored%20credential\" data-term=\"Stored credential\">stored credentials\u003c/a>. When a customer saves a card, the first \u003ca href=\"#Customer-initiated%20transaction\" data-term=\"Customer-initiated transaction\">customer-initiated transaction\u003c/a> establishes consent. Each later \u003ca href=\"#Merchant-initiated%20transaction\" data-term=\"Merchant-initiated transaction\">merchant-initiated transaction\u003c/a> references that original ID, showing the issuer that this charge belongs to an agreed series. Under \u003ca href=\"#PSD2\" data-term=\"PSD2\">PSD2\u003c/a>, this link also helps show why a later charge, made without the customer present, was sent without \u003ca href=\"#Strong%20customer%20authentication\" data-term=\"Strong customer authentication\">strong customer authentication\u003c/a>.\u003c/p>\u003cp>The failure usually appears during a migration. A company moves to a new \u003ca href=\"#Payment%20service%20provider\" data-term=\"Payment service provider\">payment service provider\u003c/a>, imports card numbers or tokens, but leaves the original network IDs behind. Renewals now look like unlinked payments with no customer present, and issuers decline more of them, often with an authentication-required \u003ca href=\"#Soft%20decline\" data-term=\"Soft decline\">soft decline\u003c/a>. Ask for the network transaction IDs in the export, and confirm the new provider can accept them.\u003c/p>\u003cp>Store the ID with the payment method and with each payment, and pass through the value from the correct original transaction. Fabricating or reusing an unrelated ID misrepresents the transaction.\u003c/p>","avoid":"","usage":["Renewal declines jumped right after the PSP migration.","We imported the tokens but not the network transaction IDs, so the issuers can't link those charges to the original consent."],"out":[4,13,2,33,21,20,116,117,118,48,45,6,30]},{"name":"Statement descriptor","section":2,"description":"The merchant name and details a cardholder sees for a payment on a bank or card statement.","body":"\u003cp>A statement descriptor is the text identifying a \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchant\u003c/a> on a \u003ca href=\"#Cardholder\" data-term=\"Cardholder\">cardholder's\u003c/a> bank or card statement. It is built from the merchant name and location data carried in the \u003ca href=\"#Card%20authorization\" data-term=\"Card authorization\">card authorization\u003c/a> and \u003ca href=\"#Clearing\" data-term=\"Clearing\">clearing\u003c/a> messages, such as the card acceptor name field in \u003ca href=\"#ISO%208583\" data-term=\"ISO 8583\">ISO 8583\u003c/a>. The \u003ca href=\"#Issuer\" data-term=\"Issuer\">issuer\u003c/a> decides how to display it, so the same payment can look different across banking apps.\u003c/p>\u003cp>An unclear descriptor directly causes disputes. A customer buys from a shop called Northwind but the statement reads \u003ccode>NWD HOLDINGS LTD\u003c/code>. Weeks later they do not recognise it and report it to their bank as fraud, producing a \u003ca href=\"#Chargeback\" data-term=\"Chargeback\">chargeback\u003c/a> on a legitimate order. This is a common form of \u003ca href=\"#Friendly%20fraud\" data-term=\"Friendly fraud\">friendly fraud\u003c/a>.\u003c/p>\u003cp>Visa's Merchant Data Standards Manual calls the merchant name the most important factor in cardholder recognition, and requires it to be the name most prominently displayed by the merchant and recognised by cardholders. Visa's rules also require \u003ca href=\"#Acquirer\" data-term=\"Acquirer\">acquirers\u003c/a> to correct names that are non-compliant or that confuse cardholders.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Descriptor\u003c/th>\u003cth>Result\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Legal company name only\u003c/td>\u003ctd>Often unrecognised\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Trading or brand name\u003c/td>\u003ctd>Usually recognised\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Brand and order reference\u003c/td>\u003ctd>Easier to match to a receipt\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Platform name only\u003c/td>\u003ctd>Customer may not recognise the actual seller\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Length limits are tight and vary by network and provider, so test the shortened version. A \u003ca href=\"#Payment%20service%20provider\" data-term=\"Payment service provider\">payment service provider\u003c/a> may let you set a static descriptor for the account and a dynamic suffix per payment. Platforms often use a prefix and seller name. If a \u003ca href=\"#Merchant%20of%20record\" data-term=\"Merchant of record\">merchant of record\u003c/a> is involved, its name normally appears, so mention it at checkout and on the receipt.\u003c/p>\u003cp>To reduce disputes, use the name customers see on your website, send a receipt that shows the exact descriptor, and include a support contact where the format allows.\u003c/p>","avoid":"","usage":["Half of this month's fraud disputes are from customers who did get their orders.","Our descriptor still shows the holding company. Change it to the store name."],"out":[1,0,13,21,28,2,60,57,3,6,10]},{"name":"Address verification","section":2,"description":"A check comparing a customer's billing postcode and street address with the card issuer's records for online payments.","body":"\u003cp>Address verification, often called AVS after the Address Verification Service, is a check that compares the billing address a customer enters with the address held by their \u003ca href=\"#Issuer\" data-term=\"Issuer\">issuer\u003c/a>. It runs during a \u003ca href=\"#Card%20authorization\" data-term=\"Card authorization\">card authorization\u003c/a> for a \u003ca href=\"#Card-not-present%20transaction\" data-term=\"Card-not-present transaction\">card-not-present transaction\u003c/a>. The issuer returns a result code, and the \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchant\u003c/a> decides what to do with it.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Result\u003c/th>\u003cth>What it suggests\u003c/th>\u003cth>Common handling\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Full match\u003c/td>\u003ctd>Address details agree\u003c/td>\u003ctd>Treat as a positive signal\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Postcode only\u003c/td>\u003ctd>Street differs or was not checked\u003c/td>\u003ctd>Weigh with other signals\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Street only\u003c/td>\u003ctd>Postcode differs\u003c/td>\u003ctd>Weigh with other signals\u003c/td>\u003c/tr>\u003ctr>\u003ctd>No match\u003c/td>\u003ctd>Neither agrees\u003c/td>\u003ctd>Review or request more authentication\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Unavailable\u003c/td>\u003ctd>Issuer or region does not support it\u003c/td>\u003ctd>Do not treat as a failure\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Exact result codes vary by network and provider.\u003c/p>\u003cp>AVS is regional. Visa's rules require issuers to participate in listed regions and countries, including the US, Canada, Europe, Australia, New Zealand and Singapore, and added several Latin American countries effective October 2026. Those rules focus on postal code verification, with street address checked when present. Coverage elsewhere is limited, so a global rule that blocks every non-match will reject many valid international customers.\u003c/p>\u003cp>An AVS mismatch usually does not stop an approval on its own. An issuer can approve a payment with a failed address check, so the merchant holds an approved transaction and has to choose. If it rejects the order, it should send an \u003ca href=\"#Authorization%20reversal\" data-term=\"Authorization reversal\">authorization reversal\u003c/a>. Otherwise the customer sees a pending \u003ca href=\"#Authorization%20hold\" data-term=\"Authorization hold\">authorization hold\u003c/a> for an order that was refused.\u003c/p>\u003cp>False mismatches are common, because customers move house or abbreviate street names.\u003c/p>\u003cp>Treat AVS as one input to \u003ca href=\"#Risk%20scoring\" data-term=\"Risk scoring\">risk scoring\u003c/a>. It does not authenticate the \u003ca href=\"#Cardholder\" data-term=\"Cardholder\">cardholder\u003c/a>, and a match does not provide the \u003ca href=\"#Liability%20shift\" data-term=\"Liability shift\">liability shift\u003c/a> that \u003ca href=\"#3-D%20Secure\" data-term=\"3-D Secure\">3-D Secure\u003c/a> can.\u003c/p>","avoid":"","usage":["We're rejecting a lot of UK orders on address mismatch.","Stop hard-blocking on AVS. Use it as one risk signal and send a reversal when we do refuse."],"out":[2,13,54,1,19,14,59,0,47,44]},{"name":"PCI DSS","section":3,"description":"The security standard for organisations that store, process or transmit payment card account data.","body":"\u003cp>PCI DSS, the Payment Card Industry Data Security Standard, is the security standard for organisations that store, process or transmit payment card account data, or that can affect its security. It is published by the PCI Security Standards Council (PCI SSC), founded by the major \u003ca href=\"#Card%20network\" data-term=\"Card network\">card networks\u003c/a>. The current series is v4.x, and the Council's document library holds the latest revision.\u003c/p>\u003cp>Account data has two parts, and the rules treat them differently.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Data type\u003c/th>\u003cth>Examples\u003c/th>\u003cth>Storage after authorization\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Cardholder data\u003c/td>\u003ctd>\u003ca href=\"#PAN\" data-term=\"PAN\">PAN\u003c/a>, name, expiry, service code\u003c/td>\u003ctd>Allowed if protected and justified\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Sensitive authentication data\u003c/td>\u003ctd>Full track, \u003ca href=\"#CVV\" data-term=\"CVV\">CVV\u003c/a>, PIN\u003c/td>\u003ctd>Not allowed, even if encrypted\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A narrow exception exists for \u003ca href=\"#Issuer\" data-term=\"Issuer\">issuers\u003c/a> and companies supporting issuing services.\u003c/p>\u003cp>The Council writes the standard, but it does not enforce it. Whether an organisation must comply or validate is decided by those running compliance programs.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Party\u003c/th>\u003cth>Role\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>PCI SSC\u003c/td>\u003ctd>Publishes the standard and trains assessors\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Payment brands\u003c/td>\u003ctd>Set compliance programs and any penalties\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Acquirer\" data-term=\"Acquirer\">Acquirers\u003c/a>\u003c/td>\u003ctd>Require their \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchants\u003c/a> to validate\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Qualified Security Assessor\u003c/td>\u003ctd>Independently assesses an organisation\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Merchants and providers\u003c/td>\u003ctd>Implement and maintain the controls\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>PCI DSS is a contractual industry standard and not, in general, a law, although some jurisdictions refer to it. A merchant usually encounters it through an acquirer's request for a \u003ca href=\"#Self-assessment%20questionnaire\" data-term=\"Self-assessment questionnaire\">self-assessment questionnaire\u003c/a> or a formal assessment report.\u003c/p>\u003cp>The practical work is reducing scope, meaning the set of systems the standard covers. Teams do this by not handling card data at all, using \u003ca href=\"#Hosted%20payment%20fields\" data-term=\"Hosted payment fields\">hosted payment fields\u003c/a>, \u003ca href=\"#Tokenization\" data-term=\"Tokenization\">tokenization\u003c/a> or \u003ca href=\"#Point-to-point%20encryption\" data-term=\"Point-to-point encryption\">point-to-point encryption\u003c/a>.\u003c/p>\u003cp>Scope often grows by accident. A log line captures a card number, or a marketing script is added to the payment page. Requirements 6.4.3 and 11.6.1 address that second risk by requiring control and monitoring of payment page scripts.\u003c/p>","avoid":"","usage":["We use a PSP, so PCI doesn't apply to us, right?","It still applies. The PSP shrinks our scope, but we still validate with the right SAQ."],"out":[4,24,26,2,3,1,38,43,39,42]},{"name":"Self-assessment questionnaire","section":3,"description":"A PCI DSS validation form for eligible organisations, with the version chosen by how they handle card data.","body":"\u003cp>A self-assessment questionnaire (SAQ) is a form that eligible organisations use to validate their \u003ca href=\"#PCI%20DSS\" data-term=\"PCI DSS\">PCI DSS\u003c/a> compliance without a full on-site assessment. The right version depends on how the business accepts cards.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>SAQ\u003c/th>\u003cth>Typical \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchant\u003c/a>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>A\u003c/td>\u003ctd>Card-not-present, with all account data functions fully outsourced\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A-EP\u003c/td>\u003ctd>E-commerce where the merchant's site can affect payment page security\u003c/td>\u003c/tr>\u003ctr>\u003ctd>B\u003c/td>\u003ctd>Imprint machines or standalone dial-out terminals\u003c/td>\u003c/tr>\u003ctr>\u003ctd>B-IP\u003c/td>\u003ctd>Standalone approved terminals with an IP connection\u003c/td>\u003c/tr>\u003ctr>\u003ctd>C\u003c/td>\u003ctd>Payment application connected to the internet, no electronic storage\u003c/td>\u003c/tr>\u003ctr>\u003ctd>C-VT\u003c/td>\u003ctd>Manual entry into a third-party virtual terminal on an isolated device\u003c/td>\u003c/tr>\u003ctr>\u003ctd>P2PE\u003c/td>\u003ctd>Only a validated, PCI-listed \u003ca href=\"#Point-to-point%20encryption\" data-term=\"Point-to-point encryption\">point-to-point encryption\u003c/a> solution\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SPoC\u003c/td>\u003ctd>Listed software-based PIN entry solution on a commercial mobile device\u003c/td>\u003c/tr>\u003ctr>\u003ctd>D\u003c/td>\u003ctd>All other eligible merchants, and all eligible service providers\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>An \u003ca href=\"#Acquirer\" data-term=\"Acquirer\">acquirer\u003c/a> or payment brand decides whether a merchant may self-assess or needs an assessor's report.\u003c/p>\u003cp>A common mistake is assuming any hosted checkout qualifies for SAQ A. The v4.0.1 revision of SAQ A removed requirements 6.4.3, 11.6.1 and 12.3.1 from that form and added an eligibility criterion: an e-commerce merchant must confirm its site is not susceptible to attacks from scripts that could affect its systems.\u003c/p>\u003cp>PCI SSC's FAQ 1588 explains that this criterion applies to pages that embed a provider's form, such as through an iframe with \u003ca href=\"#Hosted%20payment%20fields\" data-term=\"Hosted payment fields\">hosted payment fields\u003c/a>. It does not apply to a full redirect to the provider or a fully outsourced flow such as an emailed payment link. A merchant can meet it with protective techniques or a compliant provider's confirmation.\u003c/p>\u003cp>If a developer later adds a custom card form or stores card numbers, the business may no longer qualify, so review eligibility whenever checkout changes.\u003c/p>","avoid":"","usage":["We embed the PSP's iframe, so we just tick SAQ A?","Only if we meet the script-attack criterion. Get the provider's confirmation or put the controls on our page."],"out":[37,1,42,3,43]},{"name":"Tokenization","section":3,"description":"Replacing a card number with a substitute value, so most systems never hold the real account data.","body":"\u003cp>Tokenization replaces a sensitive value, such as a card's \u003ca href=\"#PAN\" data-term=\"PAN\">PAN\u003c/a>, with a substitute called a token. The token can be stored and passed around in place of the card number, and only a controlled system can map it back or use it to make a payment. It is the usual way a \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchant\u003c/a> keeps a customer's card on file without holding the card number.\u003c/p>\u003cp>Tokenization differs from encryption. Encrypted data can be recovered by anyone holding the key, while a token normally has no mathematical relationship to the original and is resolved by lookup in a \u003ca href=\"#Card%20vault\" data-term=\"Card vault\">card vault\u003c/a> or by a token service.\u003c/p>\u003cp>&quot;Token&quot; covers several things in payments, and the differences matter.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Type\u003c/th>\u003cth>Created by\u003c/th>\u003cth>Usable where\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>PSP token\u003c/td>\u003ctd>\u003ca href=\"#Payment%20service%20provider\" data-term=\"Payment service provider\">Payment service provider\u003c/a>\u003c/td>\u003ctd>Usually that provider only\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Network%20token\" data-term=\"Network token\">Network token\u003c/a>\u003c/td>\u003ctd>Network token service\u003c/td>\u003ctd>Across the network, within its domain limits\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Device wallet token\u003c/td>\u003ctd>Network token service, for a wallet\u003c/td>\u003ctd>That device or wallet\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Merchant-internal token\u003c/td>\u003ctd>Merchant's own vault\u003c/td>\u003ctd>That merchant's systems\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The first two are often confused. A team switching providers can discover that its saved PSP tokens do not work elsewhere, and that a card data migration is needed before renewals can continue.\u003c/p>\u003cp>Tokenization reduces \u003ca href=\"#PCI%20DSS\" data-term=\"PCI DSS\">PCI DSS\u003c/a> scope but does not remove it. PCI SSC's tokenization guidance says the tokenization system itself remains part of the cardholder data environment. Systems holding only tokens may fall out of scope if they have no route back to the PAN. A token that can itself initiate a transaction may still need protection because it can be used to spend money.\u003c/p>\u003cp>For that reason, restrict which API keys can charge a token, and treat token stores as sensitive even when they contain no card numbers.\u003c/p>","avoid":"","usage":["We tokenized everything, so a leak of this table is harmless, right?","Not quite. Those tokens can charge customers through our API key, so they still need protecting."],"out":[24,1,41,6,40,37]},{"name":"Network token","section":3,"description":"A card-network-level substitute for a card number, limited to a merchant, device or payment scenario.","body":"\u003cp>A network token is a substitute for a card's \u003ca href=\"#PAN\" data-term=\"PAN\">PAN\u003c/a>, issued through a \u003ca href=\"#Card%20network\" data-term=\"Card network\">card network's\u003c/a> token service and recognised from the point of purchase through the \u003ca href=\"#Acquirer\" data-term=\"Acquirer\">acquirer\u003c/a> and network to the \u003ca href=\"#Issuer\" data-term=\"Issuer\">issuer\u003c/a>. It follows EMVCo's Payment Tokenisation Specification, where it is called an \u003ca href=\"#EMV\" data-term=\"EMV\">EMV\u003c/a> Payment Token. Visa Token Service and Mastercard Digital Enablement Service are two network implementations.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Role\u003c/th>\u003cth>Who\u003c/th>\u003cth>What it does\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Token Requestor\u003c/td>\u003ctd>\u003ca href=\"#Merchant\" data-term=\"Merchant\">Merchant\u003c/a>, wallet or provider\u003c/td>\u003ctd>Registers and requests tokens\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Token Service Provider\u003c/td>\u003ctd>Usually the network\u003c/td>\u003ctd>Creates tokens and maps them to the PAN\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Issuer\u003c/td>\u003ctd>\u003ca href=\"#Cardholder\" data-term=\"Cardholder\">Cardholder\u003c/a>'s institution\u003c/td>\u003ctd>Approves token creation and the payments\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Token User\u003c/td>\u003ctd>Merchant or wallet\u003c/td>\u003ctd>Presents the token for payment\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A token is limited in use, for example to one merchant, one device, or a specific payment scenario, so a stolen token is worth far less than a card number. Depending on the use case, a one-time token cryptogram accompanies the payment to prove it is genuine. EMVCo also defines a Payment Account Reference, which lets systems link different tokens for the same underlying account without exposing the PAN.\u003c/p>\u003cp>The term is most often confused with a PSP \u003ca href=\"#Tokenization\" data-term=\"Tokenization\">token\u003c/a>.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Property\u003c/th>\u003cth>Network token\u003c/th>\u003cth>PSP token\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Issued by\u003c/td>\u003ctd>Token service, usually network\u003c/td>\u003ctd>Payment provider\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Seen by issuer\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>No, the issuer sees the PAN\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Works across providers\u003c/td>\u003ctd>Possible, if set up for it\u003c/td>\u003ctd>Generally no\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Follows card changes\u003c/td>\u003ctd>Can be updated by the issuer\u003c/td>\u003ctd>Depends on the provider\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Because a network token can stay valid when the physical card is reissued, it can reduce failures on \u003ca href=\"#Recurring%20billing\" data-term=\"Recurring billing\">recurring billing\u003c/a> after a card expires. A payment sent without a required cryptogram can still be declined. Code that reads a token's first digits as the card's \u003ca href=\"#BIN\" data-term=\"BIN\">BIN\u003c/a> may also misclassify the card, so ask your provider for the underlying card attributes.\u003c/p>","avoid":"","usage":["Renewals keep failing whenever banks reissue cards.","Turn on network tokens for stored cards. The issuer updates them when the card changes."],"out":[24,4,3,2,27,1,0,39,119,25]},{"name":"Card vault","section":3,"description":"A secured system that stores card numbers and returns tokens so other systems never need to hold the real data.","body":"\u003cp>A card vault is a secured system that stores card numbers and gives other systems a \u003ca href=\"#Tokenization\" data-term=\"Tokenization\">token\u003c/a> to use in their place. When a payment is needed, an authorised service sends the token, and the vault supplies the \u003ca href=\"#PAN\" data-term=\"PAN\">PAN\u003c/a> to the payment connection without exposing it to the rest of the application.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Step\u003c/th>\u003cth>Who\u003c/th>\u003cth>What happens\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Checkout\u003c/td>\u003ctd>Sends card details directly to the vault\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Vault\u003c/td>\u003ctd>Encrypts and stores the PAN, returns a token\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Application\u003c/td>\u003ctd>Stores only the token and display details\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>Payment service\u003c/td>\u003ctd>Requests a charge using the token\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Vault\u003c/td>\u003ctd>Forwards the PAN to the \u003ca href=\"#Acquirer\" data-term=\"Acquirer\">acquirer\u003c/a> or processor\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A vault holds the data that attackers want, so it is firmly in \u003ca href=\"#PCI%20DSS\" data-term=\"PCI DSS\">PCI DSS\u003c/a> scope. It can store the PAN and expiry date, but it must not keep the \u003ca href=\"#CVV\" data-term=\"CVV\">CVV\u003c/a> after \u003ca href=\"#Card%20authorization\" data-term=\"Card authorization\">card authorization\u003c/a>.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Option\u003c/th>\u003cth>Benefit\u003c/th>\u003cth>Cost\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#Payment%20service%20provider\" data-term=\"Payment service provider\">Payment service provider\u003c/a> vault\u003c/td>\u003ctd>Least effort and scope\u003c/td>\u003ctd>Tied to that provider\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Independent third-party vault\u003c/td>\u003ctd>Can route to several PSPs\u003c/td>\u003ctd>Another vendor, some integration work\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Self-hosted vault\u003c/td>\u003ctd>Full control of the data\u003c/td>\u003ctd>Full PCI burden and security operations\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The choice usually becomes visible when a business wants to change provider or add a second one for \u003ca href=\"#Payment%20routing\" data-term=\"Payment routing\">payment routing\u003c/a>. With a provider vault, stored cards cannot be moved by the \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchant\u003c/a>. The old provider must export the data securely to a PCI-compliant recipient, which can take weeks and depends on the contract. Read the export terms before committing.\u003c/p>\u003cp>Migrations carry their own failure risk. Token mappings can be incomplete, and renewals can start declining if \u003ca href=\"#Network%20transaction%20ID\" data-term=\"Network transaction ID\">network transaction IDs\u003c/a> were not transferred with the cards. Run a test batch and compare \u003ca href=\"#Authorization%20rate\" data-term=\"Authorization rate\">authorization rates\u003c/a> before and after.\u003c/p>","avoid":"","usage":["Can we export our saved cards ourselves and upload them to the new provider?","No. The old vault has to transfer them directly to the new one under PCI controls."],"out":[39,24,3,37,26,13,6,113,1,34,115]},{"name":"Point-to-point encryption","section":3,"description":"Encrypting card data at the payment terminal so it stays unreadable until it reaches a secure decryption environment.","body":"\u003cp>Point-to-point encryption (P2PE) encrypts card data inside a secure payment terminal at the moment the card is read, and keeps it encrypted until it reaches a protected decryption environment away from the \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchant\u003c/a>. The shop's network, tills and back-office systems carry only ciphertext they cannot read. It is used with payment terminals, not online checkout.\u003c/p>\u003cp>The term has a general meaning and a specific one under \u003ca href=\"#PCI%20DSS\" data-term=\"PCI DSS\">PCI DSS\u003c/a>. Any vendor can describe its terminal as &quot;encrypted&quot;. PCI P2PE is a separate PCI SSC standard, and only solutions validated against it and listed by the Council carry its compliance benefits.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Feature\u003c/th>\u003cth>Encrypted terminal (g
