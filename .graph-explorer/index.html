udden fall is a common alert, and the cause is not always a provider fault. \u003ca href=\"#Card%20testing\" data-term=\"Card testing\">Card testing\u003c/a> floods checkout with stolen numbers that mostly fail, pulling the rate down while real customers are unaffected. An aggressive retry job has the same effect. A real problem usually concentrates in one place, such as a single issuer, \u003ca href=\"#BIN\" data-term=\"BIN\">BIN\u003c/a> range, country or \u003ca href=\"#Acquirer\" data-term=\"Acquirer\">acquirer\u003c/a>.\u003c/p>\u003cp>Segment the metric by network, issuer, country, card type, channel, acquirer and \u003ca href=\"#Decline%20code\" data-term=\"Decline code\">decline code\u003c/a>. Exclude known bot traffic into a separate view. Common improvements include sending complete data, using \u003ca href=\"#Network%20token\" data-term=\"Network token\">network tokens\u003c/a>, keeping stored cards fresh with an \u003ca href=\"#Account%20updater\" data-term=\"Account updater\">account updater\u003c/a>, flagging stored-credential payments correctly, and using local acquiring. Benchmarks vary widely by industry and region, so compare against your own history first.\u003c/p>","avoid":"","usage":["Authorization rate dropped eight points overnight. Is the acquirer down?","Segment it first. Declines are all from one BIN range with new cards, so it looks like card testing."],"out":[13,2,44,15,55,25,3,29,40,121]},{"name":"Stored credential","section":8,"description":"Card details saved with the cardholder's consent for later payments, flagged under card network rules.","body":"\u003cp>A stored credential is a card number or token that a \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchant\u003c/a> or its provider saves, with the \u003ca href=\"#Cardholder\" data-term=\"Cardholder\">cardholder\u003c/a>'s consent, to use for future payments. Visa and Mastercard define frameworks for these transactions. Under them, the first payment establishes the agreement, and later payments are flagged to show that the credential was stored and how it is being used.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Stage\u003c/th>\u003cth>Who starts it\u003c/th>\u003cth>What must happen\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Consent\u003c/td>\u003ctd>Cardholder\u003c/td>\u003ctd>Agrees to storage and the terms of future use\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Initial transaction\u003c/td>\u003ctd>Cardholder\u003c/td>\u003ctd>Authenticated where required, flagged as first storage\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Later customer payment\u003c/td>\u003ctd>Cardholder\u003c/td>\u003ctd>Sent as a \u003ca href=\"#Customer-initiated%20transaction\" data-term=\"Customer-initiated transaction\">customer-initiated transaction\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Later merchant payment\u003c/td>\u003ctd>Merchant\u003c/td>\u003ctd>Sent as a \u003ca href=\"#Merchant-initiated%20transaction\" data-term=\"Merchant-initiated transaction\">merchant-initiated transaction\u003c/a> with the original reference\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The original reference is usually the \u003ca href=\"#Network%20transaction%20ID\" data-term=\"Network transaction ID\">network transaction ID\u003c/a> returned by the first authorization. Keep it with the saved credential, because later merchant-initiated payments must reference it.\u003c/p>\u003cp>Stored credentials are often confused with \u003ca href=\"#Tokenization\" data-term=\"Tokenization\">tokenization\u003c/a>. Tokenization is how the card number is protected, by replacing it with a substitute value. A stored credential describes the business arrangement and its transaction flags. Saving a token does not by itself create the consent or the correct flags.\u003c/p>\u003cp>The failure is often silent. A team saves cards and charges them later as if each were a normal online payment, with no stored-credential flag and no original ID. \u003ca href=\"#Issuer\" data-term=\"Issuer\">Issuers\u003c/a> see an unexpected transaction with no \u003ca href=\"#CVV\" data-term=\"CVV\">CVV\u003c/a> and decline more of them, and European issuers may demand \u003ca href=\"#Strong%20customer%20authentication\" data-term=\"Strong customer authentication\">strong customer authentication\u003c/a> that the absent customer cannot complete. Renewals fail while first payments look healthy.\u003c/p>\u003cp>Record the consent text and time, the agreed purpose, the initial transaction ID and the credential's status. Do not store the CVV after authorization, which \u003ca href=\"#PCI%20DSS\" data-term=\"PCI DSS\">PCI DSS\u003c/a> prohibits. If a customer removes a saved card, stop using it.\u003c/p>","avoid":"","usage":["First payments work, but renewals decline far more often.","We're not sending the stored credential flags or the original transaction ID. Issuers can't tell these are agreed renewals."],"out":[1,0,117,118,34,39,2,26,45,37]},{"name":"Customer-initiated transaction","section":8,"description":"A card payment the cardholder actively starts and takes part in, even when using a saved card.","body":"\u003cp>A customer-initiated transaction, or CIT, is a card payment in which the \u003ca href=\"#Cardholder\" data-term=\"Cardholder\">cardholder\u003c/a> is present in the flow and actively takes part, for example by pressing Pay on a website or in an app. Visa calls these cardholder-initiated transactions. The card can be newly entered or saved. What makes it a CIT is the customer's involvement at that moment.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Question\u003c/th>\u003cth>CIT\u003c/th>\u003cth>\u003ca href=\"#Merchant-initiated%20transaction\" data-term=\"Merchant-initiated transaction\">Merchant-initiated transaction\u003c/a>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Who starts it?\u003c/td>\u003ctd>Cardholder\u003c/td>\u003ctd>\u003ca href=\"#Merchant\" data-term=\"Merchant\">Merchant\u003c/a>, under a prior agreement\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Is the customer in session?\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>No\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Can they complete a challenge?\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>No\u003c/td>\u003c/tr>\u003ctr>\u003ctd>EEA and UK authentication\u003c/td>\u003ctd>\u003ca href=\"#Strong%20customer%20authentication\" data-term=\"Strong customer authentication\">Strong customer authentication\u003c/a> unless exempt\u003c/td>\u003ctd>Generally outside it when set up correctly\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The most common confusion is treating any saved-card payment as merchant-initiated. A returning customer who clicks Buy using a saved card is still making a CIT. In the EEA and UK, that payment falls under strong customer authentication unless an \u003ca href=\"#SCA%20exemption\" data-term=\"SCA exemption\">SCA exemption\u003c/a> applies, and the European Banking Authority has said that card payments initiated by the payer through the payee are in scope.\u003c/p>\u003cp>A CIT also normally sets up a \u003ca href=\"#Stored%20credential\" data-term=\"Stored credential\">stored credential\u003c/a>. The first payment carries the authentication and consent, and its \u003ca href=\"#Network%20transaction%20ID\" data-term=\"Network transaction ID\">network transaction ID\u003c/a> anchors later merchant-initiated payments.\u003c/p>\u003cp>The failure appears when an engineer marks one-click checkout as merchant-initiated to avoid the extra authentication step. \u003ca href=\"#Issuer\" data-term=\"Issuer\">Issuers\u003c/a> can decline these payments, networks can treat the flag as misuse, and the merchant may lose \u003ca href=\"#3-D%20Secure\" data-term=\"3-D Secure\">3-D Secure\u003c/a> liability protection. The reverse error also occurs, when an off-session renewal is sent as a CIT and fails because nobody is there to complete a challenge.\u003c/p>\u003cp>Set the initiator from what the user is doing in that request, rather than from whether a card is saved.\u003c/p>","avoid":"","usage":["Can we flag one-click purchases as MIT to skip 3-D Secure?","No. The customer clicked Buy, so it's a customer-initiated transaction and needs SCA unless an exemption applies."],"out":[0,118,1,45,46,116,34,2,44]},{"name":"Merchant-initiated transaction","section":8,"description":"A payment the merchant starts without the cardholder present, under an agreement made in an earlier transaction.","body":"\u003cp>A merchant-initiated transaction, or MIT, is a card payment that a merchant starts without the \u003ca href=\"#Cardholder\" data-term=\"Cardholder\">cardholder\u003c/a> taking part, relying on an agreement made earlier. The merchant must have a \u003ca href=\"#Stored%20credential\" data-term=\"Stored credential\">stored credential\u003c/a> and consent to use it, and each MIT is flagged so the \u003ca href=\"#Issuer\" data-term=\"Issuer\">issuer\u003c/a> can see it belongs to an existing agreement.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Type\u003c/th>\u003cth>Example\u003c/th>\u003cth>Schedule\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Recurring\u003c/td>\u003ctd>Monthly software subscription\u003c/td>\u003ctd>Fixed interval\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Instalment\u003c/td>\u003ctd>A purchase split into set payments\u003c/td>\u003ctd>Fixed number of payments\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Unscheduled\u003c/td>\u003ctd>Account top-up when balance runs low\u003c/td>\u003ctd>Triggered by an event\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Industry-specific\u003c/td>\u003ctd>Hotel no-show or delayed charge\u003c/td>\u003ctd>Set by network rules\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Each MIT normally carries the \u003ca href=\"#Network%20transaction%20ID\" data-term=\"Network transaction ID\">network transaction ID\u003c/a> of the original or a previous transaction. This links it to the \u003ca href=\"#Customer-initiated%20transaction\" data-term=\"Customer-initiated transaction\">customer-initiated transaction\u003c/a> in which the cardholder agreed. Without that link, an issuer may treat the payment as unexpected and decline it.\u003c/p>\u003cp>In the EEA and UK, an MIT is treated as outside \u003ca href=\"#Strong%20customer%20authentication\" data-term=\"Strong customer authentication\">strong customer authentication\u003c/a> because the payer is not involved at the time of payment. That position depends on a valid setup. European Banking Authority Q&amp;As say SCA applies when the mandate is given, usually during the first payment. An MIT is not an \u003ca href=\"#SCA%20exemption\" data-term=\"SCA exemption\">SCA exemption\u003c/a>, and labelling a payment MIT when the customer is present is misuse.\u003c/p>\u003cp>The failure teams see is a batch of renewals declined with an authentication-required code. Cards saved before SCA, or saved without authentication, have no valid agreement behind them. The customer is offline and cannot complete a challenge, so the fix is to bring them back for an authenticated payment that creates a new agreement.\u003c/p>\u003cp>A customer who forgot about a subscription may dispute it as fraud, so keep the consent record and stop billing as soon as they cancel.\u003c/p>","avoid":"","usage":["Half the renewal batch failed with authentication required.","Those cards were saved without SCA, so the merchant-initiated transactions have no valid mandate. Email customers to reauthenticate."],"out":[0,116,2,34,117,45,46]},{"name":"Recurring billing","section":8,"description":"Charging a customer automatically on a schedule, using a saved card, bank mandate or local recurring rail.","body":"\u003cp>Recurring billing is the process of charging a customer automatically at regular intervals, such as monthly for a subscription. A billing system determines what is due and creates a payment on an underlying method, which sets the rules for authentication, notice and failure.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Method\u003c/th>\u003cth>Permission\u003c/th>\u003cth>Typical failure signal\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Card\u003c/td>\u003ctd>\u003ca href=\"#Stored%20credential\" data-term=\"Stored credential\">Stored credential\u003c/a>, charged as a \u003ca href=\"#Merchant-initiated%20transaction\" data-term=\"Merchant-initiated transaction\">merchant-initiated transaction\u003c/a>\u003c/td>\u003ctd>Immediate decline\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#SEPA%20Direct%20Debit\" data-term=\"SEPA Direct Debit\">SEPA Direct Debit\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"#Direct%20debit%20mandate\" data-term=\"Direct debit mandate\">Direct debit mandate\u003c/a>\u003c/td>\u003ctd>Later return or refund\u003c/td>\u003c/tr>\u003ctr>\u003ctd>US \u003ca href=\"#ACH\" data-term=\"ACH\">ACH\u003c/a> debit\u003c/td>\u003ctd>Authorization under Nacha rules\u003c/td>\u003ctd>Later \u003ca href=\"#Payment%20return\" data-term=\"Payment return\">payment return\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#UPI\" data-term=\"UPI\">UPI\u003c/a> AutoPay (India)\u003c/td>\u003ctd>Registered e-mandate\u003c/td>\u003ctd>Mandate or debit failure\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Pix\" data-term=\"Pix\">Pix\u003c/a> Automático (Brazil)\u003c/td>\u003ctd>Prior payer authorization\u003c/td>\u003ctd>Scheduled payment failure\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Rules differ by market. India's E-mandate Framework, 2026, from the Reserve Bank of India, generally requires a notification before each recurring debit on cards, prepaid instruments and UPI, and additional authentication above set amounts. Consumer rules on renewal notices and cancellation also vary by market.\u003c/p>\u003cp>Recurring billing differs from a saved card used for one-click checkout, where the customer starts each payment. It also differs from \u003ca href=\"#Dunning\" data-term=\"Dunning\">dunning\u003c/a>, which handles what happens after a recurring payment fails.\u003c/p>\u003cp>A scheduler rerun after a crash can bill the same period twice. To prevent this, use an idempotency key (a unique value marking one logical charge) built from the subscription ID and billing period, and enforce it with a unique constraint. Date arithmetic also causes errors: adding one month to 31 January has no obvious answer, so store a fixed billing anchor day and clamp it to the month's length. Mid-cycle plan changes need explicit proration rules, using integer \u003ca href=\"#Minor%20unit\" data-term=\"Minor unit\">minor units\u003c/a> and a defined rounding direction.\u003c/p>\u003cp>Expired cards are the main cause of unintended cancellation. An \u003ca href=\"#Account%20updater\" data-term=\"Account updater\">account updater\u003c/a> reduces these, and dunning recovers some of the remainder.\u003c/p>","avoid":"","usage":["Some customers were billed twice on the first of the month.","The recurring billing job restarted mid-run. Key each charge on subscription and period so a rerun can't duplicate it."],"out":[116,118,80,91,77,92,97,98,120,76,121]},{"name":"Dunning","section":8,"description":"The process of recovering failed recurring payments through scheduled retries and customer reminders.","body":"\u003cp>Dunning is the process of recovering a failed recurring payment through scheduled retries and messages to the customer. In subscription businesses, it mainly addresses involuntary churn, where a customer who intended to stay loses service because a payment failed.\u003c/p>\u003cp>A dunning policy combines payment actions and communication:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Stage\u003c/th>\u003cth>Action\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Payment fails. Classify the decline and record the reason\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Run an \u003ca href=\"#Account%20updater\" data-term=\"Account updater\">account updater\u003c/a> check if the card may have changed\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Notify the customer with a link to update payment details\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>Retry \u003ca href=\"#Soft%20decline\" data-term=\"Soft decline\">soft declines\u003c/a> on a spaced schedule\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Send further reminders and warn of service loss\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>Restrict or cancel the subscription, and stop retrying\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Dunning differs from a \u003ca href=\"#Payment%20retry\" data-term=\"Payment retry\">payment retry\u003c/a>. A retry is one technical attempt, and dunning is the business process that decides when to retry, what to tell the customer, and when to give up. The retry schedule must respect the rail: a \u003ca href=\"#Hard%20decline\" data-term=\"Hard decline\">hard decline\u003c/a> should not be repeated, \u003ca href=\"#Card%20network\" data-term=\"Card network\">card networks\u003c/a> limit reattempts, and Nacha restricts how a returned \u003ca href=\"#ACH\" data-term=\"ACH\">ACH\u003c/a> debit can be reinitiated. Reminder content and timing may also be subject to local consumer and debt-collection rules, particularly once an amount is treated as overdue.\u003c/p>\u003cp>Dunning systems fail through missing state. A customer updates their card, but the job keeps retrying the old one and sends another warning. A customer cancels, and a scheduled retry charges them anyway, producing a complaint or a \u003ca href=\"#Chargeback\" data-term=\"Chargeback\">chargeback\u003c/a>.\u003c/p>\u003cp>Before each step, re-read the subscription, invoice and payment method, and exit if the invoice is paid or the subscription is cancelled. When a customer adds a new card, attempt the outstanding invoice once, then end the sequence on success. Track recovered revenue and recovery rate per stage to tune the schedule.\u003c/p>","avoid":"","usage":["A customer cancelled last week and we charged them again today.","The dunning job didn't recheck the subscription before retrying. Exit the sequence on cancel and \u003ca href=\"#Refund\" data-term=\"Refund\">refund\u003c/a> that charge."],"out":[121,30,108,31,4,77,60,20]},{"name":"Account updater","section":8,"description":"A card network service that gives merchants updated card numbers and expiry dates for stored cards.","body":"\u003cp>An account updater is a \u003ca href=\"#Card%20network\" data-term=\"Card network\">card network\u003c/a> service that gives \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchants\u003c/a> new details for cards they have on file when a card is reissued, expires or is closed. Visa Account Updater and Mastercard Automatic Billing Updater are the main examples. \u003ca href=\"#Issuer\" data-term=\"Issuer\">Issuers\u003c/a> report changes to the network, and the merchant's \u003ca href=\"#Acquirer\" data-term=\"Acquirer\">acquirer\u003c/a> or provider requests updates, either in batches before billing or in real time during authorization.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Response\u003c/th>\u003cth>Meaning\u003c/th>\u003cth>Merchant action\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>New card number\u003c/td>\u003ctd>Card was replaced\u003c/td>\u003ctd>Update the \u003ca href=\"#Stored%20credential\" data-term=\"Stored credential\">stored credential\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>New expiry\u003c/td>\u003ctd>Same number, new date\u003c/td>\u003ctd>Update the expiry\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Account closed\u003c/td>\u003ctd>Card is no longer valid\u003c/td>\u003ctd>Stop billing and ask for a new method\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Contact \u003ca href=\"#Cardholder\" data-term=\"Cardholder\">cardholder\u003c/a>\u003c/td>\u003ctd>Issuer gives no replacement\u003c/td>\u003ctd>Ask the customer\u003c/td>\u003c/tr>\u003ctr>\u003ctd>No match\u003c/td>\u003ctd>Issuer has no change or doesn't participate\u003c/td>\u003ctd>Continue, and handle any decline\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Coverage depends on issuer participation, and some cardholders can opt out, so a stored card may still fail.\u003c/p>\u003cp>An account updater differs from a \u003ca href=\"#Network%20token\" data-term=\"Network token\">network token\u003c/a>. A token is a substitute credential whose lifecycle is managed by the network, so the merchant can keep charging the same token after the underlying card is replaced. Account updater returns new card data to whoever holds the original \u003ca href=\"#PAN\" data-term=\"PAN\">PAN\u003c/a>. \u003ca href=\"#Dunning\" data-term=\"Dunning\">Dunning\u003c/a>, by contrast, reacts after a payment fails.\u003c/p>\u003cp>The symptom it addresses is a burst of renewal declines around month end from expired cards, with customers who never meant to leave. A related bug happens when the provider updates its vault but the merchant's own record keeps the old last four digits and expiry, so the billing page shows an expired card.\u003c/p>\u003cp>Consume the provider's update events and sync display fields. Also stop charging on a closed-account response. Updated card numbers are cardholder data, so handle them within your \u003ca href=\"#PCI%20DSS\" data-term=\"PCI DSS\">PCI DSS\u003c/a> scope, or leave them with the provider.\u003c/p>","avoid":"","usage":["Renewals are failing because so many cards expired this month.","Turn on the account updater with our acquirer, and sync the new expiry dates to our billing records."],"out":[4,1,2,3,116,0,40,24,120,37]},{"name":"Split payment","section":8,"description":"One customer payment divided among several parties, such as a marketplace, its sellers and fee recipients.","body":"\u003cp>A split payment is a single customer payment whose funds are divided among several recipients, such as a marketplace, one or more sellers and a delivery partner. The customer sees one charge.\u003c/p>\u003cp>This example uses \u003ca href=\"#Minor%20unit\" data-term=\"Minor unit\">minor units\u003c/a> for a 10000 order:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Account\u003c/th>\u003cth>Debit\u003c/th>\u003cth>Credit\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Provider receivable\u003c/td>\u003ctd>9700\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Processing fees\u003c/td>\u003ctd>300\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Seller payable\u003c/td>\u003ctd>\u003c/td>\u003ctd>8500\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Platform commission\u003c/td>\u003ctd>\u003c/td>\u003ctd>1500\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Total\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>10000\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>10000\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The platform absorbs the processing fee here, so its net income from this order is 1200.\u003c/p>\u003cp>A split payment differs from split tender, where one customer pays a single bill using two cards or methods.\u003c/p>\u003cp>Regulation is a central design issue. Receiving money and passing it to third parties can count as a regulated payment service or money transmission, depending on the country. Platforms commonly use a licensed provider's marketplace product, or act as a \u003ca href=\"#Payment%20facilitator\" data-term=\"Payment facilitator\">payment facilitator\u003c/a> or a \u003ca href=\"#Merchant%20of%20record\" data-term=\"Merchant of record\">merchant of record\u003c/a>. Get legal advice on the chosen structure, and expect \u003ca href=\"#KYC\" data-term=\"KYC\">KYC\u003c/a> or \u003ca href=\"#KYB\" data-term=\"KYB\">KYB\u003c/a> checks on sellers.\u003c/p>\u003cp>The hard failures occur after the split. A customer gets a \u003ca href=\"#Refund\" data-term=\"Refund\">refund\u003c/a> or wins a \u003ca href=\"#Chargeback\" data-term=\"Chargeback\">chargeback\u003c/a> after the seller has already received a \u003ca href=\"#Payout\" data-term=\"Payout\">payout\u003c/a>. The platform must recover the money from that seller, and if the seller has no balance or has left, the platform carries the loss. Delay seller payouts according to risk, and let seller balances go negative in the \u003ca href=\"#Ledger\" data-term=\"Ledger\">ledger\u003c/a> so future earnings can offset them.\u003c/p>\u003cp>Rounding is the other common bug. Splitting 10000 three ways gives 3333 each and leaves 1 unit unallocated. Use integer minor units, assign any remainder by a fixed rule, and assert that the parts sum to the total. Record the split at payment time so that later commission changes do not alter past orders.\u003c/p>","avoid":"","usage":["The seller was paid out, then the buyer got a chargeback. Who covers it?","Under our split payment terms, the seller. Post it against their balance, and we carry it if they can't repay."],"out":[76,9,10,49,50,20,60,23,109]},{"name":"Safeguarding","section":8,"description":"Rules requiring non-bank payment and e-money firms to protect customer funds so they can be returned if the firm fails.","body":"\u003cp>Safeguarding is the legal requirement for non-bank payment firms and e-money issuers to protect customer money so that it can be returned if the firm becomes insolvent. In the EU, the requirement comes from \u003ca href=\"#PSD2\" data-term=\"PSD2\">PSD2\u003c/a> and the Electronic Money Directive. In the UK, it comes from the Payment Services Regulations 2017 and Electronic Money Regulations 2011, supplemented by Financial Conduct Authority (FCA) rules.\u003c/p>\u003cp>Firms typically safeguard in one of two ways:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Method\u003c/th>\u003cth>How it works\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Segregation\u003c/td>\u003ctd>Keep relevant funds apart from the firm's own money, in a designated account or approved secure assets\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Insurance or guarantee\u003c/td>\u003ctd>A policy or guarantee pays out an equivalent amount if the firm fails\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Safeguarding is often confused with deposit insurance. A bank deposit may be covered by a national scheme, such as the UK's Financial Services Compensation Scheme. Money held with a payment or e-money firm generally is not. If the firm fails, customers rely on the safeguarded pool, and the insolvency process can cause delay or shortfall. A \u003ca href=\"#Rolling%20reserve\" data-term=\"Rolling reserve\">rolling reserve\u003c/a> is also different, because it protects a provider from a \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchant\u003c/a>'s losses.\u003c/p>\u003cp>The FCA's Policy Statement PS25/12 introduced a supplementary safeguarding regime that took effect on 7 May 2026, adding requirements such as monthly regulatory returns and, for many firms, annual safeguarding audits. US money transmitters are instead generally subject to state rules on permissible investments. Confirm the rules that apply to your licence with a qualified adviser.\u003c/p>\u003cp>The firm must know how much it owes customers at any time and prove that the safeguarded balance covers it, which requires an accurate \u003ca href=\"#Ledger\" data-term=\"Ledger\">ledger\u003c/a> and regular \u003ca href=\"#Payment%20reconciliation\" data-term=\"Payment reconciliation\">payment reconciliation\u003c/a> against the safeguarding account. Failures include customer funds sitting in an operating account during a \u003ca href=\"#Payout\" data-term=\"Payout\">payout\u003c/a> delay and shortfalls discovered days late. Alert on any difference.\u003c/p>","avoid":"","usage":["Can we pay this supplier from the customer funds account until Friday?","No, that account is for safeguarding. Customer money can't fund operations, even temporarily."],"out":[48,72,1,109,111,23]}]}
    </script>
    <script>
      (() => {
        const data = JSON.parse(
          document.getElementById("graph-data").textContent
        );
        const $ = (id) => document.getElementById(id);
        const stage = $("stage");
        const panel = $("panel");
        const panelBody = $("panel-body");
        const resizer = $("resizer");
        const search = $("search");
        const input = $("search-input");
        const results = $("results");
        const info = $("info");
        const infoBtn = $("info-btn");
        const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");

        const INK = "#1c1c1a";
        const BG = "#ededE9";
        // Hubs keep their label even when it crosses another circle.
        const HUB_WEIGHT = 0.7;
        const esc = (s) =>
          s.replace(
            /[&<>"]/g,
            (c) =>
              ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]
          );
        const hashFor = (name) => "#" + encodeURIComponent(name);

        const nodes = data.terms.map((term, i) => ({
          ...term,
          id: i,
          incoming: [],
        }));
        const links = [];
        const linkKeys = new Set();
        nodes.forEach((n) =>
          n.out.forEach((t) => {
            nodes[t].incoming.push(n.id);
            links.push({ source: n.id, target: t, from: n.id, to: t });
            linkKeys.add(n.id + ">" + t);
          })
        );
        // A two-way pair is drawn as one line; both directions keep their particles.
        links.forEach((l) => {
          l.hiddenTwin = l.from > l.to && linkKeys.has(l.to + ">" + l.from);
        });

        const maxIncoming = Math.max(...nodes.map((n) => n.incoming.length), 1);
        const sectionCount = data.sections.length;
        const stageBox = stage.getBoundingClientRect();
        const landscape = stageBox.width >= stageBox.height;
        const anchorRadiusX = landscape ? 360 : 170;
        const anchorRadiusY = landscape ? 190 : 320;
        nodes.forEach((n, i) => {
          const weight = Math.sqrt(n.incoming.length / maxIncoming);
          const shade = Math.round(214 - weight * 158);
          n.weight = weight;
          n.r = 4 + Math.sqrt(n.incoming.length) * 2.9;
          n.fill = `rgb(${shade},${shade},${shade - 3})`;
          n.neighbors = new Set([n.id, ...n.out, ...n.incoming]);
          const angle = (n.section / sectionCount) * Math.PI * 2;
          n.anchorX = sectionCount > 1 ? Math.cos(angle) * anchorRadiusX : 0;
          n.anchorY = sectionCount > 1 ? Math.sin(angle) * anchorRadiusY : 0;
          n.x = n.anchorX + Math.cos(i * 2.4) * (30 + i);
          n.y = n.anchorY + Math.sin(i * 2.4) * (30 + i);
        });
        const byName = new Map(nodes.map((n) => [n.name, n]));

        let selected = null;
        let hovered = null;
        let userMoved = false;
        let pauseTimer = 0;
        let particleFocus = null;
        // The selected term keeps the highlight; hovering only adds to it.
        const focusNode = () => selected || hovered;
        const isVisible = (n, f) =>
          !f || f.neighbors.has(n.id) || n === hovered;
        const endpoint = (v) => (typeof v === "object" ? v.id : v);
        const isFocusLink = (l) => {
          const f = focusNode();
          return (
            !!f && (endpoint(l.source) === f.id || endpoint(l.target) === f.id)
          );
        };

        function collideForce() {
          let all = [];
          const force = () => {
            for (let i = 0; i < all.length; i++) {
              for (let j = i + 1; j < all.length; j++) {
                const a = all[i],
                  b = all[j];
                const dx = b.x - a.x || 0.01,
                  dy = b.y - a.y || 0.01;
                const d = Math.hypot(dx, dy);
                const min = a.r + b.r + 9;
                if (d >= min) continue;
                const push = ((min - d) / d) * 0.5;
                b.x += dx * push;
                b.y += dy * push;
                a.x -= dx * push;
                a.y -= dy * push;
              }
            }
          };
          force.initialize = (n) => {
            all = n;
          };
          return force;
        }

        function sectionForce() {
          let all = [];
          const force = (alpha) =>
            all.forEach((n) => {
              n.vx += (n.anchorX - n.x) * 0.035 * alpha;
              n.vy += (n.anchorY - n.y) * 0.035 * alpha;
            });
          force.initialize = (n) => {
            all = n;
          };
          return force;
        }

        function drawNode(n, ctx, k) {
          const near = isVisible(n, focusNode());
          ctx.beginPath();
          ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
          if (!near) {
            // An opaque base stops lines showing through dimmed circles.
            ctx.fillStyle = BG;
            ctx.fill();
          }
          ctx.globalAlpha = near ? 1 : 0.15;
          ctx.fillStyle = n.fill;
          ctx.fill();
          ctx.globalAlpha = 1;
          if (n === selected) {
            ctx.beginPath();
            ctx.arc(n.x, n.y, n.r + 3.2 / Math.max(k, 0.6), 0, Math.PI * 2);
            ctx.strokeStyle = INK;
            ctx.lineWidth = 1.4 / k;
            ctx.stroke();
          }
        }

        function drawLabels(ctx, k) {
          const f = focusNode();
          const rank = (n) =>
            (n === hovered
              ? 4
              : n === f
                ? 3
                : f && f.neighbors.has(n.id)
                  ? 2
                  : 0) + n.weight;
          const placed = [];
          const order = nodes
            .filter((n) => isVisible(n, f))
            .sort((a, b) => rank(b) - rank(a));
          const hitsCircle = (box, self) =>
            order.some((m) => {
              if (m === self) return false;
              const cx = Math.max(box.l, Math.min(m.x, box.r));
              const cy = Math.max(box.t, Math.min(m.y, box.b));
              return Math.hypot(m.x - cx, m.y - cy) < m.r;
            });
          ctx.textAlign = "center";
          ctx.textBaseline = "bottom";
          ctx.lineJoin = "round";
          for (const n of order) {
            const pinned = n === f || n === hovered;
            const px = n === f ? 15 : n === hovered ? 13 : 8.5 + n.weight * 5.5;
            const size = px / k;
            ctx.font = `${size}px ui-monospace, "SF Mono", Menlo, Consolas, monospace`;
            if ("letterSpacing" in ctx) ctx.letterSpacing = `${size * 0.06}px`;
            const text = n.name.toUpperCase();
            const w = ctx.measureText(text).width;
            const y = n.y - n.r - 5 / k;
            const box = {
              l: n.x - w / 2 - 3 / k,
              r: n.x + w / 2 + 3 / k,
              t: y - size - 1 / k,
              b: y + 1 / k,
            };
            if (
              !pinned &&
              ((n.weight < HUB_WEIGHT && hitsCircle(box, n)) ||
                placed.some(
                  (p) =>
                    box.l < p.r && box.r > p.l && box.t < p.b && box.b > p.t
                ))
            )
              continue;
            placed.push(box);
            ctx.globalAlpha = 0.9;
            ctx.strokeStyle = BG;
            ctx.lineWidth = 3.5 / k;
            ctx.strokeText(text, n.x, y);
            ctx.globalAlpha = pinned ? 1 : f ? 0.82 : 0.38 + n.weight * 0.55;
            ctx.fillStyle = INK;
            ctx.fillText(text, n.x, y);
          }
          ctx.globalAlpha = 1;
          if ("letterSpacing" in ctx) ctx.letterSpacing = "0px";
        }

        const graph = new ForceGraph($("graph"))
          .backgroundColor("rgba(0,0,0,0)")
          .nodeId("id")
          .nodeLabel(() => "")
          .nodeCanvasObject(drawNode)
          .nodePointerAreaPaint((n, color, ctx) => {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(n.x, n.y, n.r + 2, 0, Math.PI * 2);
            ctx.fill();
          })
          .linkColor((l) => {
            if (l.hiddenTwin) return "rgba(0,0,0,0)";
            if (!focusNode()) return "rgba(28,28,26,.09)";
            return isFocusLink(l) ? "rgba(28,28,26,.5)" : "rgba(28,28,26,.025)";
          })
          .linkWidth((l) => (isFocusLink(l) ? 0.9 : 0.5))
          .linkDirectionalParticles((l) =>
            !reducedMotion.matches && isFocusLink(l) ? 2 : 0
          )
          .linkDirectionalParticleWidth(2.2)
          .linkDirectionalParticleSpeed(0.005)
          .linkDirectionalParticleColor(() => INK)
          .minZoom(0.25)
          .maxZoom(6)
          .warmupTicks(280)
          .cooldownTicks(70)
          .onRenderFramePost(drawLabels)
          .onNodeClick((n) => go(n.name))
          .onBackgroundClick(() => go(null))
          .onNodeHover((n) => {
            hovered = n || null;
            wake();
          })
          .onNodeDragEnd((n) => {
            n.fx = undefined;
            n.fy = undefined;
          })
          .onZoom((t) => {
            if (t && programmaticUntil < performance.now()) userMoved = true;
          });

        graph.d3Force("charge").strength(-340).distanceMax(760);
        graph
          .d3Force("link")
          .distance((l) => 46 + l.source.r + l.target.r)
          .strength(
            (l) =>
              0.55 / Math.min(l.source.neighbors.size, l.target.neighbors.size)
          );
        graph.d3Force("collide", collideForce());
        graph.d3Force("section", sectionForce());
        graph.graphData({ nodes, links });

        let programmaticUntil = 0;
        const camera = (ms) => {
          programmaticUntil = performance.now() + ms + 80;
        };

        function fitAll(ms = 0) {
          camera(ms);
          graph.zoomToFit(ms, 54);
        }

        function focusCamera(ms = 650) {
          if (!selected) return;
          const box = stage.getBoundingClientRect();
          let reach = selected.r;
          selected.neighbors.forEach((id) => {
            const m = nodes[id];
            reach = Math.max(
              reach,
              Math.hypot(m.x - selected.x, m.y - selected.y) + m.r
            );
          });
          const k = Math.min(
            2.2,
            Math.max(0.5, (Math.min(box.width, box.height) / 2 - 40) / reach)
          );
          camera(ms);
          graph.centerAt(selected.x, selected.y, ms);
          graph.zoom(k, ms);
        }

        function wake() {
          const f = focusNode();
          if (f !== particleFocus) {
            particleFocus = f;
            // force-graph only rebuilds particles when this prop is set.
            graph.linkDirectionalParticles((l) =>
              !reducedMotion.matches && isFocusLink(l) ? 2 : 0
            );
          }
          graph.autoPauseRedraw(false);
          clearTimeout(pauseTimer);
          if (!focusNode() || reducedMotion.matches) {
            pauseTimer = setTimeout(() => graph.autoPauseRedraw(true), 160);
          }
        }

        function renderPanel(n) {
          const chip = (id) =>
            `<a class="chip" href="${hashFor(nodes[id].name)}" data-term="${esc(nodes[id].name)}">${esc(nodes[id].name)}</a>`;
          const linkedFrom = n.incoming.filter((id) => !n.out.includes(id));
          panelBody.innerHTML = `
            <div class="eyebrow">${esc(data.sections[n.section])}</div>
            <h1 tabindex="-1">${esc(n.name)}</h1>
            ${n.description ? `<p class="lede">${esc(n.description)}</p>` : ""}
            ${n.usage.length ? `<section class="block"><span class="label">${esc(data.labels.quotes)}</span>
              <div class="bubbles">${n.usage.map((u) => `<div class="bubble">${u}</div>`).join("")}</div>
            </section>` : ""}
            ${n.avoid ? `<section class="block"><span class="label">${esc(data.labels.note)}</span><p class="avoid">${n.avoid}</p></section>` : ""}
            ${n.out.length ? `<section class="block"><span class="label">${esc(data.labels.outgoing)}</span><div class="chips">${n.out.map(chip).join("")}</div></section>` : ""}
            ${linkedFrom.length ? `<section class="block"><span class="label">${esc(data.labels.incoming)}</span><div class="chips">${linkedFrom.map(chip).join("")}</div></section>` : ""}
            ${n.body ? `<section class="block"><details><summary><span class="label">${esc(data.labels.body)}</span></summary><div class="entry">${n.body}</div></details></section>` : ""}`;
          panel.scrollTop = 0;
        }

        function applyHash({ moveFocus = false } = {}) {
          let name = "";
          try {
            name = decodeURIComponent(location.hash.slice(1));
          } catch {
            name = "";
          }
          selected = byName.get(name) || null;
          hovered = null;
          $("hint").hidden = !!selected;
          document.body.classList.toggle("has-selection", !!selected);
          document.title = selected
            ? `${selected.name} — ${data.title}`
            : `${data.title} — Graph`;
          if (selected) {
            renderPanel(selected);
            panel.hidden = false;
            if (moveFocus)
              panelBody.querySelector("h1").focus({ preventScroll: true });
          } else {
            panel.hidden = true;
          }
          resizer.hidden = !selected;
          syncResizer();
          resize();
          if (selected) focusCamera();
          else if (graphReady) {
            userMoved = false;
            fitAll(600);
          }
          wake();
        }

        function go(name) {
          closePopovers();
          const next = name ? hashFor(name) : "";
          if (location.hash === next) {
            if (name) focusCamera();
            return;
          }
          location.hash = next;
        }

        function resize() {
          const box = stage.getBoundingClientRect();
          graph.width(Math.round(box.width)).height(Math.round(box.height));
        }

        const PANEL_MIN = 300;
        const STAGE_MIN = 320;
        const PANEL_WIDTH_KEY = `graph-explorer:${data.title}:panel-width`;
        let preferredWidth = readPanelWidth();
        let resizing = false;
        let grabOffset = 0;

        function readPanelWidth() {
          try {
            const value = Number(localStorage.getItem(PANEL_WIDTH_KEY));
            return Number.isFinite(value) && value > 0 ? value : null;
          } catch {
            return null;
          }
        }

        function savePanelWidth() {
          try {
            if (preferredWidth === null)
              localStorage.removeItem(PANEL_WIDTH_KEY);
            else localStorage.setItem(PANEL_WIDTH_KEY, String(preferredWidth));
          } catch {
            // Storage can be unavailable; the width still applies this visit.
          }
        }

        const maxPanelWidth = () => Math.max(PANEL_MIN, innerWidth - STAGE_MIN);
        const clampPanelWidth = (width) =>
          Math.round(Math.min(maxPanelWidth(), Math.max(PANEL_MIN, width)));

        function syncResizer() {
          resizer.setAttribute("aria-valuemin", String(PANEL_MIN));
          resizer.setAttribute("aria-valuemax", String(maxPanelWidth()));
          if (!panel.hidden) {
            resizer.setAttribute(
              "aria-valuenow",
              String(Math.round(panel.getBoundingClientRect().width))
            );
          }
        }

        // The saved width is kept as-is so it returns when the window grows.
        function applyPanelWidth() {
          const root = document.documentElement;
          if (preferredWidth === null)
            root.style.removeProperty("--panel-width");
          else
            root.style.setProperty(
              "--panel-width",
              `${clampPanelWidth(preferredWidth)}px`
            );
          syncResizer();
        }

        function setPanelWidth(width) {
          preferredWidth = clampPanelWidth(width);
          applyPanelWidth();
        }

        function endResize() {
          if (!resizing) return;
          resizing = false;
          document.body.classList.remove("resizing");
          savePanelWidth();
          focusCamera(200);
        }

        resizer.addEventListener("pointerdown", (e) => {
          if (e.button !== 0) return;
          e.preventDefault();
          resizer.setPointerCapture(e.pointerId);
          grabOffset = e.clientX - panel.getBoundingClientRect().left;
          resizing = true;
          document.body.classList.add("resizing");
        });
        resizer.addEventListener("pointermove", (e) => {
          if (!resizing) return;
          const right = $("app").getBoundingClientRect().right;
          setPanelWidth(right - (e.clientX - grabOffset));
        });
        resizer.addEventListener("pointerup", endResize);
        resizer.addEventListener("pointercancel", endResize);
        resizer.addEventListener("lostpointercapture", endResize);
        resizer.addEventListener("dblclick", () => {
          preferredWidth = null;
          applyPanelWidth();
          savePanelWidth();
        });
        resizer.addEventListener("keydown", (e) => {
          const step = e.shiftKey ? 64 : 24;
          const current = panel.getBoundingClientRect().width;
          const next = {
            ArrowLeft: current + step,
            ArrowRight: current - step,
            Home: PANEL_MIN,
            End: maxPanelWidth(),
          }[e.key];
          if (next === undefined) return;
          e.preventDefault();
          setPanelWidth(next);
          savePanelWidth();
        });
        window.addEventListener("resize", applyPanelWidth);
        applyPanelWidth();

        new ResizeObserver(() => {
          resize();
          if (selected) focusCamera(resizing ? 0 : 250);
          else if (graphReady && !userMoved) fitAll(0);
          wake();
        }).observe(stage);

        function closePopovers() {
          search.hidden = true;
          info.hidden = true;
          infoBtn.setAttribute("aria-expanded", "false");
        }

        let matches = [];
        let active = 0;

        function renderResults() {
          const q = input.value.trim().toLowerCase();
          const score = (n) => {
            const name = n.name.toLowerCase();
            if (!q) return 3;
            if (name === q) return 0;
            if (name.startsWith(q)) return 1;
            if (name.includes(q)) return 2;
            return n.description.toLowerCase().includes(q) ? 3 : 9;
          };
          matches = nodes
            .filter((n) => score(n) < 9)
            .sort(
              (a, b) => score(a) - score(b) || a.name.localeCompare(b.name)
            );
          active = Math.min(active, Math.max(matches.length - 1, 0));
          results.innerHTML = matches.length
            ? matches
                .map(
                  (n, i) =>
                    `<li id="result-${i}" role="option" aria-selected="${i === active}" data-name="${esc(n.name)}">${esc(n.name)}<small>${esc(n.description)}</small></li>`
                )
                .join("")
            : `<li class="none">No matching ${esc(data.nouns)}</li>`;
          if (matches.length) {
            input.setAttribute("aria-activedescendant", `result-${active}`);
            $(`result-${active}`).scrollIntoView({ block: "nearest" });
          } else input.removeAttribute("aria-activedescendant");
        }

        function openSearch() {
          info.hidden = true;
          infoBtn.setAttribute("aria-expanded", "false");
          search.hidden = false;
          input.value = "";
          active = 0;
          renderResults();
          input.focus();
        }

        function pick(name) {
          go(name);
          requestAnimationFrame(() => {
            const heading = panelBody.querySelector("h1");
            if (heading) heading.focus({ preventScroll: true });
          });
        }

        input.addEventListener("input", () => {
          active = 0;
          renderResults();
        });
        input.addEventListener("keydown", (e) => {
          if (e.key === "ArrowDown" || e.key === "ArrowUp") {
            e.preventDefault();
            if (!matches.length) return;
            active =
              (active + (e.key === "ArrowDown" ? 1 : -1) + matches.length) %
              matches.length;
            renderResults();
          } else if (e.key === "Enter" && matches[active]) {
            e.preventDefault();
            pick(matches[active].name);
          }
        });
        results.addEventListener("mousedown", (e) => e.preventDefault());
        results.addEventListener("click", (e) => {
          const li = e.target.closest("li[data-name]");
          if (li) pick(li.dataset.name);
        });

        $("search-btn").addEventListener("click", () =>
          search.hidden ? openSearch() : closePopovers()
        );
        infoBtn.addEventListener("click", () => {
          const open = info.hidden;
          closePopovers();
          info.hidden = !open;
          infoBtn.setAttribute("aria-expanded", String(open));
        });
        $("close").addEventListener("click", () => go(null));
        $("info-counts").textContent =
          `${nodes.length} ${nodes.length === 1 ? data.noun : data.nouns}, ${links.length} ${links.length === 1 ? "link" : "links"}, ${data.sections.length} ${data.sections.length === 1 ? "group" : "groups"}.`;

        panel.addEventListener("mouseover", (e) => {
          const a = e.target.closest("[data-term]");
          const next = a ? byName.get(a.dataset.term) || null : null;
          if (next !== hovered) {
            hovered = next;
            wake();
          }
        });
        panel.addEventListener("mouseleave", () => {
          hovered = null;
          wake();
        });

        document.addEventListener("keydown", (e) => {
          const typing = /^(INPUT|TEXTAREA)$/.test(
            document.activeElement?.tagName || ""
          );
          if (
            (e.key === "/" && !typing) ||
            (e.key.toLowerCase() === "k" && (e.metaKey || e.ctrlKey))
          ) {
            e.preventDefault();
            openSearch();
          } else if (e.key === "Escape") {
            if (!search.hidden || !info.hidden) {
              const fromSearch = !search.hidden;
              closePopovers();
              if (fromSearch) $("search-btn").focus();
            } else if (selected) go(null);
          }
        });

        window.addEventListener("hashchange", () =>
          applyHash({ moveFocus: true })
        );

        let graphReady = false;
        resize();
        setTimeout(() => {
          graphReady = true;
          if (location.hash.length > 1) applyHash();
          else fitAll(0);
        }, 60);
      })();
    </script>
  </body>
</html>
