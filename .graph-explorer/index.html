A system that converts rich ISO 20022 fields into an older format can truncate a long name or lose invoice references, and reconciliation then fails downstream. A payment can also be rejected because a required structured field is empty. Keep the original message, map fields explicitly, and test with real long names, non-Latin transliterations and full remittance data.\u003c/p>","avoid":"","usage":["Invoice references started disappearing from incoming payments.","Our adapter still flattens ISO 20022 into the old format and truncates the remittance field. Map it directly."],"out":[92,28,4,82,81,84,85,86]},{"name":"Direct debit mandate","section":6,"description":"A payer's authorization allowing a named creditor to collect payments from their bank account under scheme rules.","body":"\u003cp>A direct debit mandate is the authorization a payer gives a creditor to collect money from their bank account. It identifies the parties and the account, and it sets the terms of the collection. Without a valid mandate, a debit can be returned as unauthorised. Each scheme has its own name and rules for it:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Region\u003c/th>\u003cth>Scheme or service\u003c/th>\u003cth>Mandate details\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>SEPA\u003c/td>\u003ctd>\u003ca href=\"#SEPA%20Direct%20Debit\" data-term=\"SEPA Direct Debit\">SEPA Direct Debit\u003c/a>\u003c/td>\u003ctd>Creditor identifier plus a unique mandate reference\u003c/td>\u003c/tr>\u003ctr>\u003ctd>UK\u003c/td>\u003ctd>Bacs Direct Debit\u003c/td>\u003ctd>Direct Debit Instruction, backed by the Direct Debit Guarantee\u003c/td>\u003c/tr>\u003ctr>\u003ctd>US\u003c/td>\u003ctd>\u003ca href=\"#ACH\" data-term=\"ACH\">ACH\u003c/a>\u003c/td>\u003ctd>Authorization under Nacha rules, with requirements by entry type\u003c/td>\u003c/tr>\u003ctr>\u003ctd>India\u003c/td>\u003ctd>\u003ca href=\"#UPI\" data-term=\"UPI\">UPI\u003c/a> AutoPay and NACH\u003c/td>\u003ctd>Registered e-mandate, under Reserve Bank of India and NPCI rules\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Brazil\u003c/td>\u003ctd>\u003ca href=\"#Pix\" data-term=\"Pix\">Pix\u003c/a> Automático\u003c/td>\u003ctd>Payer's prior authorization, under Banco Central do Brasil rules\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A mandate differs from a \u003ca href=\"#Stored%20credential\" data-term=\"Stored credential\">stored credential\u003c/a>. A stored credential is a saved card used under \u003ca href=\"#Card%20network\" data-term=\"Card network\">card network\u003c/a> rules. A mandate authorises debits from a bank account under a bank scheme. It also differs from \u003ca href=\"#Recurring%20billing\" data-term=\"Recurring billing\">recurring billing\u003c/a>, which is the business process that decides when to collect. A mandate is only the permission.\u003c/p>\u003cp>Under the UK guarantee, if an error is made, the payer's bank must give a full and immediate refund, then reclaim it from the collecting organisation through an indemnity claim.\u003c/p>\u003cp>The failures are mostly about evidence and lifecycle. A customer disputes a debit and the business cannot produce the mandate, so it loses the money. A migration between providers drops mandate references, and the next collection is rejected. A price rise goes out without the required advance notice, and customers claim refunds.\u003c/p>\u003cp>Store the reference, scheme, signature date, wording version and proof of consent. Mark a mandate as cancelled as soon as the bank or customer revokes it, and stop collecting against it.\u003c/p>","avoid":"","usage":["The bank returned the debit saying there's no valid mandate.","We lost the mandate references in the provider migration. Pause collections and re-collect them from affected customers."],"out":[80,77,97,98,116,4,119]},{"name":"Payment return","section":6,"description":"A bank-rail reversal in which a debit or credit is sent back, with a reason code, after being submitted or settled.","body":"\u003cp>A payment return is a bank-rail message that sends a debit or credit back to the originating bank because it could not be applied or is being contested. The money moves back, and the message carries a reason code. Returns occur on \u003ca href=\"#ACH\" data-term=\"ACH\">ACH\u003c/a>, SEPA and other bank rails, often after the payment appeared successful.\u003c/p>\u003cp>A return is different from a \u003ca href=\"#Refund\" data-term=\"Refund\">refund\u003c/a>, which the \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchant\u003c/a> chooses to issue, and from a \u003ca href=\"#Chargeback\" data-term=\"Chargeback\">chargeback\u003c/a>, which is the card dispute process. It also differs from a rejection, where a payment is refused before \u003ca href=\"#Settlement\" data-term=\"Settlement\">settlement\u003c/a>. SEPA groups these exceptions as R-transactions, including rejects, returns, refunds and recalls.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Rail\u003c/th>\u003cth>Code\u003c/th>\u003cth>Meaning\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>ACH\u003c/td>\u003ctd>\u003ccode>R01\u003c/code>\u003c/td>\u003ctd>Insufficient funds\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ACH\u003c/td>\u003ctd>\u003ccode>R02\u003c/code>\u003c/td>\u003ctd>Account closed\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ACH\u003c/td>\u003ctd>\u003ccode>R03\u003c/code>\u003c/td>\u003ctd>No account, or unable to locate it\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ACH\u003c/td>\u003ctd>\u003ccode>R10\u003c/code>\u003c/td>\u003ctd>Consumer says the debit was unauthorised\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ACH\u003c/td>\u003ctd>\u003ccode>R29\u003c/code>\u003c/td>\u003ctd>Business says the debit was unauthorised\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SEPA\u003c/td>\u003ctd>\u003ccode>AC04\u003c/code>\u003c/td>\u003ctd>Account closed\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SEPA\u003c/td>\u003ctd>\u003ccode>AM04\u003c/code>\u003c/td>\u003ctd>Insufficient funds\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SEPA\u003c/td>\u003ctd>\u003ccode>MD01\u003c/code>\u003c/td>\u003ctd>No valid mandate\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Return windows depend on the rail, the code and the payer type. Nacha and the European Payments Council set them in their rules, and they can change. An unauthorised claim can arrive much later than an insufficient-funds return.\u003c/p>\u003cp>A loss occurs when a platform credits a user's balance on submission, the user withdraws the money, and the debit then returns. The platform carries the loss. Hold funds according to risk, and treat bank debits as provisional until the relevant window has passed.\u003c/p>\u003cp>Record a return as a new \u003ca href=\"#Ledger\" data-term=\"Ledger\">ledger\u003c/a> entry that reverses the original, and never edit or delete the original row. Handle codes differently: \u003ccode>R01\u003c/code> may justify a later retry within scheme limits, while \u003ccode>R10\u003c/code> means stop collecting and investigate. Nacha limits how a returned debit may be reinitiated.\u003c/p>","avoid":"","usage":["This user's balance went negative overnight. What happened?","Their funding debit came back as a payment return, \u003ccode>R01\u003c/code>, after they'd withdrawn. Post a reversal and restrict the account."],"out":[77,20,1,60,22,109]},{"name":"Open banking","section":6,"description":"Regulated or standardised access for authorised third parties to bank account data and payment initiation, with customer consent.","body":"\u003cp>Open banking is a framework that lets authorised third parties, with a customer's consent, read bank account data or initiate payments from that account through the bank's interfaces. An account information provider reads balances and transactions. A payment initiation provider starts a payment from the customer's account.\u003c/p>\u003cp>The legal basis differs by country:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Jurisdiction\u003c/th>\u003cth>Basis\u003c/th>\u003cth>Status to check\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>EU\u003c/td>\u003ctd>\u003ca href=\"#PSD2\" data-term=\"PSD2\">PSD2\u003c/a>\u003c/td>\u003ctd>PSD3 and a Payment Services Regulation were provisionally agreed in November 2025; check publication and application dates\u003c/td>\u003c/tr>\u003ctr>\u003ctd>UK\u003c/td>\u003ctd>2017 Competition and Markets Authority order for the largest banks\u003c/td>\u003ctd>Long-term framework under the Data (Use and Access) Act 2025 is still being put in place\u003c/td>\u003c/tr>\u003ctr>\u003ctd>US\u003c/td>\u003ctd>Consumer Financial Protection Bureau Section 1033 rule\u003c/td>\u003ctd>The 2024 rule is under agency reconsideration, and compliance dates have been in flux\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Brazil\u003c/td>\u003ctd>Open Finance under Banco Central do Brasil rules\u003c/td>\u003ctd>Operating, with rules that continue to develop\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Open banking differs from \u003ca href=\"#Pay%20by%20bank\" data-term=\"Pay by bank\">pay by bank\u003c/a>, which is one product built on top of it. It also differs from screen scraping, where a service logs in with the customer's credentials and reads web pages. Regulated interfaces use consent and scoped access, so the third party never receives the banking password.\u003c/p>\u003cp>Consent is the most common operational problem. Access can expire or need renewed customer authentication, depending on the regime and the bank. A lending or accounting product then stops receiving transactions, and users see stale balances with no obvious error. Bank interfaces also vary in quality, so one bank's outage can break a segment of customers.\u003c/p>\u003cp>Track consent expiry and prompt users before it lapses. Monitor success rates per bank, and show the last successful sync time so a stale balance is visible. Check whether your activity requires authorisation or can run through a licensed provider.\u003c/p>","avoid":"","usage":["Half our users' bank feeds stopped updating last night.","Their open banking consents expired. Prompt them to reauthenticate, and warn them before expiry from now on."],"out":[48,94]},{"name":"Pay by bank","section":6,"description":"A checkout method where the customer pays directly from their bank account, often through open banking payment initiation.","body":"\u003cp>Pay by bank is a checkout method in which a customer pays a \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchant\u003c/a> directly from a bank account instead of with a card. In many markets it uses \u003ca href=\"#Open%20banking\" data-term=\"Open banking\">open banking\u003c/a>: a licensed payment initiation provider sends the customer to their bank to approve a pre-filled transfer. The underlying rail depends on the country, for example \u003ca href=\"#Faster%20Payments\" data-term=\"Faster Payments\">Faster Payments\u003c/a> in the UK or a \u003ca href=\"#SEPA%20Credit%20Transfer\" data-term=\"SEPA Credit Transfer\">SEPA Credit Transfer\u003c/a> or \u003ca href=\"#SEPA%20Instant\" data-term=\"SEPA Instant\">SEPA Instant\u003c/a> in Europe. In the US, products under this name often use linked accounts and an \u003ca href=\"#ACH\" data-term=\"ACH\">ACH\u003c/a> debit, and some use instant rails.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Step\u003c/th>\u003cth>Who\u003c/th>\u003cth>What happens\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Customer\u003c/td>\u003ctd>Chooses pay by bank and selects a bank\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Payment provider\u003c/td>\u003ctd>Creates a payment with amount and reference\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Customer's bank\u003c/td>\u003ctd>Authenticates the customer, who approves\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>Customer's bank\u003c/td>\u003ctd>Sends the payment on the rail\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Merchant\u003c/td>\u003ctd>Confirms receipt, then fulfils\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Compared with cards, there is no \u003ca href=\"#Interchange%20fee\" data-term=\"Interchange fee\">interchange fee\u003c/a> and usually no card-style \u003ca href=\"#Chargeback\" data-term=\"Chargeback\">chargeback\u003c/a>. That shifts the risk. Consumer protection comes from the rail and local law, not \u003ca href=\"#Card%20network\" data-term=\"Card network\">card network\u003c/a> rules, and it differs by market. A push payment is generally hard to reverse, while a US ACH debit can come back later as a \u003ca href=\"#Payment%20return\" data-term=\"Payment return\">payment return\u003c/a>.\u003c/p>\u003cp>The common engineering mistake is treating the customer's approval as payment received. &quot;Authorised&quot; at the bank can still become rejected, pending or delayed by a fraud check. A customer can also close the browser after approving, so the redirect never reaches your site and the order looks abandoned. Rely on server-side status from the provider and query it if no update arrives.\u003c/p>\u003cp>\u003ca href=\"#Refund\" data-term=\"Refund\">Refunds\u003c/a> also work differently. There is no card to credit, so the merchant needs the payer's account details or a provider feature that returns funds.\u003c/p>","avoid":"","usage":["The customer's bank says they paid, but our order is still pending.","With pay by bank the redirect can fail after approval. Query the provider's status instead of relying on the return URL."],"out":[1,93,86,78,79,77,66,60,4,92,20]},{"name":"Digital wallet","section":7,"description":"An app or account that stores payment credentials or a balance, so a customer can pay without entering card details.","body":"\u003cp>A digital wallet is an app or online account that stores a customer's payment credentials, a balance, or both, and uses them to make payments. The type determines who holds the money and which rail carries the payment.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Type\u003c/th>\u003cth>Example\u003c/th>\u003cth>How it pays\u003c/th>\u003cth>Holds funds?\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Pass-through\u003c/td>\u003ctd>Apple Pay, Google Pay\u003c/td>\u003ctd>Passes a card credential, often a \u003ca href=\"#Network%20token\" data-term=\"Network token\">network token\u003c/a>, to the \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchant\u003c/a>\u003c/td>\u003ctd>No\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Staged\u003c/td>\u003ctd>PayPal paying with a linked card\u003c/td>\u003ctd>Wallet charges the funding source, then pays the merchant\u003c/td>\u003ctd>Sometimes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Stored value\u003c/td>\u003ctd>Balance in a wallet account\u003c/td>\u003ctd>Spends a balance held by the provider\u003c/td>\u003ctd>Yes\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>In a pass-through wallet, the payment is still a card payment. The \u003ca href=\"#Issuer\" data-term=\"Issuer\">issuer\u003c/a> approves it, the merchant's \u003ca href=\"#Acquirer\" data-term=\"Acquirer\">acquirer\u003c/a> processes it, and the usual card fees and \u003ca href=\"#Chargeback\" data-term=\"Chargeback\">chargeback\u003c/a> rules apply. A wallet is therefore not a rail in its own right. A staged or stored-value wallet is different, because the wallet provider is a party to the payment, and holding customer balances generally requires a licence such as e-money authorisation, with duties such as \u003ca href=\"#Safeguarding\" data-term=\"Safeguarding\">safeguarding\u003c/a>.\u003c/p>\u003cp>Device wallets replace the card number with a device-specific token and authenticate the customer with a biometric or passcode. Because of this, the last four digits shown in the wallet may differ from those printed on the physical card. A common support ticket follows: a customer gives the digits from their plastic card, and the agent cannot find the order. Search by the token's last four digits, the amount and the date, or use the provider's transaction reference.\u003c/p>\u003cp>Expect a saved wallet token to stop working when a customer changes device or removes the card. Store the wallet type separately for reporting, since \u003ca href=\"#Authorization%20rate\" data-term=\"Authorization rate\">authorization rates\u003c/a> and fraud patterns can differ from manually entered cards.\u003c/p>","avoid":"","usage":["Support can't find this order using the customer's card number.","They paid with a digital wallet, so the last four belong to the device token. Search by amount and date."],"out":[40,1,2,3,60,123,115]},{"name":"Buy now pay later","section":7,"description":"Short-term credit at checkout that splits a purchase into instalments, with rules that depend on the jurisdiction.","body":"\u003cp>Buy now pay later, or BNPL, is a form of short-term credit offered at checkout that lets a customer split a purchase into instalments or defer payment. A BNPL provider typically pays the \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchant\u003c/a> up front, less a fee, and then collects repayments from the customer. Some plans charge no interest and may charge late fees, while longer plans can charge interest. Terms vary by provider and country.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Party\u003c/th>\u003cth>Role\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Customer\u003c/td>\u003ctd>Agrees a credit plan and repays on schedule\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Provider\u003c/td>\u003ctd>Assesses the customer, pays the merchant, collects\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Merchant\u003c/td>\u003ctd>Receives funds, pays a fee, handles returns and \u003ca href=\"#Refund\" data-term=\"Refund\">refunds\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>BNPL differs from a credit card in that each purchase is usually a separate loan with a fixed schedule, not a revolving limit.\u003c/p>\u003cp>The product depends heavily on regulation, which has been changing:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Jurisdiction\u003c/th>\u003cth>Position\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>UK\u003c/td>\u003ctd>The Financial Conduct Authority began regulating deferred payment credit on 15 July 2026\u003c/td>\u003c/tr>\u003ctr>\u003ctd>EU\u003c/td>\u003ctd>Consumer Credit Directive (EU) 2023/2225 applies from 20 November 2026 and covers BNPL, with limited exclusions\u003c/td>\u003c/tr>\u003ctr>\u003ctd>US\u003c/td>\u003ctd>The Consumer Financial Protection Bureau withdrew its 2024 BNPL interpretive rule in May 2025. Federal and state lending laws may still apply\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Merchants offering BNPL should confirm the required disclosures and marketing rules with the provider and legal counsel. This entry describes the product and is not financial advice.\u003c/p>\u003cp>The operational failure usually involves returns. A customer returns one item from a split order, but the instalments do not update until the merchant sends the refund to the provider. The customer sees a payment still due on goods they sent back and contacts support. Send partial refunds through the provider's API against the original order, and keep the provider's plan ID in your payment record.\u003c/p>","avoid":"","usage":["A customer returned the shoes but is still being asked for instalments.","We never sent the refund to the buy now pay later provider. Post it against the original order so the plan recalculates."],"out":[1,20]},{"name":"UPI","section":7,"description":"India's real-time account-to-account payment system, operated by NPCI under Reserve Bank of India oversight.","body":"\u003cp>UPI, the Unified Payments Interface, is India's real-time payment system for moving money between bank accounts through mobile apps. The National Payments Corporation of India (NPCI) operates it, under the oversight of the Reserve Bank of India. Banks and licensed third-party apps connect to it, so customers of different banks can pay each other.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Element\u003c/th>\u003cth>What it is\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>UPI ID\u003c/td>\u003ctd>A virtual address such as \u003ccode>name@bank\u003c/code>, hiding account details\u003c/td>\u003c/tr>\u003ctr>\u003ctd>UPI PIN\u003c/td>\u003ctd>A secret the customer enters to authorise a debit\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PSP app\u003c/td>\u003ctd>The app the customer uses to send or approve a payment\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#QR%20code%20payment\" data-term=\"QR code payment\">QR code payment\u003c/a>\u003c/td>\u003ctd>A \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchant\u003c/a> code the customer scans to pay\u003c/td>\u003c/tr>\u003ctr>\u003ctd>AutoPay\u003c/td>\u003ctd>A registered mandate for recurring debits\u003c/td>\u003c/tr>\u003ctr>\u003ctd>UPI Lite\u003c/td>\u003ctd>An on-device balance for small payments without a PIN\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>UPI is the rail, and consumer apps are built on it. It differs from a card payment because funds normally come straight from a bank account, although NPCI also supports RuPay credit cards and pre-sanctioned credit lines on UPI.\u003c/p>\u003cp>NPCI's rules change regularly. Its consolidated circular of September 2026 says the collect function must not be available for person-to-person payments. For recurring payments, the Reserve Bank's E-mandate Framework, 2026 covers registration, additional authentication and pre-debit notification. Limits and fees are set by NPCI, the Reserve Bank and banks, so confirm them at the source.\u003c/p>\u003cp>The typical failure is a payment stuck as pending. The customer's bank has debited the account, but the merchant has received no confirmation, and the customer pays again. Treat pending as an unknown outcome. Query the transaction status with your reference before offering a retry.\u003c/p>","avoid":"","usage":["The customer was debited, but the order shows unpaid.","The UPI transaction is still pending. Run a status check on our reference before letting them pay again."],"out":[101,1]},{"name":"Pix","section":7,"description":"Brazil's instant payment system, created and run by the Banco Central do Brasil, available around the clock.","body":"\u003cp>Pix is Brazil's instant payment system, created and operated by the Banco Central do Brasil. It runs 24 hours a day and moves money between accounts at participating institutions within seconds. Transfers settle through the central bank's Instant Payment System, known as SPI.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Element\u003c/th>\u003cth>What it is\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Pix key\u003c/td>\u003ctd>An alias such as a tax ID, phone, email or random key\u003c/td>\u003c/tr>\u003ctr>\u003ctd>DICT\u003c/td>\u003ctd>The central bank's directory mapping keys to accounts\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Static QR\u003c/td>\u003ctd>A reusable code, often with an open amount\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Dynamic QR\u003c/td>\u003ctd>A code generated per charge, with an amount and identifier\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Pix Automático\u003c/td>\u003ctd>Recurring collection under one prior payer authorization, live since 16 June 2025\u003c/td>\u003c/tr>\u003ctr>\u003ctd>MED\u003c/td>\u003ctd>Special Return Mechanism for suspected fraud and certain failures\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Pix is a credit push: the payer's institution sends the funds. That distinguishes it from a card payment, which involves an authorization and later \u003ca href=\"#Settlement\" data-term=\"Settlement\">settlement\u003c/a>, and from boleto, a payment slip that clears on a slower cycle.\u003c/p>\u003cp>Pix has a dedicated fraud-return process. Under MED, the receiving institution can block funds and return them when fraud is reasonably suspected. The central bank made MED 2.0, which extends tracing of funds across accounts, mandatory from 2 February 2026. A \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchant\u003c/a> can therefore lose funds it believed were final. Rules continue to change, so check the current Pix regulation.\u003c/p>\u003cp>For merchants, the most common operational failure is matching. A static QR code without a usable identifier produces a credit that cannot be tied to an order. Use a dynamic QR with a unique transaction ID per order, confirm from the provider's server-side event, and never accept a customer's screenshot as proof, because it can be faked. Record any later MED return as a new \u003ca href=\"#Ledger\" data-term=\"Ledger\">ledger\u003c/a> entry.\u003c/p>","avoid":"","usage":["Finance has a Pix credit with no matching order.","That came through our old static QR. Move checkout to dynamic codes so every payment carries an order ID."],"out":[22,1,109]},{"name":"Virtual card","section":7,"description":"A card number issued digitally for a specific use, often with limits on merchant, amount or time.","body":"\u003cp>A virtual card is a payment card that exists only as digital details: a card number, expiry date and security code. An \u003ca href=\"#Issuer\" data-term=\"Issuer\">issuer\u003c/a> creates it, often through a card programme run by a fintech with a \u003ca href=\"#Sponsor%20bank\" data-term=\"Sponsor bank\">sponsor bank\u003c/a>. It can be restricted to one \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchant\u003c/a>, one use, a maximum amount or a period of time. Businesses use them to pay suppliers, control employee spending and book travel.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Control\u003c/th>\u003cth>Effect\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Single use\u003c/td>\u003ctd>Closes after the first successful payment\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Merchant lock\u003c/td>\u003ctd>Works only at a chosen merchant or \u003ca href=\"#Merchant%20category%20code\" data-term=\"Merchant category code\">merchant category code\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Amount limit\u003c/td>\u003ctd>Declines anything above the set value\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Expiry\u003c/td>\u003ctd>Stops working after a chosen date\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A virtual card is often confused with a \u003ca href=\"#Network%20token\" data-term=\"Network token\">network token\u003c/a>. A virtual card has a real \u003ca href=\"#PAN\" data-term=\"PAN\">PAN\u003c/a> and can be used anywhere its controls allow, on the \u003ca href=\"#Card%20network\" data-term=\"Card network\">card network\u003c/a> like any other card. A network token replaces an existing card number for a specific merchant or device, and it cannot be typed into another checkout.\u003c/p>\u003cp>The controls that make these cards useful also cause most of their failures. A merchant lock fails because the supplier's payment went through a parent company or a different merchant category. A hotel adds an \u003ca href=\"#Incremental%20authorization\" data-term=\"Incremental authorization\">incremental authorization\u003c/a> above the amount limit and the charge is declined. A single-use card is closed, and a later top-up or subscription renewal fails. A \u003ca href=\"#Refund\" data-term=\"Refund\">refund\u003c/a> to a closed virtual card may need manual handling by the issuer.\u003c/p>\u003cp>A hotel or rental desk may also ask for the physical card used at booking, which does not exist. Set the limit to cover expected holds and final charges, keep the card open until the transaction has fully completed, and tell the traveller in advance how payment will work.\u003c/p>","avoid":"","usage":["The supplier says our payment was declined again.","The virtual card is locked to their old merchant category. Reissue it with the new one and raise the limit."],"out":[2,12,1,32,40,24,4,17,20]},{"name":"Prepaid card","section":7,"description":"A payment card that spends a preloaded balance held by the programme, not a linked current account or a credit line.","body":"\u003cp>A prepaid card is a payment card that draws on money loaded in advance rather than on a linked bank account or a credit line. An \u003ca href=\"#Issuer\" data-term=\"Issuer\">issuer\u003c/a>, or a programme manager working with one, holds the balance. Common forms are gift, payroll, travel and reloadable general-purpose cards. Most run on a \u003ca href=\"#Card%20network\" data-term=\"Card network\">card network\u003c/a>, so a \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchant\u003c/a> accepts them like other cards.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Card type\u003c/th>\u003cth>Spends from\u003c/th>\u003cth>Issuer's exposure\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Credit\u003c/td>\u003ctd>A credit line, repaid later\u003c/td>\u003ctd>Credit risk\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Debit\u003c/td>\u003ctd>The holder's bank account\u003c/td>\u003ctd>Mostly the account balance\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Prepaid\u003c/td>\u003ctd>A balance loaded in advance\u003c/td>\u003ctd>Limited to the balance, plus programme risk\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Regulation depends on the product and the jurisdiction. In the US, the Consumer Financial Protection Bureau's Prepaid Rule applies disclosure and error-resolution protections to many prepaid accounts. In the EU and UK, many prepaid products are e-money, so issuers need authorisation and must meet \u003ca href=\"#Safeguarding\" data-term=\"Safeguarding\">safeguarding\u003c/a> requirements. Gift cards and closed-loop cards usable at one merchant may fall under different rules or exemptions.\u003c/p>\u003cp>A merchant usually meets prepaid cards through declines. An \u003ca href=\"#Authorization%20hold\" data-term=\"Authorization hold\">authorization hold\u003c/a> for an estimated amount can exceed the remaining balance, which is common at fuel pumps and hotels, even if the final charge would have fit. The \u003ca href=\"#BIN\" data-term=\"BIN\">BIN\u003c/a> can also show that a card is prepaid, and some merchants block these cards for subscriptions because they run out of funds on renewal.\u003c/p>\u003cp>Some card programmes support partial approval, where the issuer approves only the available balance and the customer pays the rest another way. Enable it if your checkout can collect a second payment. \u003ca href=\"#Refund\" data-term=\"Refund\">Refunds\u003c/a> can also be awkward when a card has expired or been discarded, so keep an alternative refund route, such as store credit where the law allows.\u003c/p>","avoid":"","usage":["This customer's card keeps declining at pre-auth, but they say there's money on it.","It's a prepaid card and our hold is bigger than the balance. Lower the hold or support partial approval."],"out":[2,4,1,123,14,25,20]},{"name":"QR code payment","section":7,"description":"A payment started by scanning a QR code, which carries payment data while a separate rail moves the money.","body":"\u003cp>A QR code payment is a payment started by scanning a two-dimensional code that carries payment information. The QR code is only a way to pass data between devices. The money moves on a separate rail, such as \u003ca href=\"#UPI\" data-term=\"UPI\">UPI\u003c/a>, \u003ca href=\"#Pix\" data-term=\"Pix\">Pix\u003c/a>, a \u003ca href=\"#Card%20network\" data-term=\"Card network\">card network\u003c/a> or a \u003ca href=\"#Digital%20wallet\" data-term=\"Digital wallet\">digital wallet\u003c/a>'s own system. Two transactions that look identical at the till can therefore have different fees, finality and dispute rights.\u003c/p>\u003cp>EMVCo, the card industry's technical standards body, publishes QR specifications for two modes:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mode\u003c/th>\u003cth>Who shows the code\u003c/th>\u003cth>Who scans\u003c/th>\u003cth>Typical use\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Merchant-presented\u003c/td>\u003ctd>Merchant\u003c/td>\u003ctd>Customer\u003c/td>\u003ctd>Stickers, screens, invoices\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Consumer-presented\u003c/td>\u003ctd>Customer's app\u003c/td>\u003ctd>Merchant\u003c/td>\u003ctd>Retail tills with scanners\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Merchant-presented codes can be static or dynamic. A static code is printed once and normally identifies only the payee, so the customer types in the amount. A dynamic code is generated for one payment and includes the amount and a reference, which makes automatic matching possible. National systems define their own formats, many of them based on the EMVCo specification.\u003c/p>\u003cp>QR payment is often confused with contactless card payment. A tap uses NFC, a short-range radio link, and \u003ca href=\"#EMV\" data-term=\"EMV\">EMV\u003c/a> card technology. A QR payment uses a camera and usually an app, and needs no card terminal in merchant-presented mode.\u003c/p>\u003cp>Static codes create two recognisable failures. A fraudster places a sticker with their own code over the merchant's, and customers pay the wrong account while believing the payment succeeded. A shop assistant accepts a customer's success screen, which can be faked or may show a payment that later failed.\u003c/p>\u003cp>Use dynamic codes where possible, and check displayed codes regularly if you use static ones. Release goods only when your own terminal, app or provider confirms the credit.\u003c/p>","avoid":"","usage":["Three customers say they paid, but nothing reached our account.","Someone put a fake sticker over the QR code at the till. Replace it and switch to dynamic codes."],"out":[97,98,4,95,27]},{"name":"Cash voucher","section":7,"description":"A payment reference that a customer takes to a shop or bank to pay in cash, with the merchant confirmed afterwards.","body":"\u003cp>A cash voucher is a payment method in which a \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchant\u003c/a>'s checkout generates a reference or barcode, and the customer pays it in cash at a participating location such as a convenience store, bank agent or lottery kiosk. The collection network then reports the payment. Examples include boleto in Brazil, OXXO in Mexico and konbini payments in Japan. Vouchers let people without cards or bank accounts buy online. Boleto can also be paid through banking apps.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Step\u003c/th>\u003cth>Who\u003c/th>\u003cth>What happens\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Customer\u003c/td>\u003ctd>Chooses the voucher method at checkout\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Provider\u003c/td>\u003ctd>Issues a reference with an amount and expiry\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Customer\u003c/td>\u003ctd>Pays at a store, agent or banking app\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>Collection network\u003c/td>\u003ctd>Records the payment and notifies the provider\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Merchant\u003c/td>\u003ctd>Receives confirmation and fulfils\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A voucher is asynchronous. The order sits unpaid between steps 2 and 4, for hours or days, and some customers never pay. It is different from a \u003ca href=\"#Prepaid%20card\" data-term=\"Prepaid card\">prepaid card\u003c/a>, where value is loaded before the purchase and spent through a \u003ca href=\"#Card%20network\" data-term=\"Card network\">card network\u003c/a>. It also has no authorization step, so a merchant cannot know at checkout whether payment will happen.\u003c/p>\u003cp>Stock is the usual problem. Reserving items for every voucher lets unpaid orders hold stock, while reserving nothing lets a customer pay for an item that has sold out. Set an expiry that fits your stock, and define what happens when a payment is reported after expiry. Provider notifications may also arrive late or more than once, so make the handler safe to run repeatedly.\u003c/p>\u003cp>Vouchers generally have no card-style \u003ca href=\"#Chargeback\" data-term=\"Chargeback\">chargebacks\u003c/a>, but a \u003ca href=\"#Refund\" data-term=\"Refund\">refund\u003c/a> can need the customer's bank details because there is no card to credit. Forged vouchers also exist, so generate them only through your provider.\u003c/p>","avoid":"","usage":["A customer paid their boleto, but the order had already been cancelled.","The cash voucher expired before the payment was reported. Refund it or reinstate the order, and handle late payments in the state machine."],"out":[1,100,4,60,20]},{"name":"Stablecoin payment","section":7,"description":"A payment using a blockchain token designed to track a reference asset, subject to crypto and payments regulation.","body":"\u003cp>A stablecoin payment is a transfer of value using a blockchain token designed to hold a stable price against a reference asset, usually a currency. An issuer creates the tokens and, for fiat-backed designs, holds reserves intended to support redemption. A sender signs a transaction from a wallet, the blockchain records it, and the recipient's wallet receives the token. Businesses often use a provider to convert between bank money and tokens, known as on-ramping and off-ramping.\u003c/p>\u003cp>A stablecoin is not a bank deposit, and stability is not guaranteed. A token can trade below its reference value if confidence in its reserves or redemption falls. Whether holders can redeem directly, and on what terms, depends on the issuer and the applicable law. This entry is not investment or financial advice.\u003c/p>\u003cp>The legal position differs by jurisdiction:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Jurisdiction\u003c/th>\u003cth>Position\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>EU\u003c/td>\u003ctd>MiCA regulates e-money and asset-referenced tokens. The European Banking Authority advised that some e-money token services also need \u003ca href=\"#PSD2\" data-term=\"PSD2\">PSD2\u003c/a> authorisation from 2 March 2026\u003c/td>\u003c/tr>\u003ctr>\u003ctd>US\u003c/td>\u003ctd>The GENIUS Act and the OCC's final rule for its issuers take effect on 18 January 2027\u003c/td>\u003c/tr>\u003ctr>\u003ctd>UK\u003c/td>\u003ctd>Financial Conduct Authority stablecoin rules are final, with the regime starting 25 October 2027\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Unlike a card payment, a stablecoin transfer has no \u003ca href=\"#Chargeback\" data-term=\"Chargeback\">chargeback\u003c/a>, and a confirmed transfer to a wrong address is generally unrecoverable. The same token can exist on several blockchains, so sending on a network the recipient does not support can strand funds. \u003ca href=\"#Sanctions%20screening\" data-term=\"Sanctions screening\">Sanctions screening\u003c/a> and \u003ca href=\"#AML\" data-term=\"AML\">AML\u003c/a> duties can still apply.\u003c/p>\u003cp>Wait for the confirmation depth your risk policy requires before crediting a user. Store the chain, token contract, transaction hash and amount as an integer in the token's base units, because tokens define their own decimals.\u003c/p>","avoid":"","usage":["The customer sent the stablecoin payment, but our wallet shows nothing.","They used a chain we don't support. Check the transaction hash, and show the network at checkout."],"out":[48,60,52,51]},{"name":"Payment intent","section":8,"description":"A record of what a customer intends to pay, which tracks one or more attempts until the payment reaches a final state.","body":"\u003cp>A payment intent is a record that represents one thing a customer intends to pay for, including the amount, currency and current status. It stays the same while the attempts to fulfil it change. Stripe uses the name PaymentIntent. Other providers call a similar object an order, session or payment, and many teams build their own.\u003c/p>\u003cp>The important split is between the intent and its attempts. A customer may try one card, get a decline, and succeed with another. That is one intent with two attempts.\u003c/p>\u003cpre>\u003ccode>{\n  &quot;id&quot;: &quot;pi_123&quot;,\n  &quot;order_id&quot;: &quot;ord_987&quot;,\n  &quot;amount&quot;: 4999,\n  &quot;currency&quot;: &quot;EUR&quot;,\n  &quot;status&quot;: &quot;requires_payment_method&quot;,\n  &quot;attempts&quot;: [{ &quot;id&quot;: &quot;att_1&quot;, &quot;outcome&quot;: &quot;declined&quot; }]\n}\u003c/code>\u003c/pre>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Concept\u003c/th>\u003cth>Question it answers\u003c/th>\u003cth>Cardinality\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Order\u003c/td>\u003ctd>What is being bought?\u003c/td>\u003ctd>One order\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Intent\u003c/td>\u003ctd>What needs to be paid?\u003c/td>\u003ctd>Usually one per order\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Attempt\u003c/td>\u003ctd>What happened this time?\u003c/td>\u003ctd>Many per intent\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The amount is stored as an integer in the currency's \u003ca href=\"#Minor%20unit\" data-term=\"Minor unit\">minor unit\u003c/a>, so 4999 in EUR means 49.99.\u003c/p>\u003cp>Without this object, a system often models each click as a new payment. The failure is familiar: a customer's card is declined, they reload the page and try again, the earlier request also completes, and they suffer a \u003ca href=\"#Double%20charge\" data-term=\"Double charge\">double charge\u003c/a> because two independent payments exist. With an intent, every attempt attaches to one record, and the system can refuse a new attempt once one has succeeded.\u003c/p>\u003cp>Enforce one active intent per order with a unique database constraint. Reuse the existing intent when the checkout page reloads, and send a provider idempotency key (a unique value that lets a server recognise a repeated request) for each attempt. Drive its status through a \u003ca href=\"#Payment%20state%20machine\" data-term=\"Payment state machine\">payment state machine\u003c/a> rather than free updates. If the amount changes, update the intent only while no attempt is in progress.\u003c/p>","avoid":"","usage":["Refreshing checkout creates a new payment each time.","Look up the existing payment intent by order ID and reuse it. Only attempts should multiply."],"out":[76,106,105]},{"name":"Payment state machine","section":8,"description":"A model defining a payment's allowed states and transitions, so that late or duplicate events cannot corrupt its status.","body":"\u003cp>A payment state machine is a model that lists every status a payment can have and the transitions allowed between them. Payment events arrive from customers, providers and scheduled jobs, often late, duplicated or out of order. The state machine decides whether each event may change the record.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>From\u003c/th>\u003cth>Event\u003c/th>\u003cth>To\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>created\u003c/code>\u003c/td>\u003ctd>Authorization approved\u003c/td>\u003ctd>\u003ccode>authorized\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>created\u003c/code>\u003c/td>\u003ctd>Declined\u003c/td>\u003ctd>\u003ccode>failed\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>created\u003c/code>\u003c/td>\u003ctd>Timeout\u003c/td>\u003ctd>\u003ccode>unknown\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>unknown\u003c/code>\u003c/td>\u003ctd>Status query: approved\u003c/td>\u003ctd>\u003ccode>authorized\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>unknown\u003c/code>\u003c/td>\u003ctd>Status query: not processed\u003c/td>\u003ctd>\u003ccode>failed\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>authorized\u003c/code>\u003c/td>\u003ctd>\u003ca href=\"#Capture\" data-term=\"Capture\">Capture\u003c/a> confirmed\u003c/td>\u003ctd>\u003ccode>captured\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>authorized\u003c/code>\u003c/td>\u003ctd>\u003ca href=\"#Void\" data-term=\"Void\">Void\u003c/a> confirmed\u003c/td>\u003ctd>\u003ccode>voided\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>captured\u003c/code>\u003c/td>\u003ctd>Funds settled\u003c/td>\u003ctd>\u003ccode>settled\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>settled\u003c/code>\u003c/td>\u003ctd>\u003ca href=\"#Refund\" data-term=\"Refund\">Refund\u003c/a> confirmed\u003c/td>\u003ctd>\u003ccode>refunded\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Real systems add partial states, such as partially captured or partially refunded, and a \u003ca href=\"#Chargeback\" data-term=\"Chargeback\">chargeback\u003c/a> path. The separate \u003ccode>unknown\u003c/code> state matters because a timeout is not a failure. It holds the payment until a status query resolves an \u003ca href=\"#Unknown%20payment%20outcome\" data-term=\"Unknown payment outcome\">unknown payment outcome\u003c/a>.\u003c/p>\u003cp>A status column without these rules is the usual starting point, and it fails under concurrency. A \u003ccode>failed\u003c/code> event from an earlier attempt arrives after \u003ccode>captured\u003c/code> and overwrites it, so support sees a failed payment that the customer has paid for. Or a provider resends an event, and the fulfilment code ships twice.\u003c/p>\u003cp>Apply transitions atomically with a conditional update, so that only one writer can win:\u003c/p>\u003cpre>\u003ccode>UPDATE payments\nSET status = 'captured', version = version + 1\nWHERE id = $1 AND status = 'authorized';\u003c/code>\u003c/pre>\u003cp>If zero rows change, read the current state. A repeat of the same event is a harmless no-op, so acknowledge it. An impossible transition should be logged and alerted, not forced. Keep an append-only history of every event, because the current status alone cannot explain how the payment got there. Side effects such as shipping should run once per transition.\u003c/p>","avoid":"","usage":["A late failure event flipped a captured payment back to failed.","The handler writes whatever status it receives. Put it behind the payment state machine and reject that transition."],"out":[15,18,20,60,107]},{"name":"Double charge","section":8,"description":"A customer being billed twice for one purchase, usually from an unsafe retry or duplicate processing.","body":"\u003cp>A double charge is when a customer is billed more than once for a single purchase. The usual causes are a retry after a timeout, a repeated click, two workers processing the same job, or a duplicated \u003ca href=\"#Capture\" data-term=\"Capture\">capture\u003c/a>. The customer sees two entries on their statement and contacts support, or disputes one with their bank.\u003c/p>\u003cp>Not every pair of entries is a true duplicate. An \u003ca href=\"#Authorization%20hold\" data-term=\"Authorization hold\">authorization hold\u003c/a> can appear next to the final charge for a few days, particularly when the amounts differ, such as a hotel or fuel purchase. The bank later drops the hold. Before refunding, check whether both items were captured.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Cause\u003c/th>\u003cth>How it happens\u003c/th>\u003cth>Prevention\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Retry after timeout\u003c/td>\u003ctd>First request succeeded, client sent a new one\u003c/td>\u003ctd>Query status, reuse the same idempotency key\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Double click\u003c/td>\u003ctd>Two submissions from one form\u003c/td>\u003ctd>Disable button, enforce one intent per order\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Concurrent workers\u003c/td>\u003ctd>Two jobs pick up the same invoice\u003c/td>\u003ctd>Unique constraint or row lock\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Replayed provider event\u003c/td>\u003ctd>Handler repeats its side effect\u003c/td>\u003ctd>Deduplicate on event ID\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Failover to another provider\u003c/td>\u003ctd>Second provider charges after an unknown first outcome\u003c/td>\u003ctd>Resolve the first attempt before routing\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>An idempotency key (a unique value that lets a server recognise a repeated request) protects one provider boundary only, so a failover to a second provider needs a status check first.\u003c/p>\u003cp>To repair a real duplicate, \u003ca href=\"#Void\" data-term=\"Void\">void\u003c/a> the second payment if it has not been captured, or \u003ca href=\"#Refund\" data-term=\"Refund\">refund\u003c/a> it if it has. Record that correction as a new \u003ca href=\"#Ledger\" data-term=\"Ledger\">ledger\u003c/a> entry, leaving the original entries in place. Then find every affected customer by searching for multiple successful payments with the same order, or the same card, amount and short time window. Contact them before they raise a \u003ca href=\"#Chargeback\" data-term=\"Chargeback\">chargeback\u003c/a>.\u003c/p>","avoid":"","usage":["Support has ten tickets about a double charge since this morning.","The new retry job generates a fresh key per attempt. Stop it, find the duplicates by order ID, and refund them."],"out":[15,14,18,20,109,60]},{"name":"Unknown payment outcome","section":8,"description":"A payment whose result is not known after a timeout or lost response, and which must be resolved before any retry.","body":"\u003cp>An unknown payment outcome is the state a payment is in when the sender cannot tell whether it succeeded. It usually follows a timeout, a dropped connection, a crash after sending, or a 5xx error from a provider. The request may never have arrived, or it may have been approved with only the response lost.\u003c/p>\u003cp>This is different from a decline. A decline is a definite answer from the \u003ca href=\"#Issuer\" data-term=\"Issuer\">issuer\u003c/a> that no payment was approved. A timeout is no answer at all. Treating it as a failure can cause a \u003ca href=\"#Double%20charge\" data-term=\"Double charge\">double charge\u003c/a>: the app shows &quot;Payment failed&quot;, the customer pays again, and both payments succeed.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Step\u003c/th>\u003cth>Action\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Move the payment to \u003ccode>unknown\u003c/code> and do not fulfil or fail it\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Query the provider's status API with your own reference\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>If approved, continue the normal flow\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>If declined or never processed, mark it failed\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>If not found, wait and query again, as records can lag\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>If still unresolved, follow the provider's reversal or support route\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cpre>\u003ccode>on timeout:\n  payment.status = &quot;unknown&quot;\n  result = provider.get_by_reference(payment.reference)\n  if result is pending or not_found: schedule another status check\n  else: apply result through the state machine\u003c/code>\u003c/pre>\u003cp>Generate your reference and persist it before sending the request, or you will have nothing to query after a crash. If the provider supports idempotency keys (unique values that make a repeat return the first result), a retry with the same key is safe within the provider's documented window. Do not switch to another provider until the first attempt is resolved.\u003c/p>\u003cp>Card systems also use an \u003ca href=\"#Authorization%20reversal\" data-term=\"Authorization reversal\">authorization reversal\u003c/a> to release a possibly approved authorization when the response is lost. Show the customer a neutral message such as &quot;We're confirming your payment&quot;, and alert when items stay unknown beyond an agreed time. \u003ca href=\"#Payment%20reconciliation\" data-term=\"Payment reconciliation\">Payment reconciliation\u003c/a> is the final safety net.\u003c/p>","avoid":"","usage":["The gateway timed out. Should I show an error so they can try again?","No, it's an unknown payment outcome. Query status by our reference first, because the charge may have gone through."],"out":[2,106,19,111]},{"name":"Payment retry","section":8,"description":"Attempting a failed or uncertain payment again, with rules based on why it failed and network limits on reattempts.","body":"\u003cp>A payment retry is another attempt at a payment that did not succeed or whose result is uncertain. Whether a retry is safe depends on the previous outcome. Retrying the wrong case produces a \u003ca href=\"#Double%20charge\" data-term=\"Double charge\">double charge\u003c/a>, a pointless decline or a network rule breach.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Previous outcome\u003c/th>\u003cth>Action\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#Hard%20decline\" data-term=\"Hard decline\">Hard decline\u003c/a>\u003c/td>\u003ctd>Do not retry the same credential. Ask for another payment method\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Soft%20decline\" data-term=\"Soft decline\">Soft decline\u003c/a>\u003c/td>\u003ctd>Retry later, or after the customer completes the requested step\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Issuer\" data-term=\"Issuer\">Issuer\u003c/a> unavailable\u003c/td>\u003ctd>Retry with backoff, possibly through another route\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Connection failed before sending\u003c/td>\u003ctd>Safe to retry with the same idempotency key\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Timeout or unknown\u003c/td>\u003ctd>Query status first. Retry only if the attempt did not succeed\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>An idempotency key is a unique value that lets a server recognise a repeated request. Reuse it when repeating an attempt after a lost response. A new attempt after a definite decline needs a new key, because the old key would return the old decline.\u003c/p>\u003cp>\u003ca href=\"#Card%20network\" data-term=\"Card network\">Card networks\u003c/a> restrict repeated attempts. Visa groups \u003ca href=\"#Decline%20code\" data-term=\"Decline code\">decline codes\u003c/a> into categories with reattempt rules, and some codes must never be retried. Mastercard returns \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchant\u003c/a> advice codes, such as one telling the merchant not to try again. Limits and fees change, so get the current rules from your \u003ca href=\"#Acquirer\" data-term=\"Acquirer\">acquirer\u003c/a>. Hammering an issuer can also lower your \u003ca href=\"#Authorization%20rate\" data-term=\"Authorization rate\">authorization rate\u003c/a> and resemble \u003ca href=\"#Card%20testing\" data-term=\"Card testing\">card testing\u003c/a>.\u003c/p>\u003cp>\u003ca href=\"#Dunning\" data-term=\"Dunning\">Dunning\u003c/a> is the wider recovery process for failed subscription payments, which schedules retries and contacts the customer.\u003c/p>\u003cp>The common failure comes from generic HTTP retry middleware wrapped around a payment client. It treats a 504 as retryable, sends a fresh request, and charges the customer twice. Remove automatic retries from payment-creating calls and put the decision in code that understands the provider's result. Add exponential backoff with jitter, a maximum attempt count, and a log of every attempt.\u003c/p>","avoid":"","usage":["Should the job retry every declined card overnight?","Only the soft declines. A payment retry on a hard decline breaks network rules and won't succeed anyway."],"out":[106,31,30,2,4,29,1,3,115,55,120]},{"name":"Ledger","section":8,"description":"An append-only record of money movements between accounts, from which balances are derived and audited.","body":"\u003cp>A ledger is an append-only record of every movement of money between accounts. Each posting records the account, amount, currency, direction and a reference to the event that caused it. Balances are computed from those entries, or kept as a cached figure that can be rebuilt from them.\u003c/p>\u003cp>A ledger differs from a \u003ccode>payments\u003c/code> table. The payments table describes the state of a payment attempt and changes over time. The ledger records the financial effect of each step and never changes. A \u003ccode>balance\u003c/code> column on a user row shows a total but cannot explain it, so when a customer asks why their balance is wrong, there is no answer.\u003c/p>\u003cp>Most payment ledgers use \u003ca href=\"#Double-entry%20bookkeeping\" data-term=\"Double-entry bookkeeping\">double-entry bookkeeping\u003c/a>, so each transaction's debits and credits are equal. Amounts are integers in each currency's \u003ca href=\"#Minor%20unit\" data-term=\"Minor unit\">minor unit\u003c/a>.\u003c/p>\u003cp>Entries are never edited or deleted. To correct a mistake, post a reversal and then the correct entry. In this example, a 5000 top-up was recorded instead of 500:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Txn\u003c/th>\u003cth>Reason\u003c/th>\u003cth>Account\u003c/th>\u003cth>Debit\u003c/th>\u003cth>Credit\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Original\u003c/td>\u003ctd>Cash at provider\u003c/td>\u003ctd>5000\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Original\u003c/td>\u003ctd>Customer balance\u003c/td>\u003ctd>\u003c/td>\u003ctd>5000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Reversal of 1\u003c/td>\u003ctd>Customer balance\u003c/td>\u003ctd>5000\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Reversal of 1\u003c/td>\u003ctd>Cash at provider\u003c/td>\u003ctd>\u003c/td>\u003ctd>5000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Correct amount\u003c/td>\u003ctd>Cash at provider\u003c/td>\u003ctd>500\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Correct amount\u003c/td>\u003ctd>Customer balance\u003c/td>\u003ctd>\u003c/td>\u003ctd>500\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>After all three, cash has a net debit of 500 and the customer balance a net credit of 500. The error and its fix both remain visible to auditors.\u003c/p>\u003cp>Enforce the invariants in the database. Reject a transaction whose debits and credits differ per currency, write all of its entries atomically, and use a unique key on the source event so a replayed event cannot post twice. Reconcile it against provider and bank records, because a balanced ledger can still be wrong.\u003c/p>","avoid":"","usage":["Can I just update this customer's balance to fix the mistake?","No. Post a reversal and a correcting entry in the ledger, so the history still adds up."],"out":[110,76]},{"name":"Double-entry bookkeeping","section":8,"description":"Recording every transaction as equal debits and credits across accounts, so that errors show up as an imbalance.","body":"\u003cp>Double-entry bookkeeping is an accounting method in which every transaction is recorded in at least two accounts, with total debits equal to total credits. Money is always shown as coming from somewhere and going somewhere. If the two sides differ, the record is wrong, and the system can detect it.\u003c/p>\u003cp>Debit and credit do not mean minus and plus. Their effect depends on the account type:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Account type\u003c/th>\u003cth>Example\u003c/th>\u003cth>Debit\u003c/th>\u003cth>Credit\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Asset\u003c/td>\u003ctd>Cash, provider receivable\u003c/td>\u003ctd>Increases\u003c/td>\u003ctd>Decreases\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Liability\u003c/td>\u003ctd>Customer balances owed\u003c/td>\u003ctd>Decreases\u003c/td>\u003ctd>Increases\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Revenue\u003c/td>\u003ctd>Sales\u003c/td>\u003ctd>Decreases\u003c/td>\u003ctd>Increases\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Expense\u003c/td>\u003ctd>Processing fees\u003c/td>\u003ctd>Increases\u003c/td>\u003ctd>Decreases\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>This explains a common confusion. When your bank &quot;credits&quot; your account, the bank's liability to you is rising. On your own books, the same cash is an asset and increases with a debit.\u003c/p>\u003cp>Here is a 100.00 sale with a 2.90 processing fee, in \u003ca href=\"#Minor%20unit\" data-term=\"Minor unit\">minor units\u003c/a>:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Account\u003c/th>\u003cth>Type\u003c/th>\u003cth>Debit\u003c/th>\u003cth>Credit\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Provider receivable\u003c/td>\u003ctd>Asset\u003c/td>\u003ctd>9710\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Processing fees\u003c/td>\u003ctd>Expense\u003c/td>\u003ctd>290\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Sales revenue\u003c/td>\u003ctd>Revenue\u003c/td>\u003ctd>\u003c/td>\u003ctd>10000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Total\u003c/strong>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003cstrong>10000\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>10000\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>When the provider pays out, debit bank cash by 9710 and credit the provider receivable by 9710. The receivable returns to zero, showing that nothing is still owed.\u003c/p>\u003cp>A single-column approach would record only +100.00 of sales, and finance would then find the bank deposit 2.90 short on every order. Double entry puts the fee in its own account, so the gap is explained.\u003c/p>\u003cp>Balance each currency separately. A conversion between currencies needs a foreign exchange account in each currency, because 100 EUR and 108 USD cannot be summed. Balanced entries do not prove correctness, since a wrong amount posted to both sides still balances, so the \u003ca href=\"#Ledger\" data-term=\"Ledger\">ledger\u003c/a> must also be reconciled against external records.\u003c/p>","avoid":"","usage":["The \u003ca href=\"#Payout\" data-term=\"Payout\">payout\u003c/a> is lower than sales. Where did the rest go?","Look at the fees account. With double-entry bookkeeping, each sale splits into the receivable and the fee, so the gap is itemised."],"out":[76,109,23]},{"name":"Payment reconciliation","section":8,"description":"Comparing internal payment records with provider and bank records to find and resolve differences.","body":"\u003cp>Payment reconciliation is the process of comparing your own payment records with external records, such as provider reports, a \u003ca href=\"#Settlement%20file\" data-term=\"Settlement file\">settlement file\u003c/a> and bank statements, and resolving every difference. Internal systems can show that a payment succeeded when it did not, or miss one that did. Reconciliation is how a business finds out.\u003c/p>\u003cp>A full reconciliation usually has three layers:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Layer\u003c/th>\u003cth>Compares\u003c/th>\u003cth>Finds\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Internal \u003ca href=\"#Ledger\" data-term=\"Ledger\">ledger\u003c/a> and provider report\u003c/td>\u003ctd>Missing or mismatched transactions\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Provider report and \u003ca href=\"#Payout\" data-term=\"Payout\">payout\u003c/a> total\u003c/td>\u003ctd>Fees, \u003ca href=\"#Refund\" data-term=\"Refund\">refunds\u003c/a> and \u003ca href=\"#Chargeback\" data-term=\"Chargeback\">chargebacks\u003c/a> netted out\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Payout total and bank statement\u003c/td>\u003ctd>Payouts that did not arrive\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>An item that does not match is called a break:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Break\u003c/th>\u003cth>Likely cause\u003c/th>\u003cth>Action\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Provider has it, you don't\u003c/td>\u003ctd>Lost response or event\u003c/td>\u003ctd>Create the record from provider data\u003c/td>\u003c/tr>\u003ctr>\u003ctd>You have it, provider doesn't\u003c/td>\u003ctd>Failed call marked successful\u003c/td>\u003ctd>Correct status, check fulfilment\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Amount differs\u003c/td>\u003ctd>Fee, \u003ca href=\"#Partial%20capture\" data-term=\"Partial capture\">partial capture\u003c/a>, currency\u003c/td>\u003ctd>Post an adjustment\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Timing difference\u003c/td>\u003ctd>Cut-off or time zone\u003c/td>\u003ctd>Expect it to clear in the next run\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The familiar symptom is a payout that does not equal the day's orders. The payout is net of fees, refunds and disputes, and it may span several days under the provider's cut-off. Comparing it directly with a daily sales total will always produce noise.\u003c/p>\u003cp>Match on a stable identifier that you send to the provider and receive back in its reports, and store the provider's own ID too. Run reconciliation automatically every day and track each break's age, because a timing difference clears within days while a real error does not. Fix breaks by posting a new correcting ledger entry, never by editing history. An \u003ca href=\"#Unknown%20payment%20outcome\" data-term=\"Unknown payment outcome\">unknown payment outcome\u003c/a> that was never resolved will often first show up here.\u003c/p>","avoid":"","usage":["The provider's report shows 14 payments that aren't in our database.","Those are payment reconciliation breaks from the event outage. Backfill them from provider data and check they were fulfilled."],"out":[112,109,23,20,60,16,107]},{"name":"Settlement file","section":8,"description":"A report from an acquirer or provider listing transactions, fees and adjustments that make up a payout.","body":"\u003cp>A \u003ca href=\"#Settlement\" data-term=\"Settlement\">settlement\u003c/a> file is a report from an \u003ca href=\"#Acquirer\" data-term=\"Acquirer\">acquirer\u003c/a> or \u003ca href=\"#Payment%20service%20provider\" data-term=\"Payment service provider\">payment service provider\u003c/a> that lists each transaction, fee and adjustment included in a \u003ca href=\"#Payout\" data-term=\"Payout\">payout\u003c/a>. The bank statement usually shows one net deposit. The settlement file explains how that number was reached, so teams use it as the main input to \u003ca href=\"#Payment%20reconciliation\" data-term=\"Payment reconciliation\">payment reconciliation\u003c/a>.\u003c/p>\u003cp>Formats vary by provider and include CSV, fixed-width files, XML and API reports. Typical fields are:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Field\u003c/th>\u003cth>Purpose\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Batch or payout ID\u003c/td>\u003ctd>Ties rows to one bank deposit\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Merchant\" data-term=\"Merchant\">Merchant\u003c/a> reference\u003c/td>\u003ctd>Links a row to your order or payment\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Provider reference\u003c/td>\u003ctd>Provider's own transaction ID\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Type\u003c/td>\u003ctd>Sale, \u003ca href=\"#Refund\" data-term=\"Refund\">refund\u003c/a>, \u003ca href=\"#Chargeback\" data-term=\"Chargeback\">chargeback\u003c/a>, fee or adjustment\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Gross, fee, net\u003c/td>\u003ctd>The amounts for that row\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Currency\u003c/td>\u003ctd>Settlement currency, sometimes also presentment\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Dates\u003c/td>\u003ctd>Transaction date and settlement date\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Rows must add up to the payout. This example uses \u003ca href=\"#Minor%20unit\" data-term=\"Minor unit\">minor units\u003c/a>:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Row type\u003c/th>\u003cth>Net amount\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Sales\u003c/td>\u003ctd>10000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Fees\u003c/td>\u003ctd>-300\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Refunds\u003c/td>\u003ctd>-2000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Chargeback\u003c/td>\u003ctd>-1500\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Payout\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>6200\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A settlement file is not a transaction export from a dashboard. An export shows activity by the time it occurred, while the settlement file groups items by the payout they were paid in. A sale on Friday night may fall into Monday's file because of a cut-off, so comparing it with Friday's orders produces false mismatches.\u003c/p>\u003cp>A provider can resend a corrected file, and if its rows import twice, revenue doubles. A column changes and the parser silently reads the fee as zero. A file arrives late and the reconciliation run reports hundreds of false breaks.\u003c/p>\u003cp>Keep the raw file unchanged, and make the import idempotent using the file identifier and a stable row key. Validate that rows sum to the stated total before accepting the file, and alert when a file is missing or its schema changes.\u003c/p>","avoid":"","usage":["Revenue doubled on Tuesday, but the bank balance didn't.","The provider resent the settlement file and we imported it twice. Dedupe on the row key and rerun."],"out":[22,3,6,23,111,1,20,60,76]},{"name":"Payment routing","section":8,"description":"Choosing which acquirer, network or rail handles a payment, based on cost, approval odds, availability and rules.","body":"\u003cp>Payment routing is the decision about which path a payment takes: which \u003ca href=\"#Acquirer\" data-term=\"Acquirer\">acquirer\u003c/a>, which debit network, or which bank rail. A \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchant\u003c/a> with several providers can route each payment based on the card, country, amount and current performance.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Strategy\u003c/th>\u003cth>Decides by\u003c/th>\u003cth>Trade-off\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Local acquiring\u003c/td>\u003ctd>Matching acquirer to the \u003ca href=\"#Issuer\" data-term=\"Issuer\">issuer\u003c/a>'s country\u003c/td>\u003ctd>Better approvals and lower \u003ca href=\"#Cross-border%20fee\" data-term=\"Cross-border fee\">cross-border fee\u003c/a> costs, more contracts\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Least-cost\u003c/td>\u003ctd>Expected fees\u003c/td>\u003ctd>May lower approval rates\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Performance-based\u003c/td>\u003ctd>Recent \u003ca href=\"#Authorization%20rate\" data-term=\"Authorization rate\">authorization rate\u003c/a>\u003c/td>\u003ctd>Needs volume and monitoring\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Failover\u003c/td>\u003ctd>Provider or route health\u003c/td>\u003ctd>Must handle uncertain outcomes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Rule-based\u003c/td>\u003ctd>Regulation, currency or product\u003c/td>\u003ctd>Rules drift without maintenance\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Routing is the decision. \u003ca href=\"#Payment%20orchestration\" data-term=\"Payment orchestration\">Payment orchestration\u003c/a> is the wider layer that carries it out and also covers integrations, tokens and reporting.\u003c/p>\u003cp>Some routing is shaped by law. In the US, the Durbin Amendment requires debit cards to be enabled on at least two unaffiliated networks, which gives merchants a routing choice. In the EU, the \u003ca href=\"#Interchange%20fee\" data-term=\"Interchange fee\">Interchange Fee\u003c/a> Regulation addresses the choice of brand on co-badged cards.\u003c/p>\u003cp>Failover after a timeout can charge a customer twice. Provider A does not answer, the router sends the same payment to provider B, B approves it, and A's approval then appears. The customer has a \u003ca href=\"#Double%20charge\" data-term=\"Double charge\">double charge\u003c/a>, and an idempotency key cannot prevent it because each provider has its own key space. Fail over only after a definite failure, such as a connection refused before sending or a retryable decline. For a timeout, resolve the first attempt by querying its status.\u003c/p>\u003cp>Stored cards add a constraint. A token issued by one provider usually cannot be charged through another unless you hold portable credentials or \u003ca href=\"#Network%20token\" data-term=\"Network token\">network tokens\u003c/a>. Log the chosen route and reason on every attempt.\u003c/p>","avoid":"","usage":["Provider A timed out, so the router sent it to B. Now the customer has two charges.","Payment routing can't fail over on a timeout. Check A's status first and only reroute if it didn't go through."],"out":[3,1,2,73,115,114,66,106,40]},{"name":"Payment orchestration","section":8,"description":"A software layer connecting a business to several payment providers and methods through one integration.","body":"\u003cp>Payment orchestration is a software layer that connects a business to multiple payment providers, \u003ca href=\"#Acquirer\" data-term=\"Acquirer\">acquirers\u003c/a> and payment methods through one integration. The \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchant\u003c/a>'s checkout calls the orchestration layer, and that layer decides where each payment goes and normalises the responses.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Function\u003c/th>\u003cth>What it does\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Connectors\u003c/td>\u003ctd>Translates one internal API to each provider's API\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Payment%20routing\" data-term=\"Payment routing\">Payment routing\u003c/a>\u003c/td>\u003ctd>Picks a provider per transaction\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Token management\u003c/td>\u003ctd>Stores credentials so they can be used across providers\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Retry and failover\u003c/td>\u003ctd>Applies rules after a failed attempt\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Normalisation\u003c/td>\u003ctd>Maps \u003ca href=\"#Decline%20code\" data-term=\"Decline code\">decline codes\u003c/a> and statuses to one model\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Reporting\u003c/td>\u003ctd>Combines data across providers\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>An orchestrator is often confused with a \u003ca href=\"#Payment%20service%20provider\" data-term=\"Payment service provider\">payment service provider\u003c/a> or \u003ca href=\"#Payment%20gateway\" data-term=\"Payment gateway\">payment gateway\u003c/a>. A PSP has acquiring relationships and processes payments. A gateway transmits payments to a processor. An orchestrator usually sits above them and depends on their contracts, so the merchant typically still needs its own agreement with each provider.\u003c/p>\u003cp>The benefits are redundancy, access to local methods and bargaining power. The layer also adds a network hop and another dependency that can fail, so an orchestrator outage can stop all payments. If it handles raw card data, it also affects \u003ca href=\"#PCI%20DSS\" data-term=\"PCI DSS\">PCI DSS\u003c/a> scope. Normalising responses can hide the detail needed to debug a decline, so keep the raw provider response.\u003c/p>\u003cp>Token ownership often causes problems at migration time. A business adopts multiple providers and finds that its saved cards are tokens owned by the original provider, which cannot be charged elsewhere. Negotiate token portability in advance, or use a neutral \u003ca href=\"#Card%20vault\" data-term=\"Card vault\">card vault\u003c/a> or \u003ca href=\"#Network%20token\" data-term=\"Network token\">network tokens\u003c/a>.\u003c/p>\u003cp>Pass a stable reference from the merchant through the orchestrator to the provider, so that a retry at any level can be recognised. Treat a timeout at any hop as an \u003ca href=\"#Unknown%20payment%20outcome\" data-term=\"Unknown payment outcome\">unknown payment outcome\u003c/a>.\u003c/p>","avoid":"","usage":["Can we just add a second provider if the first goes down?","Only with payment orchestration and portable tokens. Otherwise our saved cards won't work on the second provider."],"out":[3,1,113,29,6,7,37,41,40,107]},{"name":"Authorization rate","section":8,"description":"The share of card authorization attempts that issuers approve, which depends heavily on how attempts are counted.","body":"\u003cp>An authorization rate, also called an approval rate, is the share of \u003ca href=\"#Card%20authorization\" data-term=\"Card authorization\">card authorization\u003c/a> requests that \u003ca href=\"#Issuer\" data-term=\"Issuer\">issuers\u003c/a> approve. Teams use it to judge payment performance. The figure is meaningful only if everyone agrees on what is being counted.\u003c/p>\u003cp>The same traffic can yield different results. This example uses invented figures:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Measure\u003c/th>\u003cth>Approved\u003c/th>\u003cth>Total\u003c/th>\u003cth>Rate\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>All attempts\u003c/td>\u003ctd>850\u003c/td>\u003ctd>1000\u003c/td>\u003ctd>85.0%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Unique payments, final outcome\u003c/td>\u003ctd>830\u003c/td>\u003ctd>900\u003c/td>\u003ctd>92.2%\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The first line counts every retry as a separate attempt. The second counts each payment once, using its final result. Neither is wrong, but comparing one provider's attempt-level figure with another's payment-level figure is misleading. Also decide how to treat zero-amount card checks, fraud blocks made before the issuer is asked, and \u003ca href=\"#3-D%20Secure\" data-term=\"3-D Secure\">3-D Secure\u003c/a> failures.\u003c/p>\u003cp>Authorization rate differs from conversion rate, which measures how many visitors complete checkout and includes people who abandon before paying. It also differs from \u003ca href=\"#Capture\" data-term=\"Capture\">capture\u003c/a> rate, which is how many authorized payments are later captured.\u003c/p>\u003cp>A s
