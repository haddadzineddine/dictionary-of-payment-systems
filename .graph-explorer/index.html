eneric)\u003c/th>\u003cth>Validated PCI P2PE solution\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Independently assessed\u003c/td>\u003ctd>Not necessarily\u003c/td>\u003ctd>Yes, against the P2PE standard\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Listed by PCI SSC\u003c/td>\u003ctd>No\u003c/td>\u003ctd>Yes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Eligible for SAQ P2PE\u003c/td>\u003ctd>No\u003c/td>\u003ctd>Yes, if the merchant meets the criteria\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A retailer buys terminals advertised as end-to-end encrypted and assumes it qualifies for the shorter \u003ca href=\"#Self-assessment%20questionnaire\" data-term=\"Self-assessment questionnaire\">self-assessment questionnaire\u003c/a>. An assessor then finds the solution is not on the PCI list, so the shop's network remains in scope. Check the PCI SSC listing before buying and again at renewal, because a solution whose listing has expired is no longer treated as validated, and the merchant should then ask its \u003ca href=\"#Acquirer\" data-term=\"Acquirer\">acquirer\u003c/a> what applies.\u003c/p>\u003cp>SAQ P2PE covers merchants that take account data only through a validated solution's terminals and have no clear-text account data on their computer systems. It does not apply to e-commerce. The merchant must also follow the solution's instruction manual.\u003c/p>\u003cp>P2PE is different from TLS, the encryption used for web traffic, which protects data between two connected systems. P2PE protects the card data from the terminal itself.\u003c/p>","avoid":"","usage":["The vendor says the terminals are encrypted, so our network is out of scope.","Only if it's a validated P2PE solution. Check that it's listed by PCI SSC."],"out":[1,37,38,3]},{"name":"Hosted payment fields","section":3,"description":"Card inputs served by a payment provider inside a merchant's page, so card data bypasses the merchant's servers.","body":"\u003cp>Hosted payment fields are card input boxes served by a \u003ca href=\"#Payment%20service%20provider\" data-term=\"Payment service provider\">payment service provider\u003c/a> and embedded in a \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchant's\u003c/a> checkout, usually as iframes. An iframe is a small page from another domain displayed inside the main page. The customer appears to type on the merchant's site, but the \u003ca href=\"#PAN\" data-term=\"PAN\">PAN\u003c/a> and \u003ca href=\"#CVV\" data-term=\"CVV\">CVV\u003c/a> go directly from the browser to the provider, which returns a \u003ca href=\"#Tokenization\" data-term=\"Tokenization\">token\u003c/a>.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Step\u003c/th>\u003cth>Who\u003c/th>\u003cth>What happens\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Browser\u003c/td>\u003ctd>Loads the merchant page and the provider's iframes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Customer\u003c/td>\u003ctd>Types card details into the iframes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Provider\u003c/td>\u003ctd>Receives the card data and returns a token\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>Merchant\u003c/td>\u003ctd>Sends the token from its server to create the payment\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The approach sits between two other integration styles.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Integration\u003c/th>\u003cth>Who controls the page\u003c/th>\u003cth>Card data reaches merchant servers?\u003c/th>\u003cth>Common SAQ\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Full redirect\u003c/td>\u003ctd>Provider\u003c/td>\u003ctd>No\u003c/td>\u003ctd>SAQ A\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hosted payment fields\u003c/td>\u003ctd>Merchant, with provider inputs\u003c/td>\u003ctd>No\u003c/td>\u003ctd>SAQ A, if eligible\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Merchant script-built form\u003c/td>\u003ctd>Merchant\u003c/td>\u003ctd>No, but its page handles the data\u003c/td>\u003ctd>SAQ A-EP\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Direct API\u003c/td>\u003ctd>Merchant\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>SAQ D\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Embedded fields do not make the page safe by default. A malicious script on the surrounding page cannot normally read an iframe from another origin, but it could draw a fake form over it or send the customer elsewhere. For this reason, the \u003ca href=\"#PCI%20DSS\" data-term=\"PCI DSS\">PCI DSS\u003c/a> v4.0.1 version of the \u003ca href=\"#Self-assessment%20questionnaire\" data-term=\"Self-assessment questionnaire\">self-assessment questionnaire\u003c/a> SAQ A requires merchants embedding a provider's form to confirm their site is not susceptible to script attacks.\u003c/p>\u003cp>Engineers usually encounter a different failure. A tightened Content Security Policy, the browser rule listing allowed content sources, blocks the provider's domain. The card fields then render blank or the Pay button does nothing, often in production only. Allow the provider's documented domains and test checkout after changing security headers.\u003c/p>","avoid":"","usage":["The card fields are blank in production, but they work locally.","The new CSP is blocking the provider's iframe. Add their domains to frame-src."],"out":[6,1,24,26,39,37,38]},{"name":"3-D Secure","section":3,"description":"A protocol that lets a card issuer authenticate the customer during an online payment, with or without a challenge.","body":"\u003cp>3-D Secure (3DS) is a messaging protocol that lets a card \u003ca href=\"#Issuer\" data-term=\"Issuer\">issuer\u003c/a> authenticate a customer during an online payment. \u003ca href=\"#EMV\" data-term=\"EMV\">EMVCo\u003c/a> publishes the current specification as EMV 3-D Secure, and networks brand their programs, for example Visa Secure and Mastercard Identity Check. The &quot;three domains&quot; are the \u003ca href=\"#Acquirer\" data-term=\"Acquirer\">acquirer\u003c/a> side, the issuer side and the interoperability layer connecting them.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Step\u003c/th>\u003cth>Who\u003c/th>\u003cth>What happens\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\u003ca href=\"#Merchant\" data-term=\"Merchant\">Merchant's\u003c/a> 3DS Server\u003c/td>\u003ctd>Sends transaction and device data\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Directory Server\u003c/td>\u003ctd>Run by the network, routes the request to the issuer\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Access Control Server\u003c/td>\u003ctd>Issuer's system assesses risk\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4a\u003c/td>\u003ctd>Issuer\u003c/td>\u003ctd>Frictionless: authenticates without involving the customer\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4b\u003c/td>\u003ctd>Customer\u003c/td>\u003ctd>Challenge: completes an app approval, passcode or biometric\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Merchant\u003c/td>\u003ctd>Includes the authentication result in the \u003ca href=\"#Card%20authorization\" data-term=\"Card authorization\">card authorization\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Authentication and authorization are separate. 3DS asks &quot;is this the real \u003ca href=\"#Cardholder\" data-term=\"Cardholder\">cardholder\u003c/a>?&quot;. The authorization that follows asks &quot;will the issuer approve this payment?&quot;. A customer can pass a challenge and still be declined for insufficient funds.\u003c/p>\u003cp>3DS is often confused with \u003ca href=\"#Strong%20customer%20authentication\" data-term=\"Strong customer authentication\">strong customer authentication\u003c/a>. SCA is a legal requirement under \u003ca href=\"#PSD2\" data-term=\"PSD2\">PSD2\u003c/a> in the EEA. 3DS is a technical protocol and a common way of meeting that requirement for cards. A frictionless 3DS result is not necessarily SCA, and 3DS is also used in regions with no SCA rule.\u003c/p>\u003cp>3DS also supports a \u003ca href=\"#Liability%20shift\" data-term=\"Liability shift\">liability shift\u003c/a> for fraud, under network rules. Visa's rules, for example, make certain fraud disputes invalid for a transaction authenticated through Visa Secure when the authorization carried the required authentication value and indicator.\u003c/p>\u003cp>A frequent bug is losing that value. The challenge succeeds, but the integration does not pass the authentication data into the authorization, so the issuer sees an unauthenticated payment. It can then return a \u003ca href=\"#Soft%20decline\" data-term=\"Soft decline\">soft decline\u003c/a>, and the merchant loses any fraud protection.\u003c/p>","avoid":"","usage":["The customer passed the 3DS challenge, but we still got a fraud chargeback.","Check the auth request. We dropped the CAVV, so the issuer never saw the authentication."],"out":[2,27,3,1,13,0,45,48,47,30]},{"name":"Strong customer authentication","section":3,"description":"The EU requirement under PSD2 to authenticate payers with two independent factors, for many electronic payments.","body":"\u003cp>Strong customer authentication (SCA) is a legal requirement in the European Economic Area, set by \u003ca href=\"#PSD2\" data-term=\"PSD2\">PSD2\u003c/a>, that a payer be authenticated using at least two independent factors from different categories. Article 4(30) defines the categories, and independence means that compromising one factor does not compromise the others.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Category\u003c/th>\u003cth>Meaning\u003c/th>\u003cth>Examples\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Knowledge\u003c/td>\u003ctd>Something only the user knows\u003c/td>\u003ctd>PIN, password\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Possession\u003c/td>\u003ctd>Something only the user has\u003c/td>\u003ctd>Registered phone, chip card\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Inherence\u003c/td>\u003ctd>Something the user is\u003c/td>\u003ctd>Fingerprint, face\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Article 97 requires a \u003ca href=\"#Payment%20service%20provider\" data-term=\"Payment service provider\">payment service provider\u003c/a> to apply SCA when a payer accesses a payment account online, initiates an electronic payment, or takes a remote action that could carry fraud risk. For remote payments, the authentication must also be dynamically linked to the specific amount and payee. Delegated Regulation (EU) 2018/389 holds the detail, and the UK maintains its own version through the FCA.\u003c/p>\u003cp>SCA is an outcome and \u003ca href=\"#3-D%20Secure\" data-term=\"3-D Secure\">3-D Secure\u003c/a> is a method. For online card payments, 3DS with a challenge is the usual way to meet it.\u003c/p>\u003cp>The obligation falls on the payer's provider, usually the \u003ca href=\"#Issuer\" data-term=\"Issuer\">issuer\u003c/a>, and the \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchant\u003c/a> must support the flow. Under Article 74(2), if the payer's provider does not require SCA, the payer does not bear financial losses unless they acted fraudulently, and a payee or payee's provider that fails to accept SCA must \u003ca href=\"#Refund\" data-term=\"Refund\">refund\u003c/a> the damage caused to the payer's provider.\u003c/p>\u003cp>An \u003ca href=\"#SCA%20exemption\" data-term=\"SCA exemption\">SCA exemption\u003c/a> can remove the step, and purely \u003ca href=\"#Merchant-initiated%20transaction\" data-term=\"Merchant-initiated transaction\">merchant-initiated transactions\u003c/a> and mail or telephone orders are outside the requirement.\u003c/p>\u003cp>The symptom for a merchant is a rise in \u003ca href=\"#Soft%20decline\" data-term=\"Soft decline\">soft declines\u003c/a> from European cards when checkout does not support authentication. Saved-card flows often fail the same way if SCA was not performed when the card was first stored.\u003c/p>","avoid":"","usage":["Why are EU cards failing when our US cards are fine?","Issuers are asking for SCA and our checkout has no 3DS step. We need to add it."],"out":[48,6,44,2,1,20,46,118,30]},{"name":"SCA exemption","section":3,"description":"A condition in EU rules that allows a payment provider not to apply strong customer authentication to a payment.","body":"\u003cp>An SCA exemption is a condition in EU rules that allows a \u003ca href=\"#Payment%20service%20provider\" data-term=\"Payment service provider\">payment service provider\u003c/a> not to apply \u003ca href=\"#Strong%20customer%20authentication\" data-term=\"Strong customer authentication\">strong customer authentication\u003c/a> to a payment. The exemptions are in Chapter III of Commission Delegated Regulation (EU) 2018/389 under \u003ca href=\"#PSD2\" data-term=\"PSD2\">PSD2\u003c/a>. A provider is &quot;allowed not to apply&quot; SCA and is never obliged to skip it. The table lists the main payment exemptions.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Article\u003c/th>\u003cth>Exemption\u003c/th>\u003cth>Applies to\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>11\u003c/td>\u003ctd>Contactless at point of sale\u003c/td>\u003ctd>Small in-person payments, within cumulative limits\u003c/td>\u003c/tr>\u003ctr>\u003ctd>12\u003c/td>\u003ctd>Unattended terminals\u003c/td>\u003ctd>Transport fares and parking fees\u003c/td>\u003c/tr>\u003ctr>\u003ctd>13\u003c/td>\u003ctd>Trusted beneficiaries\u003c/td>\u003ctd>Payees the payer listed with their provider\u003c/td>\u003c/tr>\u003ctr>\u003ctd>14\u003c/td>\u003ctd>Recurring transactions\u003c/td>\u003ctd>Later payments in a series with the same amount and payee\u003c/td>\u003c/tr>\u003ctr>\u003ctd>16\u003c/td>\u003ctd>Low-value transactions\u003c/td>\u003ctd>Small remote payments, within cumulative limits\u003c/td>\u003c/tr>\u003ctr>\u003ctd>17\u003c/td>\u003ctd>Secure corporate payments\u003c/td>\u003ctd>Dedicated non-consumer processes accepted by the regulator\u003c/td>\u003c/tr>\u003ctr>\u003ctd>18\u003c/td>\u003ctd>Transaction risk analysis\u003c/td>\u003ctd>Low-risk remote payments, tied to the provider's fraud rate\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Amount limits are in the regulation and may change.\u003c/p>\u003cp>An exempt payment is covered by SCA rules but relieved of the step, while out-of-scope payments are not covered at all. The EBA and ECB list purely \u003ca href=\"#Merchant-initiated%20transaction\" data-term=\"Merchant-initiated transaction\">merchant-initiated transactions\u003c/a>, mail and telephone orders, and many &quot;one-leg&quot; payments where one provider is outside the EEA as outside SCA.\u003c/p>\u003cp>The \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchant\u003c/a> or \u003ca href=\"#Acquirer\" data-term=\"Acquirer\">acquirer\u003c/a> can request an exemption, but the \u003ca href=\"#Issuer\" data-term=\"Issuer\">issuer\u003c/a> has the final say. An EBA Q&amp;A confirms the issuer can accept an acquirer's risk-analysis exemption, or refuse it and apply SCA. Cumulative counters are invisible to the merchant, so a small payment can still receive a \u003ca href=\"#Soft%20decline\" data-term=\"Soft decline\">soft decline\u003c/a>. Checkout must be able to fall back to \u003ca href=\"#3-D%20Secure\" data-term=\"3-D Secure\">3-D Secure\u003c/a>.\u003c/p>\u003cp>An exempted payment also generally does not get the fraud \u003ca href=\"#Liability%20shift\" data-term=\"Liability shift\">liability shift\u003c/a> that an authenticated one can, although network rules vary.\u003c/p>","avoid":"","usage":["We flagged this as low value, so why did the issuer decline it?","The issuer tracks the cumulative limit and can refuse the exemption. Fall back to 3DS on that code."],"out":[6,45,48,118,1,3,2,30,44,47]},{"name":"Liability shift","section":3,"description":"A network rule moving the cost of certain card fraud from one party to another, usually after chip or 3-D Secure use.","body":"\u003cp>A liability shift is a \u003ca href=\"#Card%20network\" data-term=\"Card network\">card network\u003c/a> rule that moves the cost of certain fraud from one party to another when a security measure was or was not used. It determines whether the \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchant's\u003c/a> side or the \u003ca href=\"#Issuer\" data-term=\"Issuer\">issuer\u003c/a> absorbs the loss on a fraudulent transaction. The two common forms cover chip payments and online authentication.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Type\u003c/th>\u003cth>Where\u003c/th>\u003cth>Who usually bears the fraud\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Chip\u003c/td>\u003ctd>\u003ca href=\"#Card-present%20transaction\" data-term=\"Card-present transaction\">Card-present\u003c/a>, participating regions\u003c/td>\u003ctd>The party that did not support \u003ca href=\"#EMV\" data-term=\"EMV\">EMV\u003c/a> chip\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#3-D%20Secure\" data-term=\"3-D Secure\">3-D Secure\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"#Card-not-present%20transaction\" data-term=\"Card-not-present transaction\">Card-not-present\u003c/a>\u003c/td>\u003ctd>Issuer, where the payment was properly authenticated\u003c/td>\u003c/tr>\u003ctr>\u003ctd>No shift\u003c/td>\u003ctd>Other online payments\u003c/td>\u003ctd>Usually the merchant\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The details are network- and region-specific.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Network\u003c/th>\u003cth>Chip rule\u003c/th>\u003cth>Authentication rule\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Visa\u003c/td>\u003ctd>Dispute Conditions 10.1 and 10.2, with listed regions\u003c/td>\u003ctd>Condition 10.4 invalid for qualifying Visa Secure payments\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Mastercard\u003c/td>\u003ctd>Reason code 4870, chip liability shift\u003c/td>\u003ctd>Reason code 4837 excludes properly authenticated payments\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A common misunderstanding is believing that 3-D Secure stops all \u003ca href=\"#Chargeback\" data-term=\"Chargeback\">chargebacks\u003c/a>. The shift applies to fraud claims. A customer who says goods never arrived or were defective can still dispute an authenticated payment, because that is a consumer dispute.\u003c/p>\u003cp>A shift can also fail for technical reasons. If an integration drops the authentication value from the \u003ca href=\"#Card%20authorization\" data-term=\"Card authorization\">card authorization\u003c/a>, or sends the wrong electronic commerce indicator, the network treats the payment as unauthenticated even though the customer completed a challenge. Network rules also contain exclusions, and an \u003ca href=\"#SCA%20exemption\" data-term=\"SCA exemption\">SCA exemption\u003c/a> generally leaves liability where it was.\u003c/p>\u003cp>This contractual shift is different from the legal allocation under \u003ca href=\"#PSD2\" data-term=\"PSD2\">PSD2\u003c/a>. Article 74(2) says that a payee or payee's provider that fails to accept \u003ca href=\"#Strong%20customer%20authentication\" data-term=\"Strong customer authentication\">strong customer authentication\u003c/a> must \u003ca href=\"#Refund\" data-term=\"Refund\">refund\u003c/a> the financial damage caused to the payer's provider.\u003c/p>\u003cp>Store the authentication result on each payment so it can be used as evidence in \u003ca href=\"#Representment\" data-term=\"Representment\">representment\u003c/a>.\u003c/p>","avoid":"","usage":["We used 3DS on that order, so why are we losing this chargeback?","It's a not-received dispute. The liability shift only covers fraud claims."],"out":[4,1,2,53,27,44,54,60,13,46,48,45,20,62]},{"name":"PSD2","section":3,"description":"The EU Payment Services Directive (EU) 2015/2366, which regulates payment providers and requires strong authentication.","body":"\u003cp>PSD2 is the EU's second Payment Services Directive, formally Directive (EU) 2015/2366. It sets the rules for who may provide payment services in the EU and European Economic Area, what those providers owe their customers, and how payments must be secured. It takes effect through each member state's national law, so details differ by country.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Area\u003c/th>\u003cth>What PSD2 does\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Licensing\u003c/td>\u003ctd>Defines payment services and who must be authorised to provide them\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Security\u003c/td>\u003ctd>Requires \u003ca href=\"#Strong%20customer%20authentication\" data-term=\"Strong customer authentication\">strong customer authentication\u003c/a> (SCA) in Article 97\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Customer rights\u003c/td>\u003ctd>Sets \u003ca href=\"#Refund\" data-term=\"Refund\">refund\u003c/a> and liability rules for unauthorised payments\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Third-party access\u003c/td>\u003ctd>Creates regulated access to accounts, the basis of EU \u003ca href=\"#Open%20banking\" data-term=\"Open banking\">open banking\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Detailed security rules are in a separate, directly applicable law, Commission Delegated Regulation (EU) 2018/389. SCA is one part of PSD2, and \u003ca href=\"#3-D%20Secure\" data-term=\"3-D Secure\">3-D Secure\u003c/a> is a technical protocol the directive does not name.\u003c/p>\u003cp>When both the payer's and payee's providers are in the EEA, SCA generally applies. When only one is, the payment is a &quot;one-leg&quot; transaction. A Commission answer published by the European Banking Authority says that an \u003ca href=\"#Acquirer\" data-term=\"Acquirer\">acquirer\u003c/a> outside the EU is not subject to PSD2, and the EU \u003ca href=\"#Issuer\" data-term=\"Issuer\">issuer\u003c/a> must decide whether to block such a payment or carry the liability. A non-EU \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchant\u003c/a> selling to Europeans may therefore see \u003ca href=\"#Soft%20decline\" data-term=\"Soft decline\">soft declines\u003c/a> despite having no direct PSD2 obligations.\u003c/p>\u003cp>The UK implemented PSD2 before leaving the EU and now maintains its own rules through the FCA.\u003c/p>\u003cp>A replacement is in progress. The EU reached a provisional agreement in November 2025 on a Payment Services Regulation and a third directive, PSD3. As of November 2026, Parliament's procedure files list both as awaiting a second-reading vote, with no Official Journal publication. Until the new laws apply, PSD2 remains in force.\u003c/p>","avoid":"","usage":["We're a US company. Why does PSD2 affect our checkout?","Our customers' banks are in the EU, so they may still ask for SCA. Add 3DS for those cards."],"out":[45,20,93,44,3,2,1,30]},{"name":"KYC","section":3,"description":"Know Your Customer, the checks regulated firms use to identify and verify the people they do business with.","body":"\u003cp>KYC, or Know Your Customer, is the process a regulated firm uses to identify a customer, verify that identity, and understand the purpose of the relationship. It is part of \u003ca href=\"#AML\" data-term=\"AML\">AML\u003c/a> compliance. In a payments company, KYC normally applies when opening an account, and again when something about the customer or their activity changes.\u003c/p>\u003cp>International standards come from the Financial Action Task Force (FATF), whose Recommendation 10 sets out customer due diligence. Actual obligations come from national or regional law, so they depend on the firm's licence and location.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Region\u003c/th>\u003cth>Main source\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>EU\u003c/td>\u003ctd>National laws implementing the AML directives. Regulation (EU) 2024/1624 applies generally from 10 July 2027\u003c/td>\u003c/tr>\u003ctr>\u003ctd>US\u003c/td>\u003ctd>Bank Secrecy Act rules, including customer identification programs for banks\u003c/td>\u003c/tr>\u003ctr>\u003ctd>UK\u003c/td>\u003ctd>Money Laundering Regulations\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A typical KYC flow has several steps.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Step\u003c/th>\u003cth>What happens\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Collect\u003c/td>\u003ctd>Name, date of birth, address, identity document\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Verify\u003c/td>\u003ctd>Check the document or data against reliable sources\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Screen\u003c/td>\u003ctd>Run \u003ca href=\"#Sanctions%20screening\" data-term=\"Sanctions screening\">sanctions screening\u003c/a> and politically-exposed-person checks\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Assess\u003c/td>\u003ctd>Assign a risk level\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Monitor\u003c/td>\u003ctd>Review activity and refresh information over time\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>KYC concerns individuals, while \u003ca href=\"#KYB\" data-term=\"KYB\">KYB\u003c/a> applies similar checks to businesses and their owners. It is also separate from authentication: KYC establishes who a customer is at onboarding, whereas \u003ca href=\"#Strong%20customer%20authentication\" data-term=\"Strong customer authentication\">strong customer authentication\u003c/a> checks that the person making a payment is that customer.\u003c/p>\u003cp>Users experience KYC as friction. A wallet asks for a passport before raising a limit, a selfie check rejects a valid document, or an account is restricted because details need renewing. Engineers should model verification as a set of states, such as pending, verified, rejected and needs refresh. A single boolean cannot represent an expired document or a re-review.\u003c/p>\u003cp>Treat identity documents as highly sensitive personal data, and keep them out of support tools and logs.\u003c/p>","avoid":"","usage":["Why can't this user withdraw? Their balance is fine.","Their KYC expired when the ID document lapsed. They need to re-verify before we can release payouts."],"out":[51,52,50,45]},{"name":"KYB","section":3,"description":"Know Your Business, the checks used to verify a company, its ownership and the people who control it.","body":"\u003cp>KYB, or Know Your Business, is the process of verifying a business customer: that it legally exists, what it does, who owns it and who controls it. Banks, \u003ca href=\"#Acquirer\" data-term=\"Acquirer\">acquirers\u003c/a> and \u003ca href=\"#Payment%20facilitator\" data-term=\"Payment facilitator\">payment facilitators\u003c/a> run KYB before letting a company accept or move money, as part of their \u003ca href=\"#AML\" data-term=\"AML\">AML\u003c/a> and risk controls.\u003c/p>\u003cp>The difficult part is identifying beneficial owners, the natural persons who ultimately own or control a company. FATF standards and Regulation (EU) 2024/1624 both require firms to identify beneficial owners and understand the ownership and control structure. In the US, FinCEN's customer due diligence rule sets beneficial ownership requirements for covered financial institutions, and FinCEN proposed changes to it in November 2026. Ownership thresholds and methods differ by jurisdiction.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Check\u003c/th>\u003cth>Question\u003c/th>\u003cth>Typical evidence\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Legal entity\u003c/td>\u003ctd>Does the company exist?\u003c/td>\u003ctd>Registry extract, tax number\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Business model\u003c/td>\u003ctd>What does it actually sell?\u003c/td>\u003ctd>Website, invoices, description\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ownership\u003c/td>\u003ctd>Who ultimately owns it?\u003c/td>\u003ctd>Shareholder register, group chart\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Control\u003c/td>\u003ctd>Who runs it?\u003c/td>\u003ctd>Director list, officer details\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Individuals\u003c/td>\u003ctd>Are those people who they say?\u003c/td>\u003ctd>\u003ca href=\"#KYC\" data-term=\"KYC\">KYC\u003c/a> on owners and directors\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Screening\u003c/td>\u003ctd>Is anyone restricted?\u003c/td>\u003ctd>\u003ca href=\"#Sanctions%20screening\" data-term=\"Sanctions screening\">Sanctions screening\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>For a \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchant\u003c/a>, KYB also covers commercial risk: \u003ca href=\"#Refund\" data-term=\"Refund\">refund\u003c/a> policy, delivery times and whether the product fits its \u003ca href=\"#Merchant%20category%20code\" data-term=\"Merchant category code\">merchant category code\u003c/a>.\u003c/p>\u003cp>The failure businesses feel is a hold on funds. Many platforms allow a new seller to begin processing after basic checks, then request full documents once volume grows. If the seller does not respond, or a new investor changes the ownership, the \u003ca href=\"#Payout\" data-term=\"Payout\">payout\u003c/a> can be paused until the review is complete.\u003c/p>\u003cp>Ownership and directors change, so records need periodic and event-driven review. Engineers should store ownership as a graph or linked records, since a flat field for &quot;owner&quot; cannot represent a chain of holding companies.\u003c/p>","avoid":"","usage":["This seller's payout has been on hold since their funding round.","The cap table changed. We need updated beneficial owner details before KYB can clear."],"out":[3,9,51,49,52,1,20,32,23]},{"name":"AML","section":3,"description":"Anti-money laundering, the laws and controls for detecting and reporting attempts to disguise the origin of criminal funds.","body":"\u003cp>AML, or anti-money laundering, is the set of laws and internal controls that regulated firms use to detect, prevent and report attempts to pass off criminal money as legitimate. The FATF Recommendations set the international standard, and each country turns them into binding law.\u003c/p>\u003cp>A program usually has these parts.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Control\u003c/th>\u003cth>What it does\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Risk assessment\u003c/td>\u003ctd>Identifies which products, customers and countries carry most risk\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Customer due diligence\u003c/td>\u003ctd>\u003ca href=\"#KYC\" data-term=\"KYC\">KYC\u003c/a> for people and \u003ca href=\"#KYB\" data-term=\"KYB\">KYB\u003c/a> for businesses\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Transaction monitoring\u003c/td>\u003ctd>Flags activity that does not fit the customer's profile\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Investigation\u003c/td>\u003ctd>Analysts review alerts and record decisions\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Reporting\u003c/td>\u003ctd>Files suspicious activity reports with the national authority\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Record keeping\u003c/td>\u003ctd>Retains evidence for a legally required period\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>AML differs from fraud prevention, though the tools overlap. Fraud controls protect the firm and its customers from being robbed. AML looks for customers who may be successfully moving their own illicit funds, where nobody complains. \u003ca href=\"#Sanctions%20screening\" data-term=\"Sanctions screening\">Sanctions screening\u003c/a> is also distinct: it checks whether dealing with a party is prohibited at all.\u003c/p>\u003cp>Warning patterns include activity far above a customer's stated business, funds moving in and immediately back out, and payments split to stay under reporting limits. A \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchant\u003c/a> account processing payments unrelated to its declared business can indicate transaction laundering, where one business runs card payments for another, undisclosed one.\u003c/p>\u003cp>The symptom for customers is an unexplained restriction. Support cannot say why, and this is often deliberate. Laws in many jurisdictions prohibit &quot;tipping off&quot;, meaning telling someone that a suspicious activity report has been filed or is being considered. Engineers should therefore keep case details out of customer-facing logs and support tools, and give agents an approved neutral script.\u003c/p>\u003cp>Record each alert, the analyst's decision and the reasoning, since regulators may ask to see that trail.\u003c/p>","avoid":"","usage":["A customer is demanding to know why their account is restricted. What can I say?","Use the standard compliance script. Don't speculate, and don't mention any AML review."],"out":[49,50,52,1]},{"name":"Sanctions screening","section":3,"description":"Checking customers and payments against government sanctions lists to stop prohibited dealings.","body":"\u003cp>Sanctions screening is the process of checking customers, counterparties and payments against government sanctions lists to avoid prohibited dealings. Common sources include the US Treasury's Office of Foreign Assets Control (OFAC), the EU consolidated list, the UK's sanctions list and United Nations lists. Which regimes bind a firm depends on its location, nationality and partners.\u003c/p>\u003cp>Screening usually happens at several points.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Point\u003c/th>\u003cth>What is checked\u003c/th>\u003cth>Example result\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Onboarding\u003c/td>\u003ctd>Customer, directors and beneficial owners\u003c/td>\u003ctd>Account opening is paused\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ongoing\u003c/td>\u003ctd>Existing customers against updated lists\u003c/td>\u003ctd>Account is restricted\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Transaction\u003c/td>\u003ctd>Payer, payee, banks, countries and payment text\u003c/td>\u003ctd>Payment is held for review\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003ca href=\"#AML\" data-term=\"AML\">AML\u003c/a> is largely risk-based and focuses on suspicious behaviour. A sanctions prohibition can apply regardless of behaviour, and OFAC can impose civil penalties on a strict liability basis, meaning a firm can be liable even if it did not know a transaction was prohibited. Some regimes extend to entities owned or controlled by a listed person, so combine screening with \u003ca href=\"#KYB\" data-term=\"KYB\">KYB\u003c/a> ownership data.\u003c/p>\u003cp>Under US rules, some property must be blocked, meaning frozen and reported, while other prohibited transactions are rejected and returned. Returning funds that should have been blocked can itself be a violation. Compliance teams, and not application code, should decide which outcome applies.\u003c/p>\u003cp>The main operational problem is false positives. Names are transliterated in different ways and many people share them, so screening uses fuzzy matching. A customer named similarly to a listed person may find a \u003ca href=\"#Payout\" data-term=\"Payout\">payout\u003c/a> or payment held until an analyst clears the alert.\u003c/p>\u003cp>Engineers should rescreen when lists change, version the list used for each decision, and fail closed if the screening service is unavailable on flows that require it. Record who cleared each alert and why.\u003c/p>","avoid":"","usage":["Why is this payout stuck in review? The seller's been with us for years.","Their name partly matched a new sanctions listing. Compliance has to clear the alert before it can go out."],"out":[51,50,23]},{"name":"Card-present transaction","section":4,"description":"A card payment where the card and cardholder are physically at the terminal, typically by chip or contactless.","body":"\u003cp>A card-present transaction is a payment in which the card and \u003ca href=\"#Cardholder\" data-term=\"Cardholder\">cardholder\u003c/a> are physically at the point of sale. Visa's rules call this a Card-Present Environment, and define it by both being present at the \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchant's\u003c/a> premises or a similar acceptance point.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Entry method\u003c/th>\u003cth>How data is captured\u003c/th>\u003cth>Fraud protection\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Chip\u003c/td>\u003ctd>Card generates a cryptogram\u003c/td>\u003ctd>Strong against counterfeit cards\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Contactless card\u003c/td>\u003ctd>Card generates a cryptogram\u003c/td>\u003ctd>Strong against counterfeit cards\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Mobile wallet tap\u003c/td>\u003ctd>Device presents a \u003ca href=\"#Network%20token\" data-term=\"Network token\">network token\u003c/a>\u003c/td>\u003ctd>Token and device authentication\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Magnetic stripe\u003c/td>\u003ctd>Static data read from the stripe\u003c/td>\u003ctd>Weak, data can be copied\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Key-entered at terminal\u003c/td>\u003ctd>Staff type the number\u003c/td>\u003ctd>Weak, may lose card-present treatment\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The contrast is with a \u003ca href=\"#Card-not-present%20transaction\" data-term=\"Card-not-present transaction\">card-not-present transaction\u003c/a>, where no terminal reads the card. Because an \u003ca href=\"#EMV\" data-term=\"EMV\">EMV\u003c/a> chip proves the card is genuine, card-present payments generally carry lower fraud risk, and pricing often reflects that.\u003c/p>\u003cp>The classification comes from data in the \u003ca href=\"#Card%20authorization\" data-term=\"Card authorization\">card authorization\u003c/a> message, such as point-of-sale entry mode. It is not inferred from where the merchant is. A card number keyed in after a chip failure may cost more and give the merchant weaker evidence in a dispute. If a chip card is swiped or keyed where the \u003ca href=\"#Liability%20shift\" data-term=\"Liability shift\">liability shift\u003c/a> applies, the merchant can be liable for counterfeit fraud.\u003c/p>\u003cp>Physical presence does not rule out all fraud. A lost or stolen card can be used in person, particularly for low-value contactless payments that do not ask for a PIN. Under EU rules, the contactless \u003ca href=\"#SCA%20exemption\" data-term=\"SCA exemption\">SCA exemption\u003c/a> has cumulative limits, so a terminal may occasionally ask a customer to insert the card and enter a PIN.\u003c/p>","avoid":"","usage":["The terminal asked her for a PIN on a tiny coffee payment. Is it broken?","No. She hit the contactless limit on that card, so the issuer wants a chip and PIN."],"out":[0,1,40,54,27,13,47,46]},{"name":"Card-not-present transaction","section":4,"description":"A card payment made without the physical card at a terminal, such as online, in an app or by phone.","body":"\u003cp>A card-not-present (CNP) transaction is a payment made without the card being read by a terminal, typically online, in an app, by phone or by mail order. Visa's rules call this a Card-Absent Environment. Because no chip takes part, the \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchant\u003c/a> has to rely on other signals that the person paying is the real \u003ca href=\"#Cardholder\" data-term=\"Cardholder\">cardholder\u003c/a>.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Property\u003c/th>\u003cth>\u003ca href=\"#Card-present%20transaction\" data-term=\"Card-present transaction\">Card-present\u003c/a>\u003c/th>\u003cth>Card-not-present\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Card verification\u003c/td>\u003ctd>\u003ca href=\"#EMV\" data-term=\"EMV\">EMV\u003c/a> chip cryptogram\u003c/td>\u003ctd>\u003ca href=\"#CVV\" data-term=\"CVV\">CVV\u003c/a>, \u003ca href=\"#Network%20token\" data-term=\"Network token\">network token\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Customer check\u003c/td>\u003ctd>PIN or device, where required\u003c/td>\u003ctd>\u003ca href=\"#3-D%20Secure\" data-term=\"3-D Secure\">3-D Secure\u003c/a>, account signals\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Address check\u003c/td>\u003ctd>Not usually relevant\u003c/td>\u003ctd>\u003ca href=\"#Address%20verification\" data-term=\"Address verification\">Address verification\u003c/a>, where supported\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Fraud liability\u003c/td>\u003ctd>Depends on chip support\u003c/td>\u003ctd>Often the merchant, unless authenticated\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The main risk is stolen card details. Data taken in a breach, by phishing or by skimming code on a checkout page can be used remotely without the physical card. For this reason, fraud \u003ca href=\"#Chargeback\" data-term=\"Chargeback\">chargebacks\u003c/a> concentrate in this channel, and network monitoring focuses on it. Visa's \u003ca href=\"#Chargeback%20ratio\" data-term=\"Chargeback ratio\">chargeback ratio\u003c/a> under its Acquirer Monitoring Program, for example, is based on card-not-present activity.\u003c/p>\u003cp>Controls work best in layers, combining authentication, \u003ca href=\"#Velocity%20check\" data-term=\"Velocity check\">velocity checks\u003c/a>, device data and \u003ca href=\"#Risk%20scoring\" data-term=\"Risk scoring\">risk scoring\u003c/a>. Applying 3-D Secure can provide a \u003ca href=\"#Liability%20shift\" data-term=\"Liability shift\">liability shift\u003c/a> on qualifying fraud claims.\u003c/p>\u003cp>Regulation differs by channel. Under \u003ca href=\"#PSD2\" data-term=\"PSD2\">PSD2\u003c/a>, remote electronic payments generally need \u003ca href=\"#Strong%20customer%20authentication\" data-term=\"Strong customer authentication\">strong customer authentication\u003c/a>, with dynamic linking to the amount and payee. Mail and telephone orders are treated as outside that requirement, so correctly flagging them matters. Marking ordinary web payments as telephone orders to avoid authentication misrepresents the transaction and can breach network rules.\u003c/p>\u003cp>CNP data handling also has consequences for compliance. Card entry through \u003ca href=\"#Hosted%20payment%20fields\" data-term=\"Hosted payment fields\">hosted payment fields\u003c/a> can reduce \u003ca href=\"#PCI%20DSS\" data-term=\"PCI DSS\">PCI DSS\u003c/a> scope. Phone payments can bring call recordings into scope.\u003c/p>","avoid":"","usage":["Fraud is only showing up on the website, never in our stores.","That's expected. Online is card-not-present, so there's no chip. Turn on 3DS for the risky orders."],"out":[1,0,53,27,26,40,44,36,60,65,58,59,47,48,45,43,37]},{"name":"Card testing","section":4,"description":"Automated use of a merchant's checkout to find which stolen card details work, seen as bursts of small failed payments.","body":"\u003cp>Card testing is a fraud attack in which criminals use a \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchant's\u003c/a> payment flow to find out which stolen or generated card details are valid. Visa calls the wider activity account enumeration. The checkout is used as a validity check, and working cards are used or sold elsewhere.\u003c/p>\u003cp>The usual sign is a sudden burst of \u003ca href=\"#Card%20authorization\" data-term=\"Card authorization\">card authorization\u003c/a> attempts, many of them declined, often for small amounts and often outside business hours.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Signal\u003c/th>\u003cth>Where to look\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Spike in authorization attempts\u003c/td>\u003ctd>Provider dashboard, API metrics\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Sharp fall in \u003ca href=\"#Authorization%20rate\" data-term=\"Authorization rate\">authorization rate\u003c/a>\u003c/td>\u003ctd>Payment monitoring\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Many different cards from one device, IP or session\u003c/td>\u003ctd>Checkout and fraud logs\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Many cards sharing a \u003ca href=\"#BIN\" data-term=\"BIN\">BIN\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"#Decline%20code\" data-term=\"Decline code\">Decline code\u003c/a> reports\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Repeated \u003ca href=\"#CVV\" data-term=\"CVV\">CVV\u003c/a> or expiry failures\u003c/td>\u003ctd>Authorization responses\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Unusual activity on add-card or donation pages\u003c/td>\u003ctd>Endpoint metrics\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The cost falls on the merchant in several ways: authorization fees, a damaged reputation with \u003ca href=\"#Issuer\" data-term=\"Issuer\">issuers\u003c/a>, later \u003ca href=\"#Chargeback\" data-term=\"Chargeback\">chargebacks\u003c/a> on successful attempts, and holds on real customers' cards. Visa's monitoring program, VAMP, includes a separate enumeration measure, so sustained attacks can bring network attention to the merchant and its \u003ca href=\"#Acquirer\" data-term=\"Acquirer\">acquirer\u003c/a>.\u003c/p>\u003cp>Visa's guidance for merchants recommends layered controls.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Control\u003c/th>\u003cth>Effect\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>CAPTCHA on every card-validating request\u003c/td>\u003ctd>Slows automated traffic\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Velocity%20check\" data-term=\"Velocity check\">Velocity checks\u003c/a>\u003c/td>\u003ctd>Limits attempts per card, device, IP, account\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Required CVV and \u003ca href=\"#Address%20verification\" data-term=\"Address verification\">address verification\u003c/a>\u003c/td>\u003ctd>Adds checks on entry\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Protect add-card and save-card flows\u003c/td>\u003ctd>Closes commonly overlooked endpoints\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Rotate API keys if abused\u003c/td>\u003ctd>Cuts off stolen credentials\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>During an active attack, block the traffic quickly and tell your provider or acquirer. Reverse approved test payments with an \u003ca href=\"#Authorization%20reversal\" data-term=\"Authorization reversal\">authorization reversal\u003c/a>, or \u003ca href=\"#Refund\" data-term=\"Refund\">refund\u003c/a> them if already captured, because those \u003ca href=\"#Cardholder\" data-term=\"Cardholder\">cardholders\u003c/a> did not make them.\u003c/p>\u003cp>Keep customer-facing error messages generic, so the checkout does not reveal which card field failed.\u003c/p>","avoid":"","usage":["We just had 4,000 one-dollar auths in twenty minutes, nearly all declined.","That's card testing. Turn on the CAPTCHA, rate-limit the endpoint and tell the acquirer."],"out":[1,13,115,25,29,26,2,60,3,58,36,19,20,0]},{"name":"Account takeover","section":4,"description":"Fraud in which a criminal gains access to a real customer's account and uses its saved payment methods or balance.","body":"\u003cp>Account takeover (ATO) is fraud in which a criminal gains access to a genuine customer's account and acts as that customer. In a payments context, the attacker uses saved cards, spends a stored balance, redirects a \u003ca href=\"#Payout\" data-term=\"Payout\">payout\u003c/a>, or changes contact details to lock out the owner. Access commonly comes from reused passwords leaked elsewhere, phishing or malware on the customer's device.\u003c/p>\u003cp>ATO differs from stolen-card fraud. With a stolen card, the fraudster brings a card to a new account. With ATO, the account, the card on file and the purchase history all look legitimate, so payment signals such as a passing \u003ca href=\"#CVV\" data-term=\"CVV\">CVV\u003c/a> or a known card reveal little. Detection has to focus on the session and the account's behaviour.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Warning sign\u003c/th>\u003cth>Why it matters\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Login from a new device or unusual location\u003c/td>\u003ctd>Possible credential use\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Many failed logins across accounts from one source\u003c/td>\u003ctd>Automated password testing against the site\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Password reset followed quickly by a purchase\u003c/td>\u003ctd>Attacker securing access\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Email, phone or payout details changed\u003c/td>\u003ctd>Locks out the owner or redirects funds\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The real \u003ca href=\"#Cardholder\" data-term=\"Cardholder\">cardholder\u003c/a> then disputes the charges, so the \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchant\u003c/a> receives a fraud \u003ca href=\"#Chargeback\" data-term=\"Chargeback\">chargeback\u003c/a> on what looked like a loyal customer's order.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Control\u003c/th>\u003cth>Purpose\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Multi-factor authentication\u003c/td>\u003ctd>Stolen password alone is not enough\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Breached-password checks\u003c/td>\u003ctd>Blocks known leaked credentials\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Login rate limits and \u003ca href=\"#Velocity%20check\" data-term=\"Velocity check\">velocity checks\u003c/a>\u003c/td>\u003ctd>Slows automated attempts\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Step-up on sensitive changes\u003c/td>\u003ctd>Reconfirms before payout or email edits\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Notify the old email or phone of changes\u003c/td>\u003ctd>Lets the real owner react\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Delay payouts after bank detail changes\u003c/td>\u003ctd>Gives time to catch a redirect\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>When ATO is confirmed, revoke all sessions and API tokens, reset credentials, reverse attacker changes, and review recent orders and payouts.\u003c/p>","avoid":"","usage":["This customer's been with us five years, and suddenly three orders shipped to a new address.","Password reset an hour earlier from a new device. Looks like account takeover, so lock it and hold the orders."],"out":[23,26,0,1,60,58]},{"name":"Friendly fraud","section":4,"description":"A chargeback on a genuine purchase, raised by mistake or dishonestly by the cardholder or someone they know.","body":"\u003cp>Friendly fraud is a \u003ca href=\"#Chargeback\" data-term=\"Chargeback\">chargeback\u003c/a> raised on a genuine purchase, where the \u003ca href=\"#Cardholder\" data-term=\"Cardholder\">cardholder\u003c/a> or someone connected to them received the goods or service. The name is misleading because many cases are not deliberate. Visa uses the more neutral term first-party misuse for cardholders reporting fraud on transactions they actually made.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Cause\u003c/th>\u003cth>Example\u003c/th>\u003cth>Deliberate?\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Unrecognised charge\u003c/td>\u003ctd>Unclear \u003ca href=\"#Statement%20descriptor\" data-term=\"Statement descriptor\">statement descriptor\u003c/a>\u003c/td>\u003ctd>No\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Family use\u003c/td>\u003ctd>A child buys in-game currency on a parent's card\u003c/td>\u003ctd>Usually no\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Forgotten subscription\u003c/td>\u003ctd>Renewal the customer forgot about\u003c/td>\u003ctd>Usually no\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Refund\" data-term=\"Refund\">Refund\u003c/a> shortcut\u003c/td>\u003ctd>Customer calls the bank instead of the \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchant\u003c/a>\u003c/td>\u003ctd>Mixed\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Buyer's remorse\u003c/td>\u003ctd>Customer keeps the item and claims fraud\u003c/td>\u003ctd>Yes\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>It differs from true third-party fraud, where a stranger used stolen card details. The two look identical to the merchant at first because both typically arrive under a fraud \u003ca href=\"#Dispute%20reason%20code\" data-term=\"Dispute reason code\">dispute reason code\u003c/a>. Do not assume dishonesty.\u003c/p>\u003cp>Use a descriptor customers recognise, send clear receipts, remind customers before a renewal, make cancelling easy, and offer a visible refund route so that contacting support is easier than calling the bank.\u003c/p>\u003cp>When a dispute arrives, the merchant can contest it through \u003ca href=\"#Representment\" data-term=\"Representment\">representment\u003c/a> with evidence that the cardholder took part. Visa's Compelling Evidence 3.0, under Dispute Condition 10.4, lets a merchant use matching data from earlier undisputed transactions on the same card, such as IP address or device ID, when specific conditions are met. Those conditions change, so check the current Visa rules. Mastercard has its own evidence requirements for its fraud-related chargebacks.\u003c/p>\u003cp>To be usable, the evidence must be collected at purchase time. Log device, IP, account and delivery data against each order, within applicable privacy law. Each dispute also adds to the merchant's \u003ca href=\"#Chargeback%20ratio\" data-term=\"Chargeback ratio\">chargeback ratio\u003c/a>.\u003c/p>","avoid":"","usage":["He says he never bought it, but he's played the game on that account for two years.","Looks like friendly fraud. Pull the device and IP history and see whether it qualifies for CE 3.0."],"out":[60,0,35,20,1,64,62,65]},{"name":"Velocity check","section":4,"description":"A fraud control that counts events per card, device, IP or account in a time window and reacts when a limit is exceeded.","body":"\u003cp>A velocity check is a fraud control that counts how many times something happens within a time window and acts when the count exceeds a limit. In payments, it might count attempts per card in ten minutes, or the number of different cards used by one device in an hour. It is used against automated attacks such as \u003ca href=\"#Card%20testing\" data-term=\"Card testing\">card testing\u003c/a> and \u003ca href=\"#Account%20takeover\" data-term=\"Account takeover\">account takeover\u003c/a>.\u003c/p>\u003cp>A rule has four parts.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Part\u003c/th>\u003cth>Options\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Key\u003c/td>\u003ctd>Card fingerprint, device, IP, account, email, \u003ca href=\"#BIN\" data-term=\"BIN\">BIN\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Event\u003c/td>\u003ctd>Attempt, decline, approval, new card added, login, \u003ca href=\"#Refund\" data-term=\"Refund\">refund\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Window\u003c/td>\u003ctd>Minutes, hours or days\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Action\u003c/td>\u003ctd>Allow, add friction, send to review, block\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Different keys catch different patterns.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Pattern\u003c/th>\u003cth>Useful count\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>One card tried repeatedly\u003c/td>\u003ctd>Attempts per card\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Many cards from one source\u003c/td>\u003ctd>Distinct cards per device, IP or session\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Stolen list spread across IPs\u003c/td>\u003ctd>Declines per \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchant\u003c/a>, overall or by BIN\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Reused accounts\u003c/td>\u003ctd>Failed logins per account or per source\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Limits should be based on your own traffic, because a normal pattern for a ticketing site at launch time would look like an attack for a furniture store. Test rules in log-only mode first.\u003c/p>\u003cp>The common failure is blocking legitimate customers. Offices, universities and mobile carriers put many users behind one IP address, so a strict per-IP limit can stop everyone at that location. Combine keys, prefer a step-up such as \u003ca href=\"#3-D%20Secure\" data-term=\"3-D Secure\">3-D Secure\u003c/a> over an outright block where possible.\u003c/p>\u003cp>Implementation has its own traps. A counter that reads and then writes separately can undercount under concurrency, so use an atomic increment in a store such as Redis. Avoid using a raw \u003ca href=\"#PAN\" data-term=\"PAN\">PAN\u003c/a> as a key, since that places the counter store in \u003ca href=\"#PCI%20DSS\" data-term=\"PCI DSS\">PCI DSS\u003c/a> scope. Use the provider's card fingerprint or a token.\u003c/p>","avoid":"","usage":["The whole university campus is getting blocked at checkout.","Our IP velocity rule is too tight. Key it on device plus distinct cards instead."],"out":[55,56,25,20,1,44,24,37]},{"name":"Risk scoring","section":4,"description":"Assigning a payment a score estimating its fraud risk, used to approve it, add authentication, review or block it.","body":"\u003cp>Risk scoring assigns a transaction, account or event a value that estimates how likely it is to be fraudulent. A system then uses the score to choose an action. Scores may come from rules, machine-learning models or both, and several parties can compute them independently.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Party\u003c/th>\u003cth>What it scores from\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#Merchant\" data-term=\"Merchant\">Merchant\u003c/a>\u003c/td>\u003ctd>Account history, device, basket, delivery details\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Payment%20service%20provider\" data-term=\"Payment service provider\">Payment service provider\u003c/a>\u003c/td>\u003ctd>Patterns across its merchants\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Card%20network\" data-term=\"Card network\">Card network\u003c/a>\u003c/td>\u003ctd>Activity across its members\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Issuer\" data-term=\"Issuer\">Issuer\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"#Cardholder\" data-term=\"Cardholder\">Cardholder\u003c/a>'s spending and account behaviour\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The score is an input to a decision, and the action is set by thresholds.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Score band\u003c/th>\u003cth>Typical action\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Low\u003c/td>\u003ctd>Approve, possibly request an \u003ca href=\"#SCA%20exemption\" data-term=\"SCA exemption\">SCA exemption\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Medium\u003c/td>\u003ctd>Add \u003ca href=\"#3-D%20Secure\" data-term=\"3-D Secure\">3-D Secure\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>High\u003c/td>\u003ctd>Send to manual review\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Very high\u003c/td>\u003ctd>Block\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Scales are vendor-specific, so a score of 80 from one provider is not comparable with 80 from another.\u003c/p>\u003cp>The cost of false positives is easy to miss. A blocked legitimate customer rarely complains and may leave, so a dashboard can show falling fraud while revenue drops. Measure false declines by sampling blocked orders or holding back a small control group, where that is lawful and acceptable.\u003c/p>\u003cp>Training data has a built-in delay. Fraud labels often arrive weeks later through \u003ca href=\"#Chargeback\" data-term=\"Chargeback\">chargebacks\u003c/a>, and \u003ca href=\"#Friendly%20fraud\" data-term=\"Friendly fraud\">friendly fraud\u003c/a> can label genuine customers as criminals. Blocked orders also have no outcome, so a model learns only from what it allowed. Monitor for drift, and keep the score, model version and input features for each decision so it can be explained later.\u003c/p>\u003cp>Regulation can make risk analysis mandatory for some uses. Under EU Delegated Regulation 2018/389, a provider using the transaction risk analysis exemption must perform real-time analysis covering factors such as abnormal spending, unusual device information, known fraud scenarios and abnormal payer location.\u003c/p>","avoid":"","usage":["Fraud is down since we tightened the model, but so are sales.","The threshold's too aggressive. Send the middle band to 3DS rather than blocking it."],"out":[1,6,4,2,0,46,44,60,57]},{"name":"Chargeback","section":4,"description":"A forced reversal of a card payment, started by the issuer through the card network after a cardholder dispute.","body":"\u003cp>A chargeback is a forced reversal of a card payment, initiated by the \u003ca href=\"#Issuer\" data-term=\"Issuer\">issuer\u003c/a> through the \u003ca href=\"#Card%20network\" data-term=\"Card network\">card network\u003c/a>, usually after a \u003ca href=\"#Cardholder\" data-term=\"Cardholder\">cardholder\u003c/a> disputes a charge. The money is taken back from the \u003ca href=\"#Acquirer\" data-term=\"Acquirer\">acquirer\u003c/a>, which recovers it from the \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchant\u003c/a>. Visa's rules call this a Dispute, defined as a transaction an issuer returns to an acquirer, and Mastercard's call it a chargeback.\u003c/p>\u003cp>A chargeback differs from a \u003ca href=\"#Refund\" data-term=\"Refund\">refund\u003c/a>. A merchant chooses to issue a refund. A chargeback happens regardless of what the merchant wants, generally adds a fee, and counts toward the merchant's \u003ca href=\"#Chargeback%20ratio\" data-term=\"Chargeback ratio\">chargeback ratio\u003c/a>.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Stage\u003c/th>\u003cth>Visa term\u003c/th>\u003cth>Mastercard term\u003c/th>\u003cth>Who acts\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Claim\u003c/td>\u003ctd>Dispute\u003c/td>\u003ctd>First chargeback\u003c/td>\u003ctd>Issuer\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Merchant's challenge\u003c/td>\u003ctd>Dispute Response, or \u003ca href=\"#Pre-arbitration\" data-term=\"Pre-arbitration\">pre-Arbitration\u003c/a>\u003c/td>\u003ctd>Second presentment\u003c/td>\u003ctd>Acquirer, for merchant\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Further challenge\u003c/td>\u003ctd>Pre-Arbitration, or its response\u003c/td>\u003ctd>Pre-arbitration (optional)\u003c/td>\u003ctd>Depends on the flow\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Final decision\u003c/td>\u003ctd>Arbitration\u003c/td>\u003ctd>Arbitration\u003c/td>\u003ctd>The network decides\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Visa's flow depends on the category. For fraud and authorization disputes, the acquirer's first challenge is a pre-Arbitration. For processing errors and consumer disputes, it is a Dispute Response. The general term for the merchant's challenge is \u003ca href=\"#Representment\" data-term=\"Representment\">representment\u003c/a>.\u003c/p>\u003cp>Each case has a \u003ca href=\"#Dispute%20reason%20code\" data-term=\"Dispute reason code\">dispute reason code\u003c/a> that determines what evidence can win it. Time limits are strict and differ by network, reason and region, so use the dates your provider gives you and do not hard-code them.\u003c/p>\u003cp>Merchants usually discover a chargeback when a \u003ca href=\"#Payout\" data-term=\"Payout\">payout\u003c/a> arrives short, with the disputed amount and a fee deducted. The merchant can lose both the product and the money even when the sale was genuine, as with \u003ca href=\"#Friendly%20fraud\" data-term=\"Friendly fraud\">friendly fraud\u003c/a>.\u003c/p>\u003cp>Do not issue a refund after a chargeback has already been raised, because the customer may be paid twice. Handle disputes as a separate state in your \u003ca href=\"#Ledger\" data-term=\"Ledger\">ledger\u003c/a>, because funds can leave and return weeks apart.\u003c/p>","avoid":"","usage":["This payout is 240 short and I can't see why.","There's a chargeback on an order from May. The issuer pulled the funds, so check the response deadline."],"out":[2,4,0,3,1,20,65,63,62,64,23,57,109]},{"name":"Retrieval request","section":4,"description":"An issuer's request for a copy of a card transaction's details, used before or instead of raising a chargeback.","body":"\u003cp>A retrieval request is a request from an \u003ca href=\"#Issuer\" data-term=\"Issuer\">issuer\u003c/a>, sent through the \u003ca href=\"#Acquirer\" data-term=\"Acquirer\">acquirer\u003c/a>, for a copy of the records behind a card transaction. It is usually triggered when a \u003ca href=\"#Cardholder\" data-term=\"Cardholder\">cardholder\u003c/a> does not recognise a charge and the issuer wants more information. The request does not take money back from the \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchant\u003c/a>.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Step\u003c/th>\u003cth>Who\u003c/th>\u003cth>What happens\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Cardholder\u003c/td>\u003ctd>Queries a charge with the issuer\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Issuer\u003c/td>\u003ctd>Requests transaction information\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Acquirer or provider\u003c/td>\u003ctd>Passes the request to the merchant\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>Merchant\u003c/td>\u003ctd>Supplies a receipt, order details or other records\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Issuer\u003c/td>\u003ctd>Resolves the query, or may proceed to a \u003ca href=\"#Chargeback\" data-term=\"Chargeback\">chargeback\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A retrieval request leaves funds in place, while a chargeback pulls them from the merchant.\u003c/p>\u003cp>Availability differs by network, and this is where older guides are often wrong. Visa announced in August 2020 that it would sunset its retrieval request process after 16 October 2020, when signature capture became optional. Mastercard's Mastercom dispute system continues to document retrieval request and fulfilment functions for its members. Because many merchants reach these systems through a \u003ca href=\"#Payment%20service%20provider\" data-term=\"Payment service provider\">payment service provider\u003c/a>, whether you ever see one depends on the provider and network.\u003c/p>\u003cp>Where the process exists, a merchant may see a dashboard notice with a short response time. Ignoring it can remove the chance to resolve an innocent misunderstanding, and the issuer may go on to raise a dispute. Answer with clear records: the order date, amount, customer details, delivery confirmation and the exact \u003ca href=\"#Statement%20descriptor\" data-term=\"Statement descriptor\">statement descriptor\u003c/a>.\u003c/p>\u003cp>Do not include a full \u003ca href=\"#PAN\" data-term=\"PAN\">PAN\u003c/a> or \u003ca href=\"#CVV\" data-term=\"CVV\">CVV\u003c/a> in the documents you upload. Mask card numbers and follow \u003ca href=\"#PCI%20DSS\" data-term=\"PCI DSS\">PCI DSS\u003c/a> when storing or transmitting receipts.\u003c/p>\u003cp>Repeated requests from customers who do not recognise a charge usually point to a descriptor problem.\u003c/p>","avoid":"","usage":["The provider sent a retrieval request on a Mastercard sale. Is that a chargeback?","Not yet. No money has moved. Send the receipt and delivery proof so it doesn't become one."],"out":[2,3,0,1,60,6,35,24,26,37]},{"name":"Representment","section":4,"description":"The merchant's challenge to a chargeback, submitted through the acquirer with evidence that the charge was valid.","body":"\u003cp>Representment is the process of contesting a \u003ca href=\"#Chargeback\" data-term=\"Chargeback\">chargeback\u003c/a> by resubmitting the transaction with evidence that the charge was valid. The \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchant\u003c/a> prepares the case, and the \u003ca href=\"#Acquirer\" data-term=\"Acquirer\">acquirer\u003c/a> presents it to the \u003ca href=\"#Issuer\" data-term=\"Issuer\">issuer\u003c/a> through the \u003ca href=\"#Card%20network\" data-term=\"Card network\">card network\u003c/a>. The word is industry shorthand, and each network uses its own terms.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Network\u003c/th>\u003cth>Dispute type\u003c/th>\u003cth>Merchant's first challenge is called\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Visa\u003c/td>\u003ctd>Fraud and authorization (categories 10, 11)\u003c/td>\u003ctd>\u003ca href=\"#Pre-arbitration\" data-term=\"Pre-arbitration\">Pre-Arbitration\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Visa\u003c/td>\u003ctd>Processing errors and consumer (12, 13)\u003c/td>\u003ctd>Dispute Response\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Mastercard\u003c/td>\u003ctd>Chargebacks generally\u003c/td>\u003ctd>Second presentment\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The evidence must answer the specific \u003ca href=\"#Dispute%20reason%20code\" data-term=\"Dispute reason code\">dispute reason code\u003c/a>. A merchant facing a fraud claim submits a delivery receipt, but delivery alone does not show who placed the order. A merchant facing &quot;not as described&quot; sends proof of payment, which does not address the quality complaint.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Claim\u003c/th>\u003cth>Useful evidence\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Fraud, card-not-present\u003c/td>\u003ctd>\u003ca href=\"#3-D%20Secure\" data-term=\"3-D Secure\">3-D Secure\u003c/a> result, Visa Compelling Evidence if eligible\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Goods not received\u003c/td>\u003ctd>Carrier tracking to the \u003ca href=\"#Cardholder\" data-term=\"Cardholder\">cardholder\u003c/a>'s address\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Not as described\u003c/td>\u003ctd>Product description, correspondence, return policy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Credit not processed\u003c/td>\u003ctd>\u003ca href=\"#Refund\" data-term=\"Refund\">Refund\u003c/a> details and \u003ca href=\"#Acquirer%20reference%20number\" data-term=\"Acquirer reference number\">acquirer reference number\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Cancelled recurring\u003c/td>\u003ctd>Terms shown, consent, cancellation records\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Authorization-related\u003c/td>\u003ctd>Valid approval and timely \u003ca href=\"#Capture\" data-term=\"Capture\">capture\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Some disputes cannot be won with evidence of delivery. Visa's merchant guidance says that for authorization disputes, proof that the customer received the goods generally does not override a missing, expired or incorrectly used authorization.\u003c/p>\u003cp>Representment takes staff time and can add fees if it escalates, so accept disputes the merchant would lose. Winning returns the funds, though the original dispute may still count toward the \u003ca href=\"#Chargeback%20ratio\" data-term=\"Chargeback ratio\">chargeback ratio\u003c/a> depending on the network's method.\u003c/p>\u003cp>Deadlines are strict and set by network rules. A late response usually loses automatically, so route dispute notifications to a monitored queue, and rely on the due date your provider supplies.\u003c/p>","avoid":"","usage":["We sent the tracking number, and we still lost the fraud dispute.","Tracking shows delivery, not who bought it. For representment we needed the 3DS result or device history."],"out":[60,1,3,2,4,63,64,44,0,20,33,15,65]},{"name":"Pre-arbitration","section":4,"description":"The dispute stage after a challenged chargeback, giving both sides a last chance to settle before network arbitration.","body":"\u003cp>Pre-arbitration is the stage of a card dispute that follows an initial challenge, giving the \u003ca href=\"#Issuer\" data-term=\"Issuer\">issuer\u003c/a> and \u003ca href=\"#Acquirer\" data-term=\"Acquirer\">acquirer\u003c/a> a final chance to resolve the case before the \u003ca href=\"#Card%20network\" data-term=\"Card network\">card network\u003c/a> is asked to decide it. Who acts at this stage depends on the network and the type of dispute.\u003c/p>\u003cp>Visa's rules use two flows.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Stage\u003c/th>\u003cth>Fraud and authorization (categories 10, 11)\u003c/th>\u003cth>Processing and consumer (12, 13)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#Chargeback\" data-term=\"Chargeback\">Chargeback\u003c/a>\u003c/td>\u003ctd>Issuer raises a Dispute\u003c/td>\u003ctd>Issuer raises a Dispute\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Dispute Response\u003c/td>\u003ctd>Not a stage in this flow\u003c/td>\u003ctd>Acquirer responds\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Pre-Arbitration\u003c/td>\u003ctd>Acquirer challenges\u003c/td>\u003ctd>Issuer challenges\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Pre-Arbitration Response\u003c/td>\u003ctd>Issuer accepts or rejects\u003c/td>\u003ctd>Acquirer accepts or rejects\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Arbitration\u003c/td>\u003ctd>Acquirer may file\u003c/td>\u003ctd>Issuer may file\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>So in a Visa fraud dispute, pre-arbitration is the \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchant's\u003c/a> first challenge. In a consumer dispute, it is the issuer's reply to the merchant's evidence.\u003c/p>\u003cp>Mastercard works differently. After a chargeback and second presentment, the issuer may file an optional pre-arbitration case, and its Chargeback Guide says Mastercard strongly recommends skipping that step and going directly to an arbitration case.\u003c/p>\u003cp>In pre-arbitration, the two sides can still settle. In arbitration, the network reviews the case and issues a decision, and the losing side generally bears additional fees. Those fees can exceed the value of a small transaction.\u003c/p>\u003cp>For a merchant, this stage usually appears as a notice from the provider that a dispute it thought was finished has come back. Check whether new evidence addresses the objection, compare the transaction amount with the possible fees, and accept liability if the case is weak.\u003c/p>\u003cp>Time limits at this stage are short and differ by flow, so take them from your \u003ca href=\"#Payment%20service%20provider\" data-term=\"Payment service provider\">payment service provider\u003c/a>. Model each stage as a separate state, because a \u003ca href=\"#Representment\" data-term=\"Representment\">representment\u003c/a> win can be reopened.\u003c/p>","avoid":"","usage":["We won that dispute last month. Why is it back?","The issuer went to pre-arbitration. It's a 30-euro order, so accept it unless we have new evidence."],"out":[2,3,4,60,1,6,62]},{"name":"Dispute reason code","section":4,"description":"A network code stating why a card payment was disputed, which determines the evidence needed to respond.","body":"\u003cp>A dispute reason code is the value a \u003ca href=\"#Card%20network\" data-term=\"Card network\">card network\u003c/a> attaches to a \u003ca href=\"#Chargeback\" data-term=\"Chargeback\">chargeback\u003c/a> to state why the payment is being disputed. It tells the \u003ca href=\"#Merchant\" data-term=\"Merchant\">merchant\u003c/a> which rules apply and what evidence can answer the claim. Code sets are network-specific, so the same complaint can carry different labels.\u003c/p>\u003cp>Visa organises its codes as dispute conditions within four categories. Mastercard uses message reason codes.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Type of claim\u003c/th>\u003cth>Visa\u003c/th>\u003cth>Mastercard example\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Fraud\u003c/td>\u003ctd>Category 10, such as 10.4 Other Fraud, Card-Absent\u003c/td>\u003ctd>4837 No Cardholder Authorization\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Chip liability\u003c/td>\u003ctd>10.1 and 10.2, \u003ca href=\"#EMV\" data-term=\"EMV\">EMV\u003c/a> \u003ca href=\"#Liability%20shift\" data-term=\"Liability shift\">liability shift\u003c/a>\u003c/td>\u003ctd>4870 Chip Liability Shift\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Authorization\u003c/td>\u003ctd>Category 11, such as 11.3 No Authorization/Late Presentment\u003c/td>\u003ctd>4808 Authorization-related\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Processing error\u003c/td>\u003ctd>Category 12, such as 12.6 Duplicate Processing\u003c/td>\u003ctd>4834 Point-of-Interaction Error\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Consumer\u003c/td>\u003ctd>Category 13, such as 13.1 Not Received\u003c/td>\u003ctd>4853 Cardholder Dispute\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Examples are from Visa's October 2026 rules and Mastercard's May 2025 guide, and can change.\u003c/p>\u003cp>A reason code is different from a \u003ca href=\"#Decline%20code\" data-term=\"Decline code\">decline code\u003c/a>. A decline code explains why an authorization was refused at the time of payment. A reason code explains why a completed payment is being challenged afterward.\u003c/p>\u003cp>The code decides the strategy for \u003ca href=\"#Representment\" data-term=\"Representment\">representment\u003c/a>. A 13.1 &quot;not received&quot; claim can often be answered with carrier tracking. The same tracking does little against a 10.4 fraud claim, where the question is who made the purchase.\u003c/p>\u003cp>A customer who forgot a subscription may still be recorded under a fraud code, a common sign of \u003ca href=\"#Friendly%20fraud\" data-term=\"Friendly fraud\">friendly fraud\u003c/a>.\u003c/p>\u003cp>\u003ca href=\"#Payment%20service%20provider\" data-term=\"Payment service provider\">Payment service providers\u003c/a> often map raw codes to simplified categories such as &quot;fraudulent&quot; or &quot;product not received&quot;. Store the raw code and network too. Reporting by code also shows where to fix the source: rising 13.1 points to fulfilment, and rising 12.6 points to a \u003ca href=\"#Double%20charge\" data-term=\"Double charge\">double charge\u003c/a> bug.\u003c/p>","avoid":"","usage":["Should I send the delivery proof for this dispute?","Check the reason code first. It's a 10.4, so we need evidence of who bought it, not just where it went."],"out":[4,60,1,27,47,29,62,57,6,106]},{"name":"Chargeback ratio","section":4,"description":"A merchant's disputes relative to its transactions, calculated differently by each card network for risk monitoring.","body":"\u003cp>A chargeback ratio measures a
